# yaml-language-server: $schema=https://steve-allison.github.io/Central_Configs/schemas/resource-meta.schema.json
_meta:
  id: "config"
  title: "Config"
  version: "0.1.0"
  schema_version: "1.0.0"
  last_updated: "2026-08-15"
  authority: "LxD_Machine"
  status: "released"
  ontology_domain: "learning"
  ontology_version: "4.0.0"
  governing_schema: "ResourceSpecification"

paths:
  # Curated wiki — synthesised, deduplicated, cross-linked digest of the
  # raw Knowledge_Base research. Higher signal density and consistent
  # vocabulary give a better RAG surface than the raw corpus. Each page
  # carries a **Sources**: line that the ingest pipeline parses into
  # transitive citations attached to every chunk.
  corpus_path: /Users/steveallison/AI_Projects+Code/knowledge/wiki
  ontology_path: Yamls
  data_path: data/openai

ollama:
  url: http://localhost:11434

models:
  embed: text-embedding-3-small
  embed_dims: 1536
  embed_backend: openai
  llm: qwen3.5:4b
  rerank: qwen3-reranker:0.6b
  llm_no_think: true

openai:
  api_key_env: OPENAI_API_KEY
  model: text-embedding-3-small
  dims: 1536
  batch_size: 512
  max_workers: 8

chunking:
  strategy: hybrid_docling
  chunk_size: 256
  chunk_overlap: 50
  min_tokens: 20
  tokenizer_backend: tiktoken
  tokenizer_name: cl100k_base

embedding:
  timeout_secs: 60
  retry_attempts: 3
  retry_backoff:
    - 1
    - 2
    - 4
  query_instruction: null

corpus:
  text_extensions:
    - ".md"
    - ".docling.json"
    - ".docling.md"
  asset_extensions:
    - ".png"
  ignore_names:
    # macOS metadata
    - ".DS_Store"
    # Wiki meta files: high-volume operational logs and registers that
    # would otherwise dilute retrieval. _index.md and _glossary.md are
    # intentionally KEPT — both are pure RAG gold (TOC + canonical-term
    # registry). _log is the append-only operations log; _ingest-tracker
    # is meta-about-sources and would shadow real source pages.
    - "_log.md"
    - "_ingest-tracker.md"
  min_text_file_bytes: 1

assets:
  register_png: true
  infer_docling_parent: true

multimodal:
  captions_enabled: false
  caption_model: gpt-4o-mini
  caption_timeout_secs: 60
  caption_max_tokens: 200

ontology:
  include_globs:
    - "**/*.yaml"
  ignore_names: []

retrieval:
  dense_top_k: 20
  rerank_top_k: 20
  lexical_fusion_weight: 2.0
  relation_fusion_weight: 1.0
  hyde_enabled: true
  multi_query_enabled: true
  multi_query_count: 2
  graph_lane_enabled: true
  graph_lane_fusion_weight: 1.0
  max_graph_lane_hits: 10

reranker:
  backend: llama_cpp
  url: http://127.0.0.1:8012
  endpoint: /v1/rerank
  timeout_secs: 30
  # Opt-in second scorer (ColBERT) fused via RRF. Off by default — heavyweight.
  ensemble_enabled: false
  ensemble_secondary: colbert
  ensemble_secondary_weight: 1.0
  launch:
    auto_start: true
    executable: llama-server
    model_source: ollama_blob
    host: 127.0.0.1
    port: 8012
    startup_timeout_secs: 120
    extra_args: []

expansion:
  hops: 1
  max_terms: 12

relation_extraction:
  backend: openai
  fallback_backend: ollama
  openai_model: gpt-4o-mini
  ollama_model: qwen3:14b
  min_entity_mentions: 2
  max_relations_per_chunk: 15
  temperature: 0.0
  timeout_secs: 90

synthesis:
  max_chunks: 8
  timeout_secs: 60
  temperature: 0.1
  max_tokens: 1500

mcp:
  server_name: lxd-machine
  version: 0.1.0

logging:
  level: INFO
  format: json
