# Content Map Builder - Knowledge Corpus
# Version: 2.0
# Last Updated: 2026-02-12
#
# This YAML contains methodologies and templates extracted from ALL 17 learning
# design modules for the Content Map Builder PDL workflow.
#
# Sections:
# 0. Shared Rules (formatting, grounding, output)
# 0.1. Purpose & Role of Content Map - NEW in v2.0
# 0.2. Stakeholder Collaboration - NEW in v2.0
# 1. Content Mining (Module 08) - Extract structure from source materials
# 2. Course Architecture (Module 01)
# 2.1. Module 1 Requirements - NEW in v2.0
# 2.2. Module Narrative Frameworks - NEW in v2.0
# 3. Learning Structure (Module 02)
# 4. Timing Intelligence (Module 03a/b)
# 5. Learning Outcomes (Module 04)
# 6. Activity Design (Module 05, 07)
# 7. Assessment Design (Module 06)
# 8. Content Map Generation (Module 09, 10)
# 8.1. Information Scent Guidance - NEW in v2.0
# 9. Conditional Modules (11-17) - includes:
#    - Adult Learning (11)
#    - VILT/ILT (12)
#    - Debrief Protocol (13)
#    - Dialogic Learning (14)
#    - Roleplay Design (15)
#    - Scenario Learning (16)
#    - Social Learning (17)
# 10. Quality Validation (includes MECE Principle - NEW in v2.0)
#
# NEW IN v2.0:
# - Purpose & Role of Content Map (philosophical foundation)
# - Stakeholder Collaboration guidance (facilitates review & iteration)
# - Module 1 Requirements (introductory module structure)
# - MECE Principle (Mutually Exclusive, Collectively Exhaustive validation)
# - Information Scent Guidance (clear, navigable module/section naming)
# - Module Narrative Frameworks (How-To, Case Study structures)
# =============================================================================

# =============================================================================
# SECTION 0: SHARED RULES (NEW in v1.3)
# =============================================================================
shared_rules:
  formatting_rules: |
    FORMATTING RULES:
    - The full_report field should NOT include section headers like "## Section 1:" or "## Section 2:"
    - Start directly with content (e.g., "### Course Architecture" or "#### Module Breakdown:")
    - The output template will add section numbering automatically
    - Use markdown formatting (headers, lists, tables) for readability
    - Keep paragraphs concise (2-4 sentences max)
    - Use bullet points for lists of 3+ items

  grounding_rules: |
    GROUNDING RULES - USE ONLY PROVIDED DATA:
    - Quote exact figures from input for all metrics (course duration, module count, timing)
    - Reference exact course objectives provided - do NOT create new ones
    - Use specified delivery modality for activity adaptations
    - If data missing, state: "Not specified - recommend stakeholder input"
    - Include measurement methodology for timing estimates (how calculated)
    - Cite source for all content (from GGOO input or mined from source materials)

  output_json_rules: |
    JSON OUTPUT RULES:
    - All percentage fields must be integers (0-100), NOT decimals
    - All boolean fields must be true/false, NOT strings
    - All number fields must be numeric types, NOT strings
    - Array fields must be arrays, even if empty (use [], not null)
    - Use null for optional fields that are not applicable, NOT empty strings

# =============================================================================
# SECTION 0.1: PURPOSE & ROLE OF CONTENT MAP
# =============================================================================
purpose_and_role:
  definition: |
    The Content Map is a visual/tabular tool that aligns high-level learning
    objectives with detailed content, activities, and assessments. It connects
    WHAT is taught with WHY it is taught and WHERE it fits in the overall
    course flow.

  why_it_matters: |
    The Content Map serves as the central blueprint for learning design,
    ensuring every element of the course is purposeful, aligned, and traceable
    to learning outcomes and business objectives. It reveals gaps and redundancies,
    making the learning experience cohesive and learner-centered.

  core_functions:
    aligning_elements:
      description: "Aligns objectives, content, and activities"
      benefit: "Ensures every piece of content has a clear purpose and supports measurable objectives"
      validation_question: "Does each activity explicitly support a learning objective?"

    ensuring_logical_sequence:
      description: "Ensures logical sequence and cognitive progression"
      benefit: "Confirms foundational knowledge appears before advanced content or assessments"
      validation_question: "Are prerequisites clearly identified and properly sequenced?"

    preventing_gaps_and_overlaps:
      description: "Prevents gaps and overlaps in coverage"
      benefit: "Identifies where objectives are not fully covered or where content is unnecessarily repeated"
      validation_question: "Are all objectives covered without duplication?"

    facilitating_stakeholder_review:
      description: "Facilitates stakeholder review and approval"
      benefit: "Provides high-level reference for quick review, targeted feedback, and approval gates"
      validation_question: "Can stakeholders easily see how the course meets their requirements?"

    supporting_planning_and_iteration:
      description: "Supports resource planning and ongoing iteration"
      benefit: "Makes resource requirements (time, budget, tools) clear and enables updates as requirements evolve"
      validation_question: "Are resource needs identified and version history maintained?"

  living_document_philosophy:
    principle: "Content Map is a living document, not a one-time deliverable"
    lifecycle:
      design_phase: "Creates structure and alignment"
      development_phase: "Guides storyboard and content creation"
      pilot_phase: "Identifies high-priority or high-risk areas for testing"
      launch_phase: "Serves as reference for facilitators and stakeholders"
      maintenance_phase: "Updated iteratively as learning objectives evolve or feedback emerges"

    version_control:
      importance: "Maintain version history for traceability"
      practice: "Document changes with date, section, and rationale"
      review_cadence: "Schedule periodic reviews (quarterly or post-cohort) for continuous improvement"

  relationship_to_detailed_design:
    starting_point: "Content Map acts as guide for creating storyboards, lesson plans, detailed eLearning modules"
    resource_creation: "Designers and SMEs see exactly what must be developed, preventing duplication"
    prototyping: "Identifies high-priority or high-risk areas to pilot first"
    accessibility: "Embedding UDL considerations in Content Map ensures every module is inclusive"
    evaluation: "Mapping objectives to assessments sets stage for measuring course success"

# =============================================================================
# SECTION 0.2: STAKEHOLDER COLLABORATION
# =============================================================================
stakeholder_collaboration:
  purpose: |
    The Content Map facilitates collaboration among learning designers, SMEs,
    sponsors, instructors, and learners. Early and ongoing involvement ensures
    content accuracy, business alignment, and practical feasibility.

  stakeholder_roles:
    subject_matter_experts:
      involvement: "Content accuracy and relevance validation"
      when_to_involve: "Architecture design, content mining review, activity design"
      contribution: "Validate technical accuracy, provide real-world examples, identify common misconceptions"

    business_sponsors:
      involvement: "Alignment with business priorities and resource approval"
      when_to_involve: "Gap-to-objective traceability, ROI projection, scope approval"
      contribution: "Confirm business objectives are addressed, approve resource allocation, prioritize modules"

    instructors_facilitators:
      involvement: "Practical feasibility and delivery considerations"
      when_to_involve: "Activity design, timing validation, materials planning"
      contribution: "Identify logistical constraints, suggest engagement strategies, validate timing estimates"

    learners_representatives:
      involvement: "Relevance, usability, and learner perspective"
      when_to_involve: "Pilot review, accessibility validation, Module 1 framing"
      contribution: "Confirm relevance to job role, identify barriers to engagement, validate clarity"

  review_process:
    high_level_reference:
      principle: "Use Content Map as at-a-glance reference for quick review and approval"
      approach: "Share 7-column table + architecture summary (not full storyboards) for initial review"
      benefit: "Stakeholders can provide targeted feedback without being overwhelmed by detail"

    review_stages:
      stage_1_architecture:
        timing: "After course architecture and module structure designed"
        focus: "5-phase alignment, module count, gap coverage, objective traceability"
        approval_gate: "Proceed to detailed objectives and activity design"

      stage_2_objectives_and_activities:
        timing: "After learning objectives and activities designed"
        focus: "SMART compliance, activity-objective alignment, assessment strategy"
        approval_gate: "Proceed to content development and storyboarding"

      stage_3_final_content_map:
        timing: "After all sections complete, before development begins"
        focus: "Complete 7-column table, alignment matrix, materials list, timing validation"
        approval_gate: "Greenlight for storyboard and content development"

  iteration_and_maintenance:
    principle: "Content Map evolves with the course - treat it as living document"
    update_triggers:
      - "Learning objectives change based on stakeholder feedback"
      - "New content requirements emerge from pilot or early cohorts"
      - "Timing adjustments needed based on actual delivery experience"
      - "Technology or platform changes affect activity design"
      - "Business priorities shift, requiring content realignment"

    best_practices:
      - "Maintain version history with date, section changed, and rationale"
      - "Schedule post-cohort retrospectives to capture lessons learned"
      - "Update Content Map before major revisions or re-launches"
      - "Archive superseded versions for reference and compliance"

  collaboration_tools:
    documentation: "Use collaborative tools (SharePoint, Loop, Google Docs) for concurrent review"
    feedback_collection: "Track stakeholder comments directly in Content Map or adjacent tracker"
    approval_workflow: "Define clear approval process with sign-off at each review stage"
    communication: "Schedule review sessions; don't rely solely on asynchronous feedback"

# =============================================================================
# SECTION 1: CONTENT MINING (Module 08)
# =============================================================================
content_mining:
  expert_identity: |
    You are a Content Mining Specialist with expertise in semantic analysis and
    information architecture. You extract meaningful course structures from
    unstructured documents with 94% accuracy using Kintsch's semantic analysis
    theory and Rosenfeld-Morville information architecture principles.

  purpose: |
    Content Mining transforms raw source materials (documents, presentations,
    SME notes, existing training) into structured content that feeds the
    Content Map. It answers: "What content will be taught?"

  semantic_analysis_framework:
    description: "Extract meaningful structure from source materials"
    key_principle: "Semantic relationships matter more than document formatting"
    process:
      - step: "Analyze semantic content"
        action: "Identify conceptual relationships using meaning extraction"
      - step: "Cluster related concepts"
        action: "Group content by semantic similarity, not just headings"
      - step: "Build hierarchies"
        action: "Create logical structure based on dependencies"
      - step: "Map prerequisites"
        action: "Identify what must be learned before what"
      - step: "Validate flow"
        action: "Ensure progression supports cognitive load management"

  learning_flow_detection:
    description: "Identify prerequisite dependencies and cognitive progression"
    accuracy: "91%"
    rules:
      prerequisite_dependency: "MUST identify what knowledge comes before"
      complexity_progression: "MUST follow simple-to-complex patterns"
      conceptual_coherence: "MUST maintain logical relationship flows"
    key_insight: "Prerequisite mapping prevents 70% of learning comprehension issues"

  content_clustering:
    description: "Group related concepts to reveal learning pathways"
    approach:
      - "Extract candidate topics from source materials"
      - "Cluster by semantic relationship, not document structure"
      - "Remove duplicates and flag contradictions"
      - "Identify gaps where content is missing"
    output: "Topic clusters with relationships and dependencies"

  source_mapping:
    description: "Trace extracted content back to original sources"
    purpose: "Enable verification and evidence-based design"
    template: |
      | Topic | Source | Location | Confidence |
      |-------|--------|----------|------------|
      | [Topic] | [Document] | [Page/Section] | High/Medium/Low |

  quality_assessment:
    semantic_richness: "Content depth and concept density"
    pedagogical_patterns: "Instructional design quality in source"
    structure_clarity: "How well-organized the original material is"
    mining_potential: "Value for course development"

  output_structure:
    hierarchical_skeleton:
      - "Course overview with inferred objectives"
      - "Module structure with topic clusters"
      - "Learning flow with prerequisites"
      - "Content quality assessment"
    integration_with_ggoo: |
      Content Mining output combines with GGOO input:
      - GGOO provides: Gaps, Goals, Objectives, Outcomes (the "why")
      - Mining provides: Topics, Structure, Prerequisites (the "what")
      - Together they feed Course Architecture design

# =============================================================================
# SECTION 1: COURSE ARCHITECTURE
# =============================================================================
course_architecture:
  expert_identity: |
    You are a Learning Architect with expertise in curriculum development and
    instructional systems design. You implement 5-Phase Learning Cycle Theory
    (Kolb, 1984), ISD Principles (Dick & Carey, 2015), and Cognitive Load Theory
    (Sweller, 1988). You achieve 96% structure quality and 98% logical sequence
    validation through systematic learning progression design.

  five_phase_learning_cycle:
    purpose: "Structure transformational learning experiences for maximum effectiveness"
    phases:
      - phase: "Foundation"
        percentage: "10-15%"
        purpose: "Establish readiness, context, and motivation"
        mandatory_elements: ["Introduction module", "Context setting", "Prerequisite validation"]

      - phase: "Development"
        percentage: "30-40%"
        purpose: "Build foundational knowledge and core competencies"
        module_types: ["Core concept", "Advanced concept"]

      - phase: "Integration"
        percentage: "25-30%"
        purpose: "Apply knowledge through practice and real-world scenarios"
        module_types: ["Application challenge", "Problem-solving"]

      - phase: "Consolidation"
        percentage: "10-15%"
        purpose: "Solidify learning and prepare for transfer"
        module_types: ["Synthesis", "Review", "Transfer planning"]

      - phase: "Assessment"
        percentage: "10-15%"
        purpose: "Validate competency and provide certification"
        module_types: ["Summative assessment", "Final validation"]

  module_archetypes:
    core_concept:
      when_to_use: "Knowledge/Comprehension levels (Bloom's)"
      purpose: "Establish foundational understanding"
      cognitive_load: "Medium"

    application:
      when_to_use: "Application/Analysis levels"
      purpose: "Bridge theory to practice"
      cognitive_load: "High"

    integration_challenge:
      when_to_use: "Synthesis/Evaluation levels"
      purpose: "Combine multiple concepts for comprehensive competency"
      cognitive_load: "Very High"

  module_count_guidance:
    rule: "Determine module count based on course duration"
    guidelines:
      - duration: "2-4 hours"
        modules: "3-4"
      - duration: "4-8 hours"
        modules: "4-6"
      - duration: "1-2 days"
        modules: "5-7"
      - duration: "3+ days"
        modules: "6-8"

# =============================================================================
# SECTION 2.1: MODULE 1 REQUIREMENTS
# =============================================================================
module_1_requirements:
  mandate: "Module 1 should ALWAYS be the introductory module"
  purpose: "Establish context, motivation, and readiness before content delivery"

  required_elements:
    what_course_is_about:
      description: "Clear explanation of course focus and learning journey"
      guidance: "State course title, domain, and high-level overview (2-3 sentences)"
      example: "This course teaches consultative selling techniques to transform transactional sales conversations into value-based partnerships"

    why_it_matters_learner_perspective:
      description: "Relevance and value proposition from learner's point of view"
      guidance: "Connect course to learner's job role, challenges, and career goals (not just business objectives)"
      example: "Mastering consultative selling will help you build trust with prospects, close larger deals with less discounting, and become a trusted advisor—positioning you for top-performer recognition and career advancement"

    scope_what_will_be_covered:
      description: "Clear boundaries of what IS and IS NOT included"
      guidance: "List main modules/topics to be covered, and explicitly state out-of-scope items to manage expectations"
      example: |
        **We WILL cover:**
        - SPIN questioning framework
        - Discovery call structure
        - Value proposition articulation
        - Objection handling with consultative approach

        **We WILL NOT cover:**
        - Cold calling and prospecting (see 'Prospecting Fundamentals' course)
        - Negotiation and closing techniques (covered in advanced course)
        - CRM system training (handled by IT onboarding)

    prerequisites_and_assumptions:
      description: "Required knowledge, experience, or resources"
      guidance: "State what learners need to know or have before starting"
      example: "This course assumes 6+ months in a sales role, familiarity with your product/service, and access to Salesforce CRM"

    links_to_related_courses:
      description: "Where this course fits in the curriculum and what comes before/after"
      guidance: "Reference prerequisite courses and logical next steps in learning journey"
      example: |
        **Prerequisite:** Sales Fundamentals (recommended)
        **Follow-up courses:**
        - Advanced Negotiation Skills
        - Executive Stakeholder Engagement
        - Account-Based Selling Strategies

    success_criteria_expectations:
      description: "What good looks like at the end of the course"
      guidance: "Describe end-of-course competency and how learners will demonstrate mastery"
      example: "By course end, you will conduct a 45-minute consultative discovery call achieving 80% on our assessment rubric, and be ready to apply these skills in live client conversations"

  foundational_phase_alignment:
    principle: "Module 1 is the 'Foundation' phase of 5-phase learning cycle"
    percentage: "10-15% of total course duration"
    module_types: ["Introduction", "Context setting", "Prerequisite validation", "Motivation building"]

  module_1_structure_template:
    section_1_welcome_and_overview: "Course title, duration, modality, instructor intro (5-10% of Module 1)"
    section_2_why_this_matters: "Relevance from learner perspective, business context (15-20%)"
    section_3_what_you_will_learn: "Scope, key topics, learning outcomes (20-25%)"
    section_4_how_the_course_works: "Structure, activities, assessments, logistics (15-20%)"
    section_5_prerequisites_and_links: "Required knowledge, related courses (10-15%)"
    section_6_readiness_check: "Self-assessment or pre-test to validate prerequisites (15-20%)"
    section_7_lets_begin: "Transition to Module 2 with motivational close (5-10%)"

# =============================================================================
# SECTION 2.2: MODULE NARRATIVE FRAMEWORKS
# =============================================================================
module_narrative_frameworks:
  purpose: |
    Narrative frameworks provide proven structures for organizing module content
    based on learning objective type. Choose the framework that best matches the
    module's purpose and cognitive level.

  how_to_process_framework:
    when_to_use: "Procedural skills, step-by-step tasks, technical how-to training"
    cognitive_level: "Bloom's Apply (executing procedures in given situations)"
    characteristics:
      - "Clear goal and prerequisites stated upfront"
      - "Numbered steps in sequential order"
      - "Common pitfalls and success checks included"
      - "Practice application opportunities provided"

    structure:
      section_1_goal_and_prerequisites:
        content: "Outcome + required context/tools"
        timing: "10-15% of module"
        example: "By end of this module, you'll configure lead scoring rules in Salesforce. Prerequisites: Salesforce admin access, understanding of lead qualification criteria"

      section_2_steps:
        content: "Step 1, Step 2, Step 3, etc. (numbered, sequential)"
        timing: "50-60% of module"
        guidance: "Each step should have: action statement, explanation, visual/demo, example"
        example: |
          **Step 1:** Navigate to Setup > Lead Scoring
          **Step 2:** Define scoring criteria (engagement, fit, behavior)
          **Step 3:** Assign point values to each criterion
          **Step 4:** Set threshold for 'sales-ready' status
          **Step 5:** Test scoring with sample leads

      section_3_pitfalls_and_checks:
        content: "Common errors, success validation"
        timing: "15-20% of module"
        example: "Common mistake: Assigning too many points to single action. Success check: Run test leads through scoring model and validate output"

      section_4_practice_application:
        content: "Hands-on activity or scenario"
        timing: "15-20% of module"
        example: "Activity: Configure lead scoring for your territory using provided criteria template"

  case_study_framework:
    when_to_use: "Complex decision-making, real-world application, judgment in ambiguous situations"
    cognitive_level: "Bloom's Analyze/Evaluate (examining situations, making judgments)"
    characteristics:
      - "Realistic situation with authentic constraints"
      - "Multiple stakeholders and perspectives"
      - "Analysis of actions and consequences"
      - "Transferable lessons extracted"

    structure:
      section_1_situation:
        content: "Context, stakeholders, background"
        timing: "15-20% of module"
        example: "TechCorp faced declining win rates (45% to 32%) in enterprise deals. Sales reps were presenting product features rather than business value"

      section_2_challenge:
        content: "Problem statement, constraints, stakes"
        timing: "15-20% of module"
        example: "Challenge: Shift sales approach from product-centric to consultative without disrupting Q4 revenue. Constraint: Limited training time (2 days). Stakes: $2.4M revenue at risk"

      section_3_intervention:
        content: "Actions taken, rationale for decisions"
        timing: "25-30% of module"
        example: "Intervention: Implemented SPIN questioning framework, redesigned discovery call structure, provided coaching support for 90 days"

      section_4_results:
        content: "Outcomes, evidence, business impact"
        timing: "15-20% of module"
        example: "Results: Win rate recovered to 52% within 6 months, average deal size increased 18%, customer satisfaction improved (7.2 to 8.4 CSAT)"

      section_5_lessons_and_application:
        content: "Transferable insights, action for learner"
        timing: "15-20% of module"
        example: "Lessons: Consultative approach works when supported by structured framework + coaching. Your action: Identify one deal where consultative approach would improve outcomes"

  when_to_use_which_framework:
    how_to_process:
      - "Technical skills (software, equipment, processes)"
      - "Compliance procedures"
      - "Step-by-step workflows"
      - "Skill-based training with clear success criteria"

    case_study:
      - "Leadership development"
      - "Complex problem-solving"
      - "Interpersonal skills (coaching, negotiation)"
      - "Situations requiring judgment and adaptation"

# =============================================================================
# SECTION 3: LEARNING STRUCTURE
# =============================================================================
learning_structure:
  expert_identity: |
    You are a Curriculum Designer implementing Cognitive Load Theory,
    Scaffolding Theory, and Zone of Proximal Development. You achieve
    92% optimal structure creation and 88% cognitive load distribution.

  learning_strip_framework:
    description: "Break complex topics into cognitively manageable learning units"
    strip_types:
      - type: "Hook"
        purpose: "Engagement and motivation"
        duration: "5-10 minutes"

      - type: "Pre-train"
        purpose: "Foundation building"
        duration: "10-15 minutes"

      - type: "Teach"
        purpose: "Knowledge transfer"
        duration: "15-20 minutes"

      - type: "Practice"
        purpose: "Application focus"
        duration: "15-25 minutes"

      - type: "Test"
        purpose: "Assessment point"
        duration: "10-15 minutes"

  scaffolding_levels:
    high:
      when: "Early in learning sequence"
      characteristics:
        - "Detailed explanations and examples"
        - "Guided practice with immediate feedback"
        - "Error prevention built in"
        - "Multiple practice opportunities with coaching"

    medium:
      when: "Mid-sequence with some mastery"
      characteristics:
        - "Structured practice with periodic feedback"
        - "Some independent work with guidance available"
        - "Gradual increase in learner responsibility"

    low:
      when: "Advanced/mastery level"
      characteristics:
        - "Independent application"
        - "Minimal guidance or coaching"
        - "Self-assessment emphasis"
        - "Authentic performance demonstration"

  cognitive_load_rules:
    max_chunks: "7 plus or minus 2 items per segment"
    max_duration: "20 minutes before cognitive reset needed"
    complexity_progression: "Simple to complex, foundation before application"

# =============================================================================
# SECTION 3: TIMING INTELLIGENCE
# =============================================================================
timing_intelligence:
  expert_identity: |
    You are an Instructional Timing Specialist applying cognitive science
    research on attention spans, ultradian rhythms, and cognitive load
    distribution. You achieve 92% accuracy in timing estimates.

  session_timing_rules:
    attention_span: "45-60 minutes before break required"
    interaction_frequency: "Activity every 15-20 minutes"
    relevance_connection: "Link to learner experience within first 10 minutes"

  segment_formulas:
    content_delivery:
      lecture: "10-15 minutes maximum"
      demonstration: "15-20 minutes with practice"

    interactive:
      individual_activity: "10-15 minutes"
      pair_activity: "15-20 minutes"
      group_activity: "20-30 minutes"

    breaks:
      short_break: "5-10 minutes every 45 minutes"
      long_break: "15-20 minutes every 90 minutes"

  modality_adjustments:
    vilt:
      attention_reduction: "25% compared to ILT"
      interaction_increase: "40% more than ILT baseline"
      segment_duration: "Reduce by 20%"
      break_frequency: "Increase by 25%"

    ilt:
      peer_learning_increase: "75% more than virtual"
      group_activity_duration: "Can extend 25%"

    elearning:
      segment_max: "15 minutes per module"
      interactivity_requirement: "Minimum 1 interaction per 3 minutes"

# =============================================================================
# SECTION 4: LEARNING OBJECTIVES
# =============================================================================
learning_objectives:
  smart_framework:
    components:
      specific: "Clear, unambiguous action and outcome"
      measurable: "Quantifiable or observable criteria"
      achievable: "Realistic given time and resources"
      relevant: "Aligned to job performance need"
      time_bound: "Completion timeframe specified"

  ladder_up_validation:
    description: "Each module objective must explicitly support a course objective"
    template: |
      "[Module Objective ID] supports [Course Objective ID] by providing
      [specific skill/knowledge] which is a prerequisite for [higher-level capability]"

  blooms_verb_mapping:
    remember: ["define", "list", "identify", "name", "recall"]
    understand: ["describe", "explain", "summarize", "interpret", "classify"]
    apply: ["demonstrate", "use", "implement", "execute", "solve"]
    analyse: ["differentiate", "compare", "contrast", "examine", "analyse"]
    evaluate: ["assess", "critique", "judge", "justify", "recommend"]
    create: ["design", "develop", "construct", "produce", "formulate"]

# =============================================================================
# SECTION 5: ACTIVITY DESIGN
# =============================================================================
activity_design:
  expert_identity: |
    You are a Senior Learning Experience Designer with 15+ years designing
    engaging activities achieving 87% completion rates and 73% knowledge
    retention through evidence-based approaches.

  activity_types:
    individual:
      - type: "Reflection exercise"
        duration: "5-10 minutes"
        cognitive_level: ["Remember", "Understand"]

      - type: "Case analysis"
        duration: "15-20 minutes"
        cognitive_level: ["Analyse", "Evaluate"]

    pair:
      - type: "Think-pair-share"
        duration: "10-15 minutes"
        cognitive_level: ["Understand", "Apply"]

      - type: "Peer teaching"
        duration: "15-20 minutes"
        cognitive_level: ["Apply", "Create"]

    group:
      - type: "Scenario-based exercise"
        duration: "20-30 minutes"
        cognitive_level: ["Apply", "Analyse"]

      - type: "Role-play simulation"
        duration: "25-45 minutes"
        cognitive_level: ["Apply", "Evaluate"]

      - type: "Problem-solving challenge"
        duration: "30-45 minutes"
        cognitive_level: ["Analyse", "Create"]

  design_rationale_template: |
    "[Activity type] was chosen for [Objective ID] because it:
    - Matches the [Bloom's level] cognitive level required
    - Enables [specific observable behaviour]
    - Provides [type of practice/feedback]
    - Supports transfer through [authentic context element]"

  modality_adaptations:
    vilt:
      - "Use breakout rooms for small group activities"
      - "Leverage polling for quick engagement checks"
      - "Use annotation for collaborative exercises"
      - "Increase frequency of activities by 40%"

    ilt:
      - "Use physical movement and room rotations"
      - "Leverage flip charts and tactile materials"
      - "Enable spontaneous peer discussions"

    elearning:
      - "Use branching scenarios for decision practice"
      - "Include drag-and-drop interactions"
      - "Provide immediate feedback on all interactions"

