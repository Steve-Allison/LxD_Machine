    materials_resources_list:
      purpose: "Consolidate all required materials and technology"
      categories: ["Facilitator Materials", "Participant Materials", "Technology Requirements"]

# =============================================================================
# SECTION 8.1: INFORMATION SCENT GUIDANCE
# =============================================================================
information_scent_guidance:
  principle: |
    Information Scent (from Information Foraging Theory) ensures module titles,
    section headings, and key messages clearly signal the value and content within,
    allowing learners to efficiently navigate and understand what they'll learn.
    Strong information scent reduces cognitive load and improves learner engagement.

  purpose: "Create clear, navigable Content Maps where learners can quickly identify relevant content"

  naming_best_practices:
    use_action_verbs:
      guidance: "Start with verbs that describe what learners will DO"
      examples:
        poor: "Sales Techniques"
        good: "Conduct Discovery Calls Using SPIN Questioning"
        why_good: "Action verb 'Conduct' signals hands-on practice; 'SPIN Questioning' specifies the method"

    include_key_concept:
      guidance: "Name the specific concept, skill, or tool being developed"
      examples:
        poor: "Communication Skills"
        good: "Delivering Difficult Feedback with Empathy and Clarity"
        why_good: "Specifies 'difficult feedback' (not all communication) and desired qualities (empathy, clarity)"

    indicate_level:
      guidance: "Signal whether content is foundational, intermediate, or advanced"
      examples:
        poor: "Data Analysis"
        good: "Data Analysis Foundations: Descriptive Statistics for Beginners"
        why_good: "Clearly signals this is entry-level content focused on descriptive (not inferential) statistics"

    front_load_important_information:
      guidance: "Put most critical information first in title (learners scan left-to-right)"
      examples:
        poor: "A Comprehensive Guide to Understanding and Implementing Advanced Excel Formulas"
        good: "Advanced Excel Formulas: VLOOKUP, INDEX-MATCH, and Array Functions"
        why_good: "Starts with topic ('Advanced Excel Formulas') and lists specific functions upfront"

    be_specific_avoid_vagueness:
      guidance: "Use concrete terms rather than abstract concepts"
      examples:
        poor: "Improving Your Skills"
        good: "Reducing Project Delays Through Proactive Stakeholder Communication"
        why_good: "Specific outcome (reduce delays), specific method (proactive communication)"

  module_naming_examples:
    knowledge_level:
      poor: "Module 2: Selling"
      good: "Module 2: Identifying Customer Pain Points Using Discovery Questions"

    application_level:
      poor: "Module 3: Practice"
      good: "Module 3: Conducting 20-Minute Discovery Calls with Challenging Prospects"

    analysis_level:
      poor: "Module 4: Analysis"
      good: "Module 4: Diagnosing Why Deals Stall and Adjusting Your Approach"

  section_heading_guidance:
    principle: "Section headings within modules should create a clear logical flow"

    pattern_1_progressive_complexity:
      example: |
        Module: Conducting Discovery Calls
        - Section 1: What Makes a Discovery Call Effective (foundational)
        - Section 2: SPIN Questioning Framework (method)
        - Section 3: Handling Evasive or Hostile Prospects (advanced)
        - Section 4: Practice Discovery Call Scenarios (application)

    pattern_2_process_steps:
      example: |
        Module: Configuring Salesforce Lead Scoring
        - Section 1: Prerequisites and Access Requirements
        - Section 2: Step 1 - Define Scoring Criteria
        - Section 3: Step 2 - Assign Point Values
        - Section 4: Step 3 - Set Thresholds and Test

    pattern_3_problem_solution:
      example: |
        Module: Reducing Customer Churn
        - Section 1: The Churn Problem - Why Customers Leave
        - Section 2: Early Warning Signals - Identifying At-Risk Customers
        - Section 3: Proactive Retention Strategies
        - Section 4: Measuring Retention Success

  key_message_clarity:
    principle: "Each section should have a 1-sentence key message that answers 'What will I learn here?'"

    example_1:
      poor: "This section covers important concepts"
      good: "This section teaches you to identify the 5 early warning signals that predict customer churn"

    example_2:
      poor: "We'll discuss various techniques"
      good: "You'll practice using the SPIN framework to uncover prospect pain points in realistic scenarios"

  validation_checklist:
    title_clarity:
      question: "Can a learner predict module content from title alone?"
      test: "Show title to someone unfamiliar with course - can they describe what's covered?"

    heading_scent:
      question: "Do section headings create a logical, navigable structure?"
      test: "Read headings in sequence - do they tell a coherent story?"

    key_message_utility:
      question: "Does each key message answer 'What will I learn here?'"
      test: "Read key message - is it specific enough to set clear expectations?"

# =============================================================================
# SECTION 9: CONDITIONAL MODULES
# =============================================================================
conditional_modules:
  adult_learning:
    trigger: "Audience is adult professionals"
    principles:
      - "Self-direction: Allow choice in learning paths"
      - "Experience: Connect to prior knowledge"
      - "Relevance: Make immediate job connection"
      - "Problem-centred: Use realistic challenges"
    application: "Increase experience-based activities, reduce lecture"

  vilt_ilt:
    trigger: "delivery_modality in ['VILT', 'ILT']"
    session_architecture:
      kolb_cycle: ["Concrete Experience", "Reflective Observation", "Abstract Conceptualization", "Active Experimentation"]
      engagement_frequency: "Activity every 20 minutes maximum"
      break_pattern: "15 minutes every 90 minutes"

    vilt_specific:
      interaction_increase: "40% above baseline"
      technology_tools: ["Polls", "Breakout rooms", "Chat", "Annotation", "Whiteboard"]
      attention_management: "Camera on expectations, shorter segments"

    ilt_specific:
      physical_elements: ["Room movement", "Table rotations", "Flip charts", "Physical materials"]
      group_dynamics: "Leverage 75% more peer learning opportunity"

  roleplay_design:
    trigger: "Activity type requires role-play or simulation"
    structure:
      briefing: "5-10 minutes - context, roles, objectives"
      execution: "15-30 minutes - role-play activity"
      debrief: "10-15 minutes - reflection and learning extraction"
    role_types: ["Observer", "Participant", "Facilitator feedback provider"]

  scenario_learning:
    trigger: "Content requires decision-making practice"
    design_elements:
      - "Realistic context with authentic constraints"
      - "Multiple decision points with consequences"
      - "Progressive complexity through scenario"
      - "Feedback at decision points"
    complexity_levels: ["Linear", "Branching", "Open-ended"]

  social_learning:
    trigger: "Objectives require collaboration or peer interaction"
    strategies:
      - "Peer teaching and explanation"
      - "Collaborative problem-solving"
      - "Group project work"
      - "Discussion and debate"
    group_size_guidance:
      pair: "Knowledge sharing, peer feedback"
      small_group: "3-5 for problem-solving"
      large_group: "6-8 for diverse perspectives"

  debrief_protocol:
    trigger: "Activity includes simulation, roleplay, or experiential exercise"
    pearls_framework:
      description: "PEARLS (Reactions→Description→Analysis→Application) achieving 94% effectiveness"
      phases:
        - phase: "Reactions"
          percentage: "10-15%"
          purpose: "Process emotions and establish psychological safety"
          prompts:
            - "What was that like for you?"
            - "What surprised you most?"
            - "What's your immediate reaction?"
        - phase: "Description"
          percentage: "20-25%"
          purpose: "Build shared understanding of events"
          prompts:
            - "Help us understand - what happened first?"
            - "What were the key moments?"
        - phase: "Analysis"
          percentage: "35-40%"
          purpose: "Extract learning insights and understand causes"
          tools:
            - "Plus/Delta framework"
            - "Gap analysis"
            - "Advocacy-inquiry"
        - phase: "Application"
          percentage: "20-25%"
          purpose: "Create specific behavior change commitments"
          template: "I will [behavior] in [situation] by [date]"
    video_review:
      three_pass_method:
        - "Pass 1: General impressions without stopping"
        - "Pass 2: Skill-specific analysis with pause points"
        - "Pass 3: Pattern recognition across interactions"

  dialogic_learning:
    trigger: "Activity requires discussion, collaborative thinking, or peer dialogue"
    alexanders_five_principles:
      collective: "Everyone contributes - use round-robin, think-pair-share"
      reciprocal: "Genuine exchange - active listening, building on ideas"
      supportive: "Safe environment - tentative language, mistake celebration"
      cumulative: "Building understanding - idea threading, synthesis pauses"
      purposeful: "Learning-focused - objective visibility, progress checks"
    socratic_questioning:
      phases:
        - phase: "Clarification"
          purpose: "Establish shared vocabulary"
          example: "What do you mean by...?"
        - phase: "Assumptions"
          purpose: "Surface hidden beliefs"
          example: "What assumptions are we making?"
        - phase: "Evidence"
          purpose: "Require empirical support"
          example: "What evidence supports that?"
        - phase: "Perspectives"
          purpose: "Introduce alternatives"
          example: "What would someone who disagrees say?"
        - phase: "Implications"
          purpose: "Explore consequences"
          example: "What follows from that?"
        - phase: "Metacognition"
          purpose: "Reflect on thinking"
          example: "Why do you think I asked that?"
    participation_equity:
      small_group: "5-8: Round-robin with think time (100% participation)"
      medium_group: "9-15: Think-pair-share with structured reporting (95% inclusion)"
      large_group: "16+: Fishbowl or carousel protocols (91% voice representation)"

# =============================================================================
# SECTION 10: QUALITY VALIDATION
# =============================================================================
quality_validation:
  mece_principle:
    name: "MECE Principle (Mutually Exclusive, Collectively Exhaustive)"
    source: "McKinsey problem-solving framework adapted for learning design"
    purpose: "Ensure Content Map is logically structured with no overlaps and no gaps"

    mutually_exclusive:
      definition: "Each module covers distinct content with no overlap"
      validation_question: "Does any module repeat content covered in another module?"

      warning_signs:
        - "Same concepts taught in multiple modules without clear progression (e.g., 'SPIN questioning' in Module 2 AND Module 4)"
        - "Duplicate activities or assessments across modules"
        - "Learning objectives that overlap or conflict"
        - "Content that could be consolidated into fewer modules"

      validation_process:
        step_1: "List all key topics/concepts covered in each module"
        step_2: "Cross-reference topics across modules - flag duplicates"
        step_3: "For flagged duplicates, determine if it's intentional scaffolding or redundancy"
        step_4: "Eliminate true redundancy; preserve intentional spiral learning"

      acceptable_overlap:
        spiral_learning: "Revisiting concepts at higher cognitive levels (e.g., 'Define SPIN' in Module 1, 'Apply SPIN' in Module 3)"
        reinforcement: "Brief review of prerequisites before building on them"
        integration: "Combining multiple previously-taught concepts in capstone module"

      unacceptable_overlap:
        identical_content: "Teaching same concept at same cognitive level in multiple modules"
        copy_paste: "Duplicating entire sections across modules"
        redundant_practice: "Same activity repeated without clear rationale"

    collectively_exhaustive:
      definition: "All modules together fully address all course objectives and close all learning gaps"
      validation_question: "Are there course objectives or learning gaps not addressed by any module?"

      warning_signs:
        - "Course objectives with no supporting modules"
        - "Learning gaps identified in gap analysis but not addressed in any module"
        - "Skills required for final assessment but never taught"
        - "Prerequisites assumed but not validated or taught"

      validation_process:
        step_1: "Create traceability matrix: Course Objective → Supporting Modules"
        step_2: "Check each course objective - is it covered by at least one module?"
        step_3: "Check each learning gap - is it addressed by module content?"
        step_4: "Check final assessment - are all assessed skills taught?"

      coverage_checklist:
        - "Every course objective mapped to 1+ modules"
        - "Every learning gap mapped to 1+ modules"
        - "Every assessment task has prerequisite instruction"
        - "All prerequisite skills either taught or validated in Module 1"

    mece_validation_matrix:
      purpose: "Visual tool to validate MECE compliance"
      structure: |
        | Module | Key Topics | Course Objectives Supported | Gaps Addressed | Overlap Check | Coverage Check |
        |--------|------------|----------------------------|----------------|---------------|----------------|
        | Module 1 | [List] | [CO IDs] | [Gap IDs] | ✓/⚠/✗ | ✓/⚠/✗ |
        | Module 2 | [List] | [CO IDs] | [Gap IDs] | ✓/⚠/✗ | ✓/⚠/✗ |

      overlap_check_codes:
        "✓": "No overlap detected - content is distinct"
        "⚠": "Minor overlap - intentional scaffolding or review"
        "✗": "Significant overlap - redundancy needs resolution"

      coverage_check_codes:
        "✓": "Module covers assigned objectives/gaps completely"
        "⚠": "Partial coverage - may need enhancement"
        "✗": "Insufficient coverage - major gap exists"

    applying_mece_to_content_map:
      module_design:
        - "Each module should have a clear, distinct focus (Mutually Exclusive)"
        - "All course objectives should be addressed across modules (Collectively Exhaustive)"
        - "Module sequence should build logically without redundancy"

      activity_design:
        - "Each activity should target specific objective (Mutually Exclusive)"
        - "All objectives should have supporting activities (Collectively Exhaustive)"
        - "Avoid identical activities across modules"

      assessment_design:
        - "Each assessment should measure distinct competencies (Mutually Exclusive)"
        - "All objectives should be assessed (Collectively Exhaustive)"
        - "Assessment coverage matrix ensures complete evaluation"

  step_1_architecture:
    required_elements:
      - "All 5 phases represented with appropriate balance"
      - "Module count appropriate for duration"
      - "All learning gaps mapped to modules"
      - "All course objectives covered"
    validation_questions:
      - "Does the architecture follow 5-phase learning cycle?"
      - "Is module count appropriate for course duration?"
      - "Are all objectives and gaps traced to specific modules?"

  step_2_objectives:
    required_elements:
      - "SMART objectives for each module"
      - "Ladder-up validation for each objective"
      - "Gap thread maintained"
    validation_questions:
      - "Does each module have 2-3 SMART objectives?"
      - "Is ladder-up validation explicit for each objective?"
      - "Are gaps addressed through appropriate objectives?"

  step_3_activities:
    required_elements:
      - "Activity for each module objective"
      - "Design rationale for each activity"
      - "Modality adaptations specified"
      - "Assessment strategy complete"
    validation_questions:
      - "Does each objective have an aligned activity?"
      - "Is design rationale evidence-based?"
      - "Are modality-specific adaptations included?"

  step_4_assembly:
    required_elements:
      - "7-column Content Map table complete"
      - "Alignment validation matrix"
      - "Materials and resources list"
      - "Total timing validated"
    validation_questions:
      - "Are all modules represented in final table?"
      - "Does total timing match course duration?"
      - "Is traceability complete from gaps to outcomes?"

  grounding_rules:
    principle: "Use only data provided in input - never invent figures"
    applications:
      - "Quote exact duration from input"
      - "Reference exact course objectives provided"
      - "Use specified delivery modality for adaptations"
      - "If data missing, state 'Not specified - recommend obtaining from stakeholder'"

