id: https://steve-allison.github.io/Central_Configs/ontology/schema/terminology
name: coe_terminology
title: Central Configs Terminology Model
description: Concept-oriented naming for every semantic resource. A resource's label is its current official name; every
  other name it is known by — another full form, a short form, an acronym, a product code, a codename, a former name — is a
  Term carried inline on that resource. A name is never a resource of its own, so one meaning always has exactly one identity
  however many names it has.
version: 4.0.0
default_prefix: coe
default_range: string
prefixes:
  coe: https://steve-allison.github.io/Central_Configs/ontology/
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  skosxl: http://www.w3.org/2008/05/skos-xl#
  lexinfo: http://www.lexinfo.net/ontology/3.0/lexinfo#
imports:
- linkml:types
types:
  PartialDate:
    typeof: string
    base: str
    uri: http://id.loc.gov/datatypes/edtf/EDTF-level0
    pattern: ^\d{4}(-\d{2}(-\d{2})?)?$
    description: A calendar date at the precision a source gives — YYYY, YYYY-MM or YYYY-MM-DD — typed as an Extended
      Date/Time Format level 0 date (ISO 8601-2), so a year or month is a real date rather than a string.
classes:
  Term:
    class_uri: skosxl:Label
    description: One name, other than its label, by which a semantic resource is known. A term has no identifier of its own
      because it is a property of the resource it names; the same literal on two resources is a homonym and carries a usage
      note on each.
    attributes:
      literal:
        required: true
        slot_uri: skosxl:literalForm
        description: The exact written form of the name.
      term_type:
        required: true
        range: TermTypeEnum
        slot_uri: coe:termType
        description: The form of the name relative to the resource's label.
      term_status:
        required: true
        range: TermStatusEnum
        slot_uri: coe:termStatus
        description: Whether the name is correct in current use, was official and has been replaced, or must not be used.
      valid_from:
        range: PartialDate
        slot_uri: coe:validFrom
        description: Date the name came into use, when a source states it.
      valid_to:
        range: PartialDate
        slot_uri: coe:validTo
        description: Date the name stopped being official, when a source states it; never earlier than valid_from.
      usage_note:
        slot_uri: skos:scopeNote
        description: How to tell this resource apart from another resource that the same literal also names; required when
          the literal is shared.
enums:
  TermTypeEnum:
    description: Forms a name can take relative to the resource's label, following the LexInfo term types.
    permissible_values:
      full_form:
        meaning: lexinfo:fullForm
        description: Another complete name for the resource, such as an alternative or former official name.
      short_form:
        meaning: lexinfo:shortForm
        description: A shortened name made by dropping whole words from a full name, such as a product name without the
          vendor.
      acronym:
        meaning: lexinfo:acronym
        description: A name formed from the initial letters of a full name and pronounced as a word, such as DAM for
          digital asset management.
      initialism:
        meaning: lexinfo:initialism
        description: A name formed from the initial letters of a full name and pronounced letter by letter, such as AEM
          for Adobe Experience Manager.
      abbreviation:
        meaning: lexinfo:abbreviation
        description: A name formed by clipping or mixing parts of a full name other than whole words or initials, such as
          S3D for Substance 3D.
      product_code:
        meaning: lexinfo:symbol
        description: A vendor's short symbolic code for a product, shown as its icon glyph, such as Ps for Photoshop.
      codename:
        description: An internal or pre-release project name used before or alongside the official name; LexInfo has no
          equivalent term type.
  TermStatusEnum:
    description: Normative status of a name, following the LexInfo normative authorisations.
    permissible_values:
      admitted:
        meaning: lexinfo:admittedTerm
        description: Correct in current use alongside the label.
      superseded:
        meaning: lexinfo:supersededTerm
        description: Was an official name and has been replaced by the label; it still identifies the resource in older
          material.
      deprecated:
        meaning: lexinfo:deprecatedTerm
        description: Must not be used for this resource, although it occurs in practice.
