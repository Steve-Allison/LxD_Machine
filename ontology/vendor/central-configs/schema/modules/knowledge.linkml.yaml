id: https://steve-allison.github.io/Central_Configs/ontology/schema/knowledge
name: coe_knowledge
title: Central Configs Knowledge Model
version: 4.0.0
default_prefix: coe
default_range: string
prefixes:
  coe: https://steve-allison.github.io/Central_Configs/ontology/
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#
imports:
- linkml:types
- ./core.linkml
- ./portfolio.linkml
slots:
  in_scheme:
    domain: Concept
    range: Taxonomy
    inlined: false
    slot_uri: skos:inScheme
    description: Taxonomy that owns this concept membership.
  broader:
    domain: Concept
    range: Concept
    multivalued: true
    inlined: false
    inverse: narrower
    slot_uri: skos:broader
    description: Concept whose meaning properly includes this concept's meaning (skos:broader).
      Genuinely broader-than only — part-of and mere association are not broader and belong
      on typed SemanticEdges instead.
  narrower:
    domain: Concept
    range: Concept
    multivalued: true
    inlined: false
    inverse: broader
    slot_uri: skos:narrower
    description: Concept whose meaning is properly included in this concept's meaning
      (skos:narrower); the inverse of broader under the same broader-than test.
classes:
  KnowledgeArtifact:
    abstract: true
    is_a: SemanticResource
    description: Independently identifiable, reviewable, and reusable authored knowledge artifact.
    attributes:
      last_updated:
        required: true
        range: Date
        slot_uri: dcterms:modified
        description: Calendar date of the most recent authored change to this artifact.
  EntityCollection:
    is_a: KnowledgeArtifact
    class_uri: coe:EntityCollection
    attributes:
      entities:
        required: true
        range: OntologyEntity
        multivalued: true
        inlined_as_list: true
        slot_uri: dcterms:hasPart
        description: Complete authored membership of this collection.
    description: One reviewable set of a domain's entities, published and cited as a unit.
  Concept:
    is_a: SemanticResource
    class_uri: coe:Concept
    exact_mappings:
    - skos:Concept
    slots:
    - in_scheme
    - broader
    - narrower
    slot_usage:
      in_scheme:
        required: true
    description: One unit of meaning within a governed taxonomy (skos:Concept). Every concept
      declares its owning scheme and resolves without application context; hierarchy is
      expressed only through broader and narrower.
  Taxonomy:
    is_a: KnowledgeArtifact
    class_uri: skos:ConceptScheme
    description: One governed SKOS concept scheme; all concepts are members and only roots are top concepts.
    attributes:
      concepts:
        required: true
        range: Concept
        multivalued: true
        inlined_as_list: true
        slot_uri: dcterms:hasPart
        description: Complete authored membership; RDF top-concept semantics are emitted only from top_concepts.
      top_concepts:
        required: true
        minimum_cardinality: 1
        range: Concept
        multivalued: true
        inlined: false
        slot_uri: skos:hasTopConcept
        description: Concepts at the roots of this scheme's broader/narrower hierarchy
          (skos:hasTopConcept).
  Criterion:
    is_a: SemanticResource
    class_uri: coe:Criterion
    description: One judgeable quality property named for use inside a scoring model; its
      weight and score bounds are library knowledge, not part of its meaning.
  ScoringDimension:
    is_a: Criterion
    class_uri: coe:ScoringDimension
    attributes:
      criteria:
        range: Criterion
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:criterion
        description: Nested criteria refining this dimension.
    description: One dimension of a scoring model, defined in prose and refined by nested
      criteria; the score levels a consumer judges it against live in the library.
  ScoringModel:
    is_a: KnowledgeArtifact
    class_uri: coe:ScoringModel
    attributes:
      dimensions:
        range: ScoringDimension
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:dimension
        description: Dimensions this model judges quality on.
    description: One named instrument for judging artifact quality by its prose dimensions;
      its numeric scoring lives in the library.
  DomainModule:
    tree_root: true
    class_uri: coe:DomainModule
    slots:
    - _meta
    slot_usage:
      _meta:
        required: true
    description: Focused authored module belonging to exactly one canonical domain bundle.
    attributes:
      module_id:
        identifier: true
        required: true
        range: uriorcurie
        slot_uri: dcterms:identifier
        description: Stable identifier of this module, referenced by exactly one domain bundle.
      domain:
        required: true
        range: OntologyDomainEnum
        slot_uri: coe:homeDomain
        description: Canonical domain that owns every resource authored in this module.
      entity_collections:
        range: EntityCollection
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:entity_collections
        description: Entity collections authored in this module.
      taxonomies:
        range: Taxonomy
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:taxonomies
        description: Concept schemes authored in this module.
      scoring_models:
        range: ScoringModel
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:scoring_models
        description: Scoring models authored in this module.
      organisations:
        range: Organisation
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:organisations
        description: Organisations authored in this module.
      business_units:
        range: BusinessUnit
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:businessUnits
        description: Business units authored in this module.
      product_families:
        range: ProductFamily
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:productFamilies
        description: Product families authored in this module.
      applications:
        range: Application
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:applications
        description: Applications authored in this module.
      platforms:
        range: Platform
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:platforms
        description: Platforms authored in this module.
      editions:
        range: Edition
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:editions
        description: Editions authored in this module.
      surfaces:
        range: Surface
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:surfaces
        description: Surfaces authored in this module.
      add_ons:
        range: AddOn
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:addOns
        description: Add-ons authored in this module.
      services:
        range: Service
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:services
        description: Services authored in this module.
      managed_services:
        range: ManagedService
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:managedServices
        description: Managed services authored in this module.
      ai_models:
        range: AIModel
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:aiModels
        description: AI models authored in this module.
      agents:
        range: Agent
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:agents
        description: Agents authored in this module.
      capabilities:
        range: Capability
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:capabilities
        description: Capabilities authored in this module.
      standards:
        range: Standard
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:standards
        description: Standards authored in this module.
      frameworks:
        range: Framework
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:frameworks
        description: Frameworks authored in this module.
      framework_stages:
        range: FrameworkStage
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:frameworkStages
        description: Framework stages authored in this module.
      industry_categories:
        range: IndustryCategory
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:industryCategories
        description: Industry categories authored in this module.
      practices:
        range: Practice
        multivalued: true
        inlined_as_list: true
        slot_uri: coe:practices
        description: Practices authored in this module.
  DomainBundle:
    class_uri: coe:DomainBundle
    slots:
    - _meta
    slot_usage:
      _meta:
        required: true
    description: Complete manifest for exactly one canonical domain.
    attributes:
      bundle_id:
        identifier: true
        required: true
        range: uriorcurie
        slot_uri: dcterms:identifier
        description: Stable identifier of this bundle.
      domain:
        required: true
        range: OntologyDomainEnum
        slot_uri: coe:homeDomain
        description: Canonical domain this bundle is the complete manifest for.
      modules:
        required: true
        minimum_cardinality: 1
        range: DomainModule
        multivalued: true
        inlined: false
        slot_uri: dcterms:hasPart
        description: Every focused module belonging to this domain; at least one.
