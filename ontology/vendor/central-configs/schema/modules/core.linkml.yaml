id: https://steve-allison.github.io/Central_Configs/ontology/schema/core
name: coe_core
title: Central Configs Core Semantic Model
version: 4.0.0
default_prefix: coe
default_range: string
prefixes:
  coe: https://steve-allison.github.io/Central_Configs/ontology/
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  owl: http://www.w3.org/2002/07/owl#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#
  skosxl: http://www.w3.org/2008/05/skos-xl#
  sh: http://www.w3.org/ns/shacl#
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
- linkml:types
- ./terminology.linkml
types:
  Date:
    typeof: date
    base: str
    uri: xsd:date
    description: ISO 8601 calendar date.
  DateTime:
    typeof: datetime
    base: str
    uri: xsd:dateTime
    description: ISO 8601 date-time.
slots:
  id:
    identifier: true
    required: true
    range: uriorcurie
    slot_uri: dcterms:identifier
    description: Stable identifier for an identified resource.
  label:
    required: true
    slot_uri: rdfs:label
    description: Human-readable label for an identified resource.
  description:
    slot_uri: dcterms:description
    description: Description of an identified resource.
  home_domain:
    range: OntologyDomainEnum
    slot_uri: coe:homeDomain
    description: Canonical semantic owner of a domain-owned resource.
  status:
    range: LifecycleStatusEnum
    slot_uri: coe:status
    description: Lifecycle status of a semantic resource.
  version:
    required: true
    pattern: ^\d+\.\d+\.\d+$
    slot_uri: dcterms:hasVersion
    description: Semantic version of the resource that carries it. Only the distribution
      manifest is versioned; ordinary authored artifacts carry no version because Git
      is their history.
  terms:
    range: Term
    multivalued: true
    inlined_as_list: true
    slot_uri: skosxl:altLabel
    description: Every name other than its label by which this resource is known, each typed and dated; the label stays
      the one current official name.
  edges:
    range: SemanticEdge
    multivalued: true
    inlined_as_list: true
    slot_uri: coe:edge
    description: Canonical semantic relationships authored from this resource.
  _meta:
    range: FileMeta
    inlined: true
    slot_uri: coe:_meta
    description: Typed metadata for an authored instance root.
classes:
  FileMeta:
    class_uri: coe:FileMeta
    description: Machine-validated metadata for one authored instance root; LinkML schemas use native SchemaDefinition metadata.
    attributes:
      file_id:
        identifier: true
        required: true
        range: uriorcurie
        slot_uri: dcterms:identifier
        description: Stable identifier naming this authored file, distinct from the semantic
          identifiers of the resources the file contains.
      title:
        required: true
        slot_uri: dcterms:title
        description: Human-readable title of the authored file.
      last_updated:
        required: true
        range: Date
        slot_uri: dcterms:modified
        description: Calendar date of the most recent authored change to this file.
      authority:
        required: true
        range: FileAuthorityEnum
        slot_uri: coe:authority
        description: Repository that owns and maintains this authored file.
      scope:
        required: true
        range: FileScopeEnum
        slot_uri: coe:scope
        description: Kind of authored root this file is; determines whether ontology_domain
          is required.
      ontology_domain:
        range: OntologyDomainEnum
        slot_uri: coe:ontology_domain
        description: Canonical domain that owns this file's contents. Required for domain
          scope and absent for non-domain roots.
      governing_class:
        required: true
        range: string
        pattern: ^[A-Za-z][A-Za-z0-9_]*:[A-Za-z][A-Za-z0-9_]*$
        slot_uri: coe:governing_class
        description: CURIE of the LinkML class this file's root instance validates against.
  IdentifiedThing:
    abstract: true
    class_uri: coe:IdentifiedThing
    description: Identifiable record with a stable URI and human-readable label.
    slots:
    - id
    - label
    - description
  Versioned:
    abstract: true
    mixin: true
    class_uri: coe:Versioned
    slots:
    - version
    description: Mixin granting an explicit semantic version. Applied only where the version
      is itself authoritative shared meaning — the distribution manifest — never to ordinary
      authored artifacts, whose history lives in Git.
  SemanticResource:
    abstract: true
    is_a: IdentifiedThing
    class_uri: coe:SemanticResource
    description: One first-class meaning owned by exactly one canonical domain. Its provenance is the Git history of the
      file that defines it, never a field of its own.
    slots:
    - home_domain
    - status
    - terms
    - edges
    slot_usage:
      home_domain:
        required: true
    attributes:
      exact_match:
        multivalued: true
        slot_uri: skos:exactMatch
        description: External identifiers whose meaning is interchangeable with this resource
          (skos:exactMatch).
      close_match:
        multivalued: true
        slot_uri: skos:closeMatch
        description: External identifiers whose meaning closely approximates this resource
          without being interchangeable (skos:closeMatch).
  Statement:
    abstract: true
    class_uri: rdf:Statement
    description: One addressable semantic statement authored in canonical predicate direction.
    attributes:
      statement_id:
        identifier: true
        required: true
        range: uriorcurie
        slot_uri: dcterms:identifier
        description: Stable identifier making this statement itself addressable and citable.
      subject_id:
        required: true
        range: SemanticResource
        inlined: false
        slot_uri: rdf:subject
        description: Resource the statement is about; resolves to a SemanticResource identifier.
      predicate:
        required: true
        range: AuthoredPredicateEnum
        slot_uri: rdf:predicate
        description: Canonical-direction predicate relating subject to object; one of the
          authorable predicates in AuthoredPredicateEnum.
      object_id:
        required: true
        range: SemanticResource
        inlined: false
        slot_uri: rdf:object
        description: Resource the statement relates the subject to; resolves to a SemanticResource
          identifier.
      home_domain:
        required: true
        range: OntologyDomainEnum
        slot_uri: coe:homeDomain
        description: Canonical domain that owns and curates this statement.
      description:
        slot_uri: dcterms:description
        description: Optional prose qualifying the statement beyond what subject, predicate,
          and object already convey.
  SemanticEdge:
    is_a: Statement
    class_uri: coe:SemanticEdge
    description: One first-class canonical relationship between semantic resources.
    unique_keys:
      semantic_triple:
        unique_key_slots:
        - subject_id
        - predicate
        - object_id
    attributes:
      relationship_weight:
        required: true
        range: RelationshipWeightEnum
        slot_uri: coe:relationshipWeight
        description: How binding this relationship is for consumers — required, expected,
          or optional.
  OntologyEntity:
    is_a: SemanticResource
    class_uri: coe:OntologyEntity
    attributes:
      description:
        required: true
        slot_uri: dcterms:description
        description: Complete definition of this entity, sufficient to apply or reject it
          without consulting application context.
      examples:
        multivalued: true
        slot_uri: skos:example
        description: Positive instances that fall under this entity, sharpening its boundary — items a subject expert would
          give when explaining what the entity means. A phrase that only signals the entity in text is a library recognition
          surface, not an example.
      anti_examples:
        multivalued: true
        slot_uri: coe:antiExample
        description: Near-miss instances that do not fall under this entity, marking its
          boundary against confusable neighbours in meaning. A phrase that merely shares words with the entity's names is a
          library negative surface, not an anti-example.
    description: One named unit of domain meaning — the entity that recognition,
      retrieval, and semantic edges attach to; how to recognise it in text is library knowledge. Distinguished from Concept by standing alone
      rather than as a member of a governed taxonomy.
enums:
  OntologyDomainEnum:
    permissible_values:
      ai:
        description: Subject domain owning AI systems, techniques, and prompt-engineering meaning.
      adobe:
        description: Organisation domain owning Adobe products, technologies, brand concepts,
          and Adobe user and learner profiles.
      business:
        description: Subject domain owning commercial meaning — buyer personas, sales vocabulary,
          and commercial rubrics.
      narrative:
        description: Craft domain owning story, discourse, and argumentation structure.
      learning:
        description: Subject domain owning instructional design, assessment, and learner meaning.
      delivery:
        description: Craft domain owning spoken and performed delivery — vocal pacing and presence.
      visual_communication:
        description: Craft domain owning visual design, slide, and data-visualisation meaning.
      language_editorial:
        description: Craft domain owning lexicon, style, tone, and language accessibility.
    description: The eight canonical domains that exhaustively partition ownership of shared
      meaning across three tiers — Craft (narrative, visual_communication, language_editorial,
      delivery), Subject (learning, business, ai), and Organisation (adobe).
  LifecycleStatusEnum:
    permissible_values:
      draft:
        description: Authored but not yet reviewed; consumers must not rely on it.
      candidate:
        description: Reviewed and proposed for canonical status; stable enough to trial.
      canonical:
        description: Settled shared meaning; the default state consumers rely on.
      retired:
        description: Withdrawn from use and retained only for reference; never cited by new work.
    description: Curation states a semantic resource moves through; only canonical resources
      are settled shared meaning.
  FileAuthorityEnum:
    permissible_values:
      Central_Configs:
        description: This repository — the sole authority for every file authored under
          ontology/; no other value exists because Central describes only what it owns.
    description: Repository authorised to own a file authored in this repository. The
      vocabulary is closed at Central itself; a consuming project's file metadata is
      defined by that project's own application profile, never here.
  FileScopeEnum:
    permissible_values:
      domain:
        description: DomainModule root owned by exactly one canonical domain.
      distribution:
        description: OntologyDistribution manifest root.
      stewardship:
        description: Stewardship record such as the domain registry.
      schema:
        description: Reserved for schema-scoped records; LinkML schema files themselves use
          native SchemaDefinition metadata, never _meta.
      library:
        description: LibraryModule or LibraryDistribution root under library/ — shared craft
          knowledge keyed to ontology identifiers, authored in this repository beside the ontology.
      pack:
        description: PackDefinition root under packs/ — declares one self-contained domain pack that stage-packs builds
          from the ontology and the library.
    description: Kinds of authored root a file in this repository may declare; domain roots
      additionally name their owning domain.
  RelationshipWeightEnum:
    permissible_values:
      required:
        description: Consumers must honour the relationship; ignoring it is an error.
      expected:
        description: Consumers should honour the relationship and justify exceptions.
      optional:
        description: Available context; consumers may ignore it freely.
    description: How binding a canonical relationship is for consumers.
  AuthoredPredicateEnum:
    description: Canonical-direction authorable predicates; inverse directions are generated
      only. Each value's meaning URI resolves to the canonical-direction slot in the relations
      module, which carries the definitive description and logical characteristics — defining
      them here as well would create a second authority.
    permissible_values:
      coe:supports:
        meaning: coe:supports
      coe:bridges:
        meaning: coe:bridges
      coe:limits:
        meaning: coe:limits
      coe:rebuts:
        meaning: coe:rebuts
      coe:contains:
        meaning: coe:contains
      coe:triggers:
        meaning: coe:triggers
      coe:resolves:
        meaning: coe:resolves
      coe:precedes:
        meaning: coe:precedes
      coe:specialises:
        meaning: coe:specialises
      coe:enables:
        meaning: coe:enables
      coe:contrasts_with:
        meaning: coe:contrasts_with
