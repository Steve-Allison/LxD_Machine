_meta:
  file_id: coe:file/domain/ai/ai_systems_taxonomy
  title: Ai — Ai Systems Taxonomy
  last_updated: '2026-09-01'
  authority: Central_Configs
  scope: domain
  ontology_domain: ai
  governing_class: coe:DomainModule
module_id: coe:module/ai/ai_systems_taxonomy
domain: ai
taxonomies:
- last_updated: '2026-09-01'
  id: coe:artifact/ai/ai_systems_taxonomy
  label: AI Systems Taxonomy
  description: Classification of AI-assisted content generation approaches by method type, prompt pattern, retrieval strategy,
    pipeline stage, and evaluation dimension
  home_domain: ai
  status: canonical
  concepts:
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    id: coe:concept/ai_systems_taxonomy/method_type
    label: AI Method Type
    description: The fundamental approach to using AI for content generation
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/method_type
    id: coe:concept/ai_systems_taxonomy/method_type/prompt_engineering
    label: Prompt Engineering
    description: 'The AI method that guides model behaviour solely by crafting the input text, leaving model weights unmodified and drawing knowledge only from the prompt context rather than external retrieval or training data.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/method_type
    id: coe:concept/ai_systems_taxonomy/method_type/rag
    label: RAG
    description: 'The AI method that augments generation by retrieving relevant content from an external knowledge store at query time, distinguishing it from siblings that rely only on the prompt, pre-loaded context, or model weights.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/method_type
    id: coe:concept/ai_systems_taxonomy/method_type/fine_tuning
    label: Fine Tuning
    description: 'The AI method that adapts a model''s weights by training on domain-specific data for specialised behaviour — the only method type that modifies the model itself rather than its inputs or context.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/method_type
    id: coe:concept/ai_systems_taxonomy/method_type/cag
    label: CAG
    description: 'The AI method that pre-loads the full knowledge base into the model''s context window (cache/context-augmented generation), eliminating runtime retrieval — suited to small, stable corpora and low-latency or offline use where RAG''s retrieval step is unnecessary.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/method_type
    id: coe:concept/ai_systems_taxonomy/method_type/agentic
    label: Agentic
    description: 'The AI method in which the model plans multi-step work, invokes tools, and iterates toward a goal, rather than producing output in a single prompted pass.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/method_type
    id: coe:concept/ai_systems_taxonomy/method_type/pdl_declarative
    label: PDL Declarative
    description: 'The AI method that expresses prompt programs in IBM''s Prompt Declaration Language, a declarative format that makes multi-step LLM pipelines structured and reproducible rather than hand-assembled per run.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    id: coe:concept/ai_systems_taxonomy/prompt_pattern
    label: Prompt Pattern
    description: The structural pattern used in prompt construction
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/prompt_pattern
    id: coe:concept/ai_systems_taxonomy/prompt_pattern/zero_shot
    label: Zero Shot
    description: 'The prompt pattern that issues a direct instruction with no worked examples, relying entirely on the model''s pretrained capability.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/prompt_pattern
    id: coe:concept/ai_systems_taxonomy/prompt_pattern/few_shot
    label: Few Shot
    description: 'The prompt pattern that includes a small set of input/output examples (typically 2-5) in the prompt to calibrate the model''s behaviour before the actual task.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/prompt_pattern
    id: coe:concept/ai_systems_taxonomy/prompt_pattern/chain_of_thought
    label: Chain Of Thought
    description: 'The prompt pattern that elicits explicit step-by-step reasoning before the final answer (chain-of-thought prompting, per Wei et al.), improving multi-step problem performance over direct answering.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/prompt_pattern
    id: coe:concept/ai_systems_taxonomy/prompt_pattern/tree_of_thought
    label: Tree Of Thought
    description: 'The prompt pattern that explores multiple reasoning branches and selects the most promising path — generalising chain-of-thought''s single linear trace into a search over a tree of intermediate thoughts (tree-of-thoughts, per Yao et al.).'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/prompt_pattern
    id: coe:concept/ai_systems_taxonomy/prompt_pattern/react
    label: ReAct
    description: 'The prompt pattern that interleaves reasoning traces with tool-using action steps (ReAct, per Yao et al.), letting each action''s observation inform the next thought instead of separating reasoning from acting.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/prompt_pattern
    id: coe:concept/ai_systems_taxonomy/prompt_pattern/self_consistency
    label: Self Consistency
    description: 'The prompt pattern that samples multiple independent reasoning paths and selects the most common answer (self-consistency, per Wang et al.), trading additional inference for reliability over a single reasoning chain.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/prompt_pattern
    id: coe:concept/ai_systems_taxonomy/prompt_pattern/role_prompting
    label: Role Prompting
    description: 'The prompt pattern that assigns the model a persona or expert identity to shape the style, depth, and framing of its response, rather than altering the task instruction itself.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/prompt_pattern
    id: coe:concept/ai_systems_taxonomy/prompt_pattern/decomposition
    label: Decomposition
    description: 'The prompt pattern that breaks a complex task into sequential sub-tasks with intermediate outputs, each feeding the next, instead of prompting for the end result in a single pass.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    id: coe:concept/ai_systems_taxonomy/retrieval_strategy
    label: Retrieval Strategy
    description: The approach used to find and surface relevant context
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/retrieval_strategy
    id: coe:concept/ai_systems_taxonomy/retrieval_strategy/dense_retrieval
    label: Dense Retrieval
    description: 'The retrieval strategy that matches queries to passages by semantic similarity of embedding vectors, capturing paraphrase and meaning that keyword matching misses, at the cost of embedding-quality dependence and compute.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/retrieval_strategy
    id: coe:concept/ai_systems_taxonomy/retrieval_strategy/sparse_retrieval
    label: Sparse Retrieval
    description: 'The retrieval strategy that matches on keyword statistics such as TF-IDF or BM25 — fast, interpretable, and faithful to exact terms, but blind to synonyms and vocabulary mismatch, in contrast to dense retrieval.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/retrieval_strategy
    id: coe:concept/ai_systems_taxonomy/retrieval_strategy/hybrid_retrieval
    label: Hybrid Retrieval
    description: 'The retrieval strategy that combines dense and sparse retrieval and fuses their results, balancing semantic recall against exact-term precision at the cost of tuning complexity.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/retrieval_strategy
    id: coe:concept/ai_systems_taxonomy/retrieval_strategy/multi_hop
    label: Multi Hop
    description: 'The retrieval strategy that retrieves iteratively, using each step''s results to inform the next query, so evidence spread across multiple linked documents can be assembled progressively.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    id: coe:concept/ai_systems_taxonomy/pipeline_stage
    label: Pipeline Stage
    description: The phase within an AI content generation pipeline
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/pipeline_stage
    id: coe:concept/ai_systems_taxonomy/pipeline_stage/ingestion
    label: Ingestion
    description: 'The pipeline stage that loads, parses, and preprocesses source documents, turning raw inputs into text and metadata the downstream stages can consume.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/pipeline_stage
    id: coe:concept/ai_systems_taxonomy/pipeline_stage/chunking
    label: Chunking
    description: 'The pipeline stage that splits ingested documents into retrieval-sized segments, choosing split strategy and overlap so each chunk stands alone as a unit of retrieval.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/pipeline_stage
    id: coe:concept/ai_systems_taxonomy/pipeline_stage/embedding
    label: Embedding
    description: 'The pipeline stage that converts text chunks into vector representations via an embedding model, producing the numeric form that indexing and dense retrieval operate on.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/pipeline_stage
    id: coe:concept/ai_systems_taxonomy/pipeline_stage/indexing
    label: Indexing
    description: 'The pipeline stage that stores embeddings and their metadata in a searchable vector store, making the processed corpus queryable by the retrieval stage.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/pipeline_stage
    id: coe:concept/ai_systems_taxonomy/pipeline_stage/retrieval
    label: Retrieval
    description: 'The pipeline stage that queries the index to find the chunks most relevant to a given input, supplying the context that generation will consume.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/pipeline_stage
    id: coe:concept/ai_systems_taxonomy/pipeline_stage/reranking
    label: Reranking
    description: Post-retrieval pipeline stage that reorders the candidate passages returned by a first-stage retriever so
      the most relevant context enters generation. A stage rather than a retrieval strategy — it presupposes dense, sparse,
      or hybrid first-stage retrieval and composes with all of them.
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/pipeline_stage
    id: coe:concept/ai_systems_taxonomy/pipeline_stage/generation
    label: Generation
    description: 'The pipeline stage that produces the final output by applying the LLM to a prompt assembled from the task and any retrieved context.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/pipeline_stage
    id: coe:concept/ai_systems_taxonomy/pipeline_stage/evaluation
    label: Evaluation
    description: 'The pipeline stage that assesses generated output against quality criteria — via LLM judges, metric scorers, or human review — closing the loop on the pipeline.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    id: coe:concept/ai_systems_taxonomy/evaluation_dimension
    label: Evaluation Dimension
    description: Criteria for assessing the quality of AI-generated output and the operational performance of the system that
      produces it
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/evaluation_dimension
    id: coe:concept/ai_systems_taxonomy/evaluation_dimension/factual_accuracy
    label: Factual Accuracy
    description: 'The evaluation dimension measuring whether the claims in generated output are true and correctly grounded in the source or established knowledge, as distinct from how well-formed or on-topic the text is.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/evaluation_dimension
    id: coe:concept/ai_systems_taxonomy/evaluation_dimension/coherence
    label: Coherence
    description: 'The evaluation dimension measuring whether generated output holds together logically and reads as a connected whole — internal consistency and flow, independent of whether its claims are true.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/evaluation_dimension
    id: coe:concept/ai_systems_taxonomy/evaluation_dimension/relevance
    label: Relevance
    description: 'The evaluation dimension measuring how directly the generated output addresses the given query or task, regardless of its accuracy or fluency.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/evaluation_dimension
    id: coe:concept/ai_systems_taxonomy/evaluation_dimension/completeness
    label: Completeness
    description: 'The evaluation dimension measuring whether generated output covers everything the task requires, leaving no required aspect of the query or source material unaddressed — the recall-side counterpart to relevance.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/evaluation_dimension
    id: coe:concept/ai_systems_taxonomy/evaluation_dimension/style_alignment
    label: Style Alignment
    description: 'The evaluation dimension measuring how well generated output conforms to the intended voice, tone, and formatting conventions, as distinct from what it says.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/evaluation_dimension
    id: coe:concept/ai_systems_taxonomy/evaluation_dimension/hallucination_rate
    label: Hallucination Rate
    description: 'The evaluation dimension measuring how often generated output contains fabricated content unsupported by the source or context — the unsupported-content counterpart of factual accuracy, scored as a rate rather than a correctness judgment.'
    home_domain: ai
    status: canonical
  - in_scheme: coe:artifact/ai/ai_systems_taxonomy
    broader:
    - coe:concept/ai_systems_taxonomy/evaluation_dimension
    id: coe:concept/ai_systems_taxonomy/evaluation_dimension/latency
    label: Latency
    description: Time the system takes to produce its output — an operational performance dimension of the producing system,
      not a property of the generated content
    home_domain: ai
    status: canonical
  top_concepts:
  - coe:concept/ai_systems_taxonomy/method_type
  - coe:concept/ai_systems_taxonomy/prompt_pattern
  - coe:concept/ai_systems_taxonomy/retrieval_strategy
  - coe:concept/ai_systems_taxonomy/pipeline_stage
  - coe:concept/ai_systems_taxonomy/evaluation_dimension
