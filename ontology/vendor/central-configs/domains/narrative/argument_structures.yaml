      statement_id: coe:edge/fe47418a3dcd195fa7781063
      home_domain: narrative
    - subject_id: coe:entity/mentor
      predicate: coe:supports
      object_id: coe:entity/hero
      relationship_weight: required
      description: The hero receives guidance, tools, and wisdom from the mentor per Campbell's Monomyth Stage 4 Meeting the
