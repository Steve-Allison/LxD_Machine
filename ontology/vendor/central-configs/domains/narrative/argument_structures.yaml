      statement_id: coe:edge/97ce8990db01f62e003f42ba
      home_domain: narrative
    - subject_id: coe:entity/villain
      predicate: coe:supports
      object_id: coe:entity/pain_point
      relationship_weight: expected
      description: In StoryBrand the villain IS the problem — legacy systems, competitive threats, internal resistance manifest
