  - id: coe:entity/governing_thought
    label: Governing Thought
    description: The one statement a unit of communication exists to convey, stated as a full sentence that every part of
      the unit supports and that summarises those parts. Units of thought nest — a series, a deliverable such as a deck,
      document or video, a section, a beat, and in prose a paragraph — and each carries exactly one governing thought at its
      own level, whose supporting parts are units with governing thoughts of their own. A slide, card, page or frame is a
      rendering container, never a unit of thought; one beat may span several slides or build states, and one slide may
      show several states of a beat. A topic label names a subject without stating a thought.
    home_domain: narrative
    status: canonical
    edges: []
    examples:
    - Q3 revenue beat target because the enterprise launch landed early.
    - Our onboarding loses a third of new sellers in week two, and a guided first call fixes it.
    - Short, answer-first paragraphs let an executive decide in one reading.
    anti_examples:
    - Q3 Financial Results
    - Onboarding
    - A few thoughts on customer retention
  - id: coe:entity/mece_group
    label: Mece Group
    description: A logical grouping of supporting arguments that is Mutually Exclusive (no overlaps) and Collectively Exhaustive
      (no gaps) within a Minto Pyramid level.
    home_domain: narrative
    status: canonical
    edges: []
    examples:
