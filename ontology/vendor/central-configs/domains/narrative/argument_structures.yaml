      description: Minto Pyramid and Mayer's multimedia principles are complementary halves of one deck-quality model — Minto
        governs the argument layer (answer-first ordering so each unit of thought, from the deck down to each beat, carries one governing thought) while
        Mayer governs the media layer (managing channel and cognitive load within each slide); deck generation applies both
        frameworks to the same artifact
      statement_id: coe:edge/minto-bridges-mayers-multimedia-principles
      home_domain: narrative
