      statement_id: coe:edge/76621b8872599b8a2e5a7d5c
      home_domain: narrative
    - subject_id: coe:entity/hero
      predicate: coe:enables
      object_id: coe:entity/pathos_appeal
      relationship_weight: optional
      description: The hero's emotional journey of frustration, struggle, and triumph enables pathos-driven engagement with
        the audience
      statement_id: coe:edge/053b1cb7497347d85dfaf2fa
      home_domain: narrative
    - subject_id: coe:entity/hero
      predicate: coe:precedes
      object_id: coe:entity/threshold_guardian
