      statement_id: coe:edge/576aba1f5a2366146e7ff8aa
      home_domain: narrative
    - subject_id: coe:entity/vendor_as_mentor
      predicate: coe:supports
      object_id: coe:entity/customer_hero
      relationship_weight: required
      description: Customer-as-Hero requires Vendor-as-Mentor — StoryBrand SB7 framework mandates customer is protagonist
