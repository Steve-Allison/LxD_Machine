    home_domain: narrative
    status: canonical
    examples:
    - ACME Corporation faced a critical challenge.
    - Their team of 50 engineers needed to...
    - The retail giant that transformed its supply chain.
    - A mid-market company who took the leap.
    - Their IT director took the bold decision.
    - The customer who proved it was possible.
  - edges:
    - subject_id: coe:entity/vendor_as_mentor
      predicate: coe:specialises
      object_id: coe:entity/mentor
      relationship_weight: required
      description: Vendor-as-mentor is a B2B specialisation of the mentor archetype
      statement_id: coe:edge/e346932afe76028d8fab0458
      home_domain: narrative
    - subject_id: coe:entity/vendor_as_mentor
      predicate: coe:contains
      object_id: coe:entity/value_proposition
      relationship_weight: expected
      description: The mentor role contains the value proposition — the mentor's tools/plan IS the product's value proposition
