        arc and creates stakes
      statement_id: coe:edge/587f2b13f182c1cb29afab72
      home_domain: narrative
    id: coe:entity/hero
    label: Hero
    description: The central figure who faces a challenge and undergoes transformation through action
    home_domain: narrative
    status: canonical
    examples:
    - She stepped up when no one else would.
    - He overcame years of resistance to change.
    - They took action where others hesitated.
    - Our team led the transformation.
    - The customer who faced this challenge...
    - I decided to do something different.
    - Against the odds, they succeeded.
  - edges:
    - subject_id: coe:entity/mentor
      predicate: coe:enables
      object_id: coe:entity/customer_hero
      relationship_weight: expected
      description: SOAR research positions the company/product as the guide enabling the customer hero — position your customer
        as the hero and your product or team as the guide that helped them per SOAR Storytelling research
      statement_id: coe:edge/fc560599b4832f4194a817a8
      home_domain: narrative
    - subject_id: coe:entity/mentor
      predicate: coe:enables
      object_id: coe:entity/ethos_appeal
      relationship_weight: expected
