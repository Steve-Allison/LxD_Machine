      statement_id: coe:edge/d197a80d77e2395d7fce8c4e
      home_domain: narrative
    - subject_id: coe:entity/mentor
      predicate: coe:enables
      object_id: coe:entity/value_proposition
      relationship_weight: expected
      description: The mentor role enables the value proposition by framing the vendor's contribution as guidance rather than
        heroism, making the solution credible
      statement_id: coe:edge/065b671994a4e92219760289
      home_domain: narrative
    - subject_id: coe:entity/mentor
      predicate: coe:supports
      object_id: coe:entity/ally
      relationship_weight: optional
      description: The ally's effectiveness is often enabled by the mentor's guidance — allies may be recruited or empowered
