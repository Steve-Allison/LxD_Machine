      statement_id: coe:edge/7b06dc36a3f10336500d542a
      home_domain: narrative
    - subject_id: coe:entity/villain
      predicate: coe:precedes
      object_id: coe:entity/resolution_signal
      relationship_weight: expected
      description: The villain's obstacle must be established before the resolution can be meaningful — the challenge precedes
