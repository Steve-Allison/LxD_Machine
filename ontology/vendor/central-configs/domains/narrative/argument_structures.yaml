        the Lie while the mentor presents the Truth
      statement_id: coe:edge/8ec53ccd1c2fefef3fab0080
      home_domain: narrative
    id: coe:entity/mentor
    label: Mentor
    description: The wise figure who provides knowledge, tools, or encouragement to the hero
    home_domain: narrative
    status: canonical
    examples:
    - Her manager saw the potential and coached her.
    - The consultant who guided us through...
    - Adobe's team helped us navigate the change.
    - He taught me everything I needed to know.
    - The advisor who showed them the path.
    - With their guidance, we were able to...
  - edges:
    - subject_id: coe:entity/villain
      predicate: coe:triggers
      object_id: coe:entity/narrative_tension
      relationship_weight: required
      description: The villain creates narrative tension by embodying the External, Internal, and Philosophical obstacles
