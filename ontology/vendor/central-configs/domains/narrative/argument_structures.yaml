bundle_id: coe:domain/narrative/argument_structures
domain: narrative
version: 4.0.0
entity_collections:
- entities:
  - recognition_patterns:
    - stepped up \w+
    - overcame \w+
    - took (action|charge|initiative)
    - led the \w+
    - against the odds
    edges:
    - subject_id: coe:entity/hero
      predicate: coe:enables
      object_id: coe:entity/narrative_tension
      relationship_weight: required
      description: The hero's journey generates narrative tension through Want vs Need conflict and escalating complications
        across the three-act structure
    - subject_id: coe:entity/hero
      predicate: coe:enables
      object_id: coe:entity/pathos_appeal
      relationship_weight: optional
      description: The hero's emotional journey of frustration, struggle, and triumph enables pathos-driven engagement with
        the audience
    - subject_id: coe:entity/hero
      predicate: coe:bridges
      object_id: coe:entity/situation_marker
      relationship_weight: expected
      description: The hero archetype bridges to the SOAR Situation stage where the protagonist and their context are established
        for the audience
    - subject_id: coe:entity/hero
      predicate: coe:precedes
      object_id: coe:entity/threshold_guardian
      relationship_weight: expected
      description: The hero must pass the threshold guardian's test before crossing into the Special World at Stage 5 of the
        Hero's Journey
    - subject_id: coe:entity/hero
      predicate: coe:contrasts_with
      object_id: coe:entity/villain
      relationship_weight: required
      description: The hero faces the villain as the primary opposing force; transformation is defined by overcoming the antagonist's
        challenge | The villain is the force of opposition the hero must overcome; their conflict drives the entire narrative
        arc and creates stakes
    id: coe:entity/hero
    label: Hero
    description: The central figure who faces a challenge and undergoes transformation through action
    home_domain: narrative
    status: canonical
    ner_label: HERO
    examples:
    - She stepped up when no one else would.
    - He overcame years of resistance to change.
    - They took action where others hesitated.
    - Our team led the transformation.
    - The customer who faced this challenge...
    - I decided to do something different.
    - Against the odds, they succeeded.
    confidence_threshold: 0.68
  - recognition_patterns:
    - (guided|coached|taught|mentored) \w+
    - showed (us|them|her|him) (the|a) \w+
    - with (their|his|her) (guidance|help|support)
    - (mentor|advisor|coach) who \w+
    edges:
    - subject_id: coe:entity/mentor
      predicate: coe:enables
      object_id: coe:entity/customer_hero
      relationship_weight: expected
      description: SOAR research positions the company/product as the guide enabling the customer hero — position your customer
        as the hero and your product or team as the guide that helped them per SOAR Storytelling research
    - subject_id: coe:entity/mentor
      predicate: coe:enables
      object_id: coe:entity/ethos_appeal
      relationship_weight: expected
      description: The mentor role requires demonstrating Empathy and Authority, directly enabling the ethos rhetorical appeal
        per StoryBrand SB7 framework
    - subject_id: coe:entity/mentor
      predicate: coe:enables
      object_id: coe:entity/value_proposition
      relationship_weight: expected
      description: The mentor role enables the value proposition by framing the vendor's contribution as guidance rather than
        heroism, making the solution credible
    - subject_id: coe:entity/mentor
      predicate: coe:supports
      object_id: coe:entity/ally
      relationship_weight: optional
      description: The ally's effectiveness is often enabled by the mentor's guidance — allies may be recruited or empowered
        through the mentor's influence
    - subject_id: coe:entity/mentor
      predicate: coe:supports
      object_id: coe:entity/hero
      relationship_weight: required
      description: The hero receives guidance, tools, and wisdom from the mentor per Campbell's Monomyth Stage 4 Meeting the
        Mentor | The mentor provides the hero with tools, wisdom, or plan to succeed; in B2B the vendor must occupy mentor
        role per SOAR Narrative Mapping
    - subject_id: coe:entity/mentor
      predicate: coe:supports
      object_id: coe:entity/threshold_guardian
      relationship_weight: expected
      description: The mentor's guidance and tools help the hero overcome the threshold guardian's tests at the boundary of
        the Special World
    - subject_id: coe:entity/mentor
      predicate: coe:contrasts_with
      object_id: coe:entity/villain
      relationship_weight: expected
      description: Mentor and villain represent opposing influences on the hero — the villain embodies the Lie while the mentor
        presents the Truth per StoryBrand | Villain and mentor represent opposing influences on the hero — the villain embodies
        the Lie while the mentor presents the Truth
    id: coe:entity/mentor
    label: Mentor
    description: The wise figure who provides knowledge, tools, or encouragement to the hero
    home_domain: narrative
    status: canonical
    ner_label: MENTOR
    examples:
    - Her manager saw the potential and coached her.
    - The consultant who guided us through...
    - Adobe's team helped us navigate the change.
    - He taught me everything I needed to know.
    - The advisor who showed them the path.
    - With their guidance, we were able to...
    confidence_threshold: 0.68
  - recognition_patterns:
    - \w+ (blocked|threatened|derailed|disrupted)
    - stood in the way
    - (resistance|opposition) (to|from)
    - nearly (failed|collapsed|derailed)
    edges:
    - subject_id: coe:entity/villain
      predicate: coe:triggers
      object_id: coe:entity/narrative_tension
      relationship_weight: required
      description: The villain creates narrative tension by embodying the External, Internal, and Philosophical obstacles
        that drive the story's conflict per StoryBrand
    - subject_id: coe:entity/villain
      predicate: coe:supports
      object_id: coe:entity/pain_point
      relationship_weight: expected
      description: In StoryBrand the villain IS the problem — legacy systems, competitive threats, internal resistance manifest
        as audience-recognised pain points
    - subject_id: coe:entity/villain
      predicate: coe:precedes
      object_id: coe:entity/resolution_signal
      relationship_weight: expected
      description: The villain's obstacle must be established before the resolution can be meaningful — the challenge precedes
        the payoff in narrative structure
    id: coe:entity/villain
    label: Villain
    description: The force of opposition — could be a competitor, market condition, or internal resistance
    home_domain: narrative
    status: canonical
    ner_label: VILLAIN
    examples:
    - The legacy system that blocked their progress.
    - Competitors who threatened their market share.
    - Internal resistance stood in the way.
    - Budget cuts that nearly derailed the project.
    - The fear that stopped them from acting.
    - Market disruption threatened everything.
    confidence_threshold: 0.65
  - recognition_patterns:
    - \w+ (forced|triggered|prompted|sparked) \w+
    - changed everything
    - the (announcement|event|moment) that \w+
    - what started \w+
    edges:
    - subject_id: coe:entity/herald
      predicate: coe:bridges
      object_id: coe:entity/narrative_hook
      relationship_weight: expected
      description: The herald functions as a narrative hook by introducing the catalytic disruption that captures attention
        and sets the story in motion
    - subject_id: coe:entity/herald
      predicate: coe:bridges
      object_id: coe:entity/opportunity_marker
      relationship_weight: required
      description: The herald archetype bridges to the SOAR Opportunity stage where the gap or threat that creates urgency
        for action is articulated
    - subject_id: coe:entity/herald
      predicate: coe:triggers
      object_id: coe:entity/hero
      relationship_weight: required
      description: The herald delivers the Call to Adventure (Stage 2) that disrupts the hero's Ordinary World and initiates
        the journey per Campbell's Monomyth
    - subject_id: coe:entity/herald
      predicate: coe:triggers
      object_id: coe:entity/narrative_tension
      relationship_weight: expected
      description: The herald triggers narrative tension by posing the major dramatic question that the story must answer
        per three-act structure
    - subject_id: coe:entity/herald
      predicate: coe:supports
      object_id: coe:entity/villain
      relationship_weight: expected
      description: The herald announces or signals the villain's disruption — the Call to Adventure reveals the problem the
        villain represents | The herald announces or reveals the villain's disruption — the Call to Adventure exposes the
        problem or challenge the villain represents
    - subject_id: coe:entity/herald
      predicate: coe:precedes
      object_id: coe:entity/threshold_guardian
      relationship_weight: expected
      description: The herald's Call to Adventure (Stage 2) precedes the threshold guardian's test at the boundary between
        Ordinary and Special Worlds (Stage 5)
    id: coe:entity/herald
    label: Herald
    description: The event, person, or signal that calls the hero to action and sets the story in motion
    home_domain: narrative
    status: canonical
    ner_label: HERALD
    examples:
    - The pandemic forced a complete rethink.
    - A data breach that changed everything.
    - When the CEO announced the new strategy...
    - The announcement that triggered the journey.
    - A customer complaint that started it all.
    - The market shift that forced our hand.
    confidence_threshold: 0.65
  - recognition_patterns:
    - (final|first|main) (hurdle|barrier|obstacle)
    - (approval|compliance|security) (was|blocked|stopped)
    - before (they|we) could (proceed|continue|start)
    - (procurement|legal|IT) (process|review|gate)
    edges:
    - subject_id: coe:entity/threshold_guardian
      predicate: coe:limits
      object_id: coe:entity/hero
      relationship_weight: required
      description: The threshold guardian tests, blocks, or limits the hero's progress, forcing readiness proof before entering
        the Special World
    - subject_id: coe:entity/threshold_guardian
      predicate: coe:triggers
      object_id: coe:entity/narrative_tension
      relationship_weight: expected
      description: The threshold guardian raises narrative tension by presenting a test or barrier that must be overcome before
        the journey can continue
    - subject_id: coe:entity/threshold_guardian
      predicate: coe:supports
      object_id: coe:entity/villain
      relationship_weight: optional
      description: Threshold guardians can serve as agents of the villain's opposition, representing early obstacles in the
        escalating series of complications
    id: coe:entity/threshold_guardian
    label: Threshold Guardian
    description: A test, barrier, or gatekeeper that must be passed before progress can continue
    home_domain: narrative
    status: canonical
    ner_label: THRESHOLD_GUARDIAN
    examples:
    - Legal approval was the final hurdle.
    - The IT security review that nearly stopped the project.
    - The approval process took six months.
    - Before they could proceed, they needed buy-in.
    - Compliance requirements blocked the first attempt.
    - The procurement process was the first barrier.
    confidence_threshold: 0.65
  - recognition_patterns:
    - seemed \w+ but (then )?\w+
    - (ally|supporter|partner) who (became|turned)
    - reversed (their|the|his|her) \w+
    - appeared \w+ (at first|initially|then)
    edges:
    - subject_id: coe:entity/shapeshifter
      predicate: coe:enables
      object_id: coe:entity/narrative_tension
      relationship_weight: expected
      description: Ambiguity in the shapeshifter's allegiance generates narrative tension through uncertainty about whether
        they will help or hinder the hero
    - subject_id: coe:entity/shapeshifter
      predicate: coe:bridges
      object_id: coe:entity/villain
      relationship_weight: optional
      description: The shapeshifter can bridge between ally and villain roles, embodying characters whose allegiance shifts
        from supportive to antagonistic
    - subject_id: coe:entity/shapeshifter
      predicate: coe:limits
      object_id: coe:entity/hero
      relationship_weight: expected
      description: The shapeshifter's shifting allegiance introduces doubt and uncertainty that limits the hero's ability
        to trust and plan confidently
    id: coe:entity/shapeshifter
    label: Shapeshifter
    description: A character whose allegiance or role is unclear or shifts during the story
    home_domain: narrative
    status: canonical
    ner_label: SHAPESHIFTER
    examples:
    - The partner who seemed helpful but then withdrew support.
    - He supported the project until it became inconvenient.
    - An ally who became a critic.
    - She appeared enthusiastic at first, then reversed position.
    - The stakeholder whose commitment was uncertain.
    confidence_threshold: 0.6
  - recognition_patterns:
    - disrupted \w+
    - challenged (every|all|the) \w+
    - nobody (saw|expected) \w+
    - reframed (the|a|their) \w+
    edges:
    - subject_id: coe:entity/trickster
      predicate: coe:enables
      object_id: coe:entity/narrative_tension
      relationship_weight: optional
      description: The trickster introduces unexpected disruption that generates narrative tension through surprise and reframing
        of the problem
    - subject_id: coe:entity/trickster
      predicate: coe:limits
      object_id: coe:entity/hero
      relationship_weight: optional
      description: The trickster challenges the hero's assumptions and disrupts established approaches, forcing creative adaptation
        or rethinking of strategy
    - subject_id: coe:entity/trickster
      predicate: coe:contrasts_with
      object_id: coe:entity/villain
      relationship_weight: optional
      description: The trickster disrupts through provocation and reframing rather than direct opposition, unlike the villain
        who actively opposes the hero
    id: coe:entity/trickster
    label: Trickster
    description: A character who disrupts the status quo, challenges assumptions, or introduces unexpected change
    home_domain: narrative
    status: canonical
    ner_label: TRICKSTER
    examples:
    - The startup that disrupted the whole industry.
    - She challenged every assumption in the room.
    - He broke every rule they had set.
    - The unexpected voice that reframed the problem.
    - A competitor nobody saw coming.
    - The intern who asked the uncomfortable question.
    confidence_threshold: 0.62
  - recognition_patterns:
    - worked alongside \w+
    - (supported|backed|helped) (the|this|every) \w+
    - the (broader|whole|wider) team \w+
    - (partner|colleague|team member) who \w+
    edges:
    - subject_id: coe:entity/ally
      predicate: coe:enables
      object_id: coe:entity/internal_champion
      relationship_weight: expected
      description: The classical ally archetype enables the internal champion B2B specialisation — an internal advocate who
        supports the hero's initiative
    - subject_id: coe:entity/ally
      predicate: coe:bridges
      object_id: coe:entity/trickster
      relationship_weight: optional
      description: The trickster can function as an unconventional ally who helps the hero by reframing problems or challenging
        flawed assumptions
    - subject_id: coe:entity/ally
      predicate: coe:supports
      object_id: coe:entity/hero
      relationship_weight: required
      description: At Stage 6 (Tests, Allies, Enemies) the hero gathers allies who assist through trials in the Special World
        | The ally assists the hero through trials at Stage 6 (Tests, Allies, Enemies), providing support without leading
        the journey
    - subject_id: coe:entity/ally
      predicate: coe:contrasts_with
      object_id: coe:entity/shapeshifter
      relationship_weight: expected
      description: The shapeshifter contrasts with the reliable ally — where the ally provides consistent support, the shapeshifter's
        commitment is uncertain or reversed
    - subject_id: coe:entity/ally
      predicate: coe:contrasts_with
      object_id: coe:entity/villain
      relationship_weight: expected
      description: Allies stand in opposition to the villain's forces — at Stage 6 the hero distinguishes allies from enemies
        in the Special World
    id: coe:entity/ally
    label: Ally
    description: A supporting character who assists the hero but does not lead the journey
    home_domain: narrative
    status: canonical
    ner_label: ALLY
    examples:
    - Their IT team supported every step.
    - The partner who contributed the technical expertise.
    - A colleague who backed the project from day one.
    - Adobe worked alongside them through the process.
    - The broader team who made it possible.
    - She helped me see a different angle.
    confidence_threshold: 0.65
  - recognition_patterns:
    - (\w+ \w+|\w+) faced (a|the) \w+
    - their (team|organisation|company) (of )?\w+
    - took the (leap|bold|first) \w+
    edges:
    - subject_id: coe:entity/customer_hero
      predicate: coe:specialises
      object_id: coe:entity/hero
      relationship_weight: required
      description: Customer-as-hero is a B2B specialisation of the hero archetype
    - subject_id: coe:entity/customer_hero
      predicate: coe:supports
      object_id: coe:entity/vendor_as_mentor
      relationship_weight: expected
      description: In sales narratives, positioning the customer as the hero requires the vendor to serve as the mentor archetype.
        The mentor guides the hero toward the desired outcome without overshadowing them.
    id: coe:entity/customer_hero
    label: Customer Hero
    description: A specific customer cast as the hero of a business case study or success story
    home_domain: narrative
    status: canonical
    ner_label: CUSTOMER_HERO
    examples:
    - ACME Corporation faced a critical challenge.
    - Their team of 50 engineers needed to...
    - The retail giant that transformed its supply chain.
    - A mid-market company who took the leap.
    - Their IT director took the bold decision.
    - The customer who proved it was possible.
    confidence_threshold: 0.68
  - recognition_patterns:
    - (Adobe|we) enabled (them|the|a) \w+
    - with our \w+, they \w+
    - we helped (them|the customer|the team) \w+
    - working with (us|Adobe) \w+
    edges:
    - subject_id: coe:entity/vendor_as_mentor
      predicate: coe:specialises
      object_id: coe:entity/mentor
      relationship_weight: required
      description: Vendor-as-mentor is a B2B specialisation of the mentor archetype
    - subject_id: coe:entity/vendor_as_mentor
      predicate: coe:contains
      object_id: coe:entity/value_proposition
      relationship_weight: expected
      description: The mentor role contains the value proposition — the mentor's tools/plan IS the product's value proposition
        per UNIFIED_NARRATIVE_METHODOLOGY_v2 StoryBrand SB7
    - subject_id: coe:entity/vendor_as_mentor
      predicate: coe:supports
      object_id: coe:entity/action_marker
      relationship_weight: required
      description: The mentor archetype directly supports the Action phase of SOAR by providing guidance and tools that the
        customer (hero) uses to solve their problem.
    - subject_id: coe:entity/vendor_as_mentor
      predicate: coe:supports
      object_id: coe:entity/customer_hero
      relationship_weight: required
      description: Customer-as-Hero requires Vendor-as-Mentor — StoryBrand SB7 framework mandates customer is protagonist
        and brand/product is the guide/mentor per UNIFIED_NARRATIVE_METHODOLOGY_v2 | The vendor-as-mentor directly supports
        the customer-hero by providing the plan, demonstrating Empathy and Authority as the Guide per Analyzing Story for
        Business Communication
    id: coe:entity/vendor_as_mentor
    label: Vendor As Mentor
    description: The vendor or solution provider cast in the mentor role — enabling rather than heroic
    home_domain: narrative
    status: canonical
    ner_label: VENDOR_AS_MENTOR
    examples:
    - Adobe enabled them to move faster.
    - With our platform, they were able to...
    - We helped them navigate the transformation.
    - Our solution gave them the tools they needed.
    - Working with us, they achieved...
    - Together we built the foundation.
    confidence_threshold: 0.65
  - recognition_patterns:
    - just like (you|yours|the ones|those)
    - a typical \w+
    - someone (who|just) \w+
    - no different from \w+
    - like (everyone|many|most) (in|of) \w+
    edges:
    - subject_id: coe:entity/everyman_character
      predicate: coe:contrasts_with
      object_id: coe:entity/hero
      relationship_weight: expected
      description: Everyman (relatable ordinary person) vs hero (exceptional protagonist)
    id: coe:entity/everyman_character
    label: Everyman Character
    description: A relatable, ordinary character with whom the audience identifies — not exceptional, but recognisable from
      the audience's own experience
    home_domain: narrative
    status: canonical
    ner_label: EVERYMAN
    examples:
    - A typical marketing team, just like yours.
    - Someone who had never touched a line of code.
    - An everyday project manager facing impossible deadlines.
    - Someone just like you, trying to do more with less.
    - A team no different from the ones in this room.
    - One of those professionals everyone knows — brilliant but overwhelmed.
    - A mid-level manager with no budget and a tight timeline.
    confidence_threshold: 0.63
  - recognition_patterns:
    - championed (the|this) \w+
    - drove the (initiative|project|change) \w+
    - pushed for \w+ (despite|against)
    - secured (board|executive|leadership|budget) \w+
    - (internal|change) (champion|advocate|sponsor|agent)
    edges:
    - subject_id: coe:entity/internal_champion
      predicate: coe:specialises
      object_id: coe:entity/ally
      relationship_weight: expected
      description: Internal champion is a B2B specialisation of the ally archetype
    - subject_id: coe:entity/internal_champion
      predicate: coe:specialises
      object_id: coe:concept/character_archetypes_taxonomy/buying_role/champion
      relationship_weight: expected
      description: Narrative internal champion specialises the buying role champion
    id: coe:entity/internal_champion
    label: Internal Champion
    description: The internal advocate or change agent within the customer organisation who drives the initiative, secures
      buy-in, and pushes the project to completion
    home_domain: narrative
    status: canonical
    ner_label: CHAMPION
    examples:
    - Their VP of Marketing championed the initiative.
    - One internal advocate who drove the change.
    - She pushed for the project despite internal scepticism.
    - The IT director who secured board approval.
    - Without his sponsorship, the project would not have happened.
    - The change agent who built the internal coalition.
    - She became the internal champion who made it possible.
    - He secured executive buy-in against significant resistance.
    confidence_threshold: 0.67
  - id: coe:entity/sme_academic
    label: Sme Academic
