  last_updated: '2026-08-12'
  id: coe:artifact/narrative/character_archetypes_entities
  label: Character Archetypes Entities
  description: NER entity definitions for detecting character archetypes and narrative roles in stories, presentations, and
    case studies
  home_domain: narrative
  status: canonical
- entities:
  - edges:
    - subject_id: coe:entity/coreference_chain
      predicate: coe:bridges
      object_id: coe:entity/lexical_chain
      relationship_weight: expected
      description: Coreference chains link pronouns and nominals across EDU spans forming semantic signal for rhetorical relation
        detection
      statement_id: coe:edge/bc32221b4e30be7fd1f4baa3
      home_domain: narrative
    - subject_id: coe:entity/coreference_chain
      predicate: coe:bridges
      object_id: coe:entity/meronymy_link
      relationship_weight: expected
      description: Coreference resolution bridges to meronymy detection — when a newly introduced entity is a meronym of a
        preceding entity this serves as a semantic discourse signal to predict elaboration relations per Advanced Computational
        Discourse Analysis research
      statement_id: coe:edge/e5b72ee47b695d2ea00e62d0
      home_domain: narrative
    - subject_id: coe:entity/coreference_chain
      predicate: coe:limits
      object_id: coe:entity/topic_shift_marker
      relationship_weight: expected
      description: Maintained coreference chains limit unintended topic shifts by preserving entity consistency across slides
        — coreference failures signal structural coherence breaks per Theoretical Frameworks Integration Analysis
      statement_id: coe:edge/330c461999d913dfaea6d03c
      home_domain: narrative
    - subject_id: coe:entity/coreference_chain
      predicate: coe:triggers
      object_id: coe:entity/elaboration_marker
      relationship_weight: expected
      description: Coreference chains tracking entity continuity across spans trigger elaboration relations in RST discourse
        parsing per Advanced Computational Discourse Analysis research
      statement_id: coe:edge/6c6a6514bc18981ecd85cd6e
      home_domain: narrative
    - subject_id: coe:entity/coreference_chain
      predicate: coe:supports
      object_id: coe:entity/anaphora_marker
      relationship_weight: expected
      description: Coreference continuity tracked via pronouns and anaphoric references across discourse tree spans
      statement_id: coe:edge/50a3dd3de8cdf449d62d0de3
      home_domain: narrative
    id: coe:entity/coreference_chain
    label: Coreference Chain
    description: Pronominal or nominal expression referring back to an antecedent entity across EDU boundaries, establishing
      a continuous discourse edge
    home_domain: narrative
