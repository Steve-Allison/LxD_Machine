    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSme\s+Dominant\b
    edges: []
    ner_label: SME_DOMINANT
  - id: coe:entity/sme_clueless
    label: Sme Clueless
    description: SME assigned to project without understanding why or what their role entails; lacks confidence
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSme\s+Clueless\b
    edges: []
    ner_label: SME_CLUELESS
  - id: coe:entity/sme_busy_bee
    label: Sme Busy Bee
    description: Over-committed SME who wears multiple hats and struggles to meet project deadlines
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSme\s+Busy\s+Bee\b
    edges: []
    ner_label: SME_BUSY_BEE
  - id: coe:entity/sme_include_it_all
    label: Sme Include It All
    description: SME obsessed with completeness who struggles to differentiate between need-to-know and nice-to-know
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSme\s+Include\s+It\s+All\b
    edges: []
    ner_label: SME_INCLUDE_IT_ALL
  - id: coe:entity/sme_luddite
    label: Sme Luddite
    description: SME resistant to new technologies who prefers traditional methods and modern learning approaches
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSme\s+Luddite\b
    edges: []
    ner_label: SME_LUDDITE
  - id: coe:entity/sme_awol
    label: Sme Awol
    description: Frequently unresponsive SME who avoids communication and provides minimal input
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSme\s+Awol\b
    edges: []
    ner_label: SME_AWOL
  - id: coe:entity/speaker_novice
    label: Speaker Novice
    description: Low confidence, high disfluency, minimal vocal variety, and inward-focused body language.
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSpeaker\s+Novice\b
    edges: []
    ner_label: SPEAKER_NOVICE
  - id: coe:entity/speaker_technocrat
    label: Speaker Technocrat
    description: High expertise but low engagement; focuses on data and logic over narrative or emotional connection.
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSpeaker\s+Technocrat\b
    edges: []
    ner_label: SPEAKER_TECHNOCRAT
  - id: coe:entity/speaker_performer
    label: Speaker Performer
    description: High energy and engagement but may lack deep substance or structured logical flow.
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSpeaker\s+Performer\b
    edges: []
    ner_label: SPEAKER_PERFORMER
  - id: coe:entity/speaker_visionary
    label: Speaker Visionary
    description: Elite-level speaker combining deep expertise with high engagement, using agentic language and tricolons.
    home_domain: narrative
    status: canonical
    recognition_patterns:
    - (?i)\bSpeaker\s+Visionary\b
    edges: []
    ner_label: SPEAKER_VISIONARY
  version: 3.0.1
  last_updated: '2026-08-12'
  id: coe:artifact/narrative/character_archetypes_entities
  label: Character Archetypes Entities
  description: NER entity definitions for detecting character archetypes and narrative roles in stories, presentations, and
    case studies
  home_domain: narrative
  status: canonical
- entities:
  - recognition_patterns:
    - \. [HSIT]\w+ \w+
    - \. This \w+
    - \. That \w+
    - \. These \w+
    - \. They \w+
    - the former
    - the latter
    edges:
    - subject_id: coe:entity/coreference_chain
      predicate: coe:bridges
      object_id: coe:entity/lexical_chain
      relationship_weight: expected
      description: Coreference chains link pronouns and nominals across EDU spans forming semantic signal for rhetorical relation
        detection
    - subject_id: coe:entity/coreference_chain
      predicate: coe:bridges
      object_id: coe:entity/meronymy_link
      relationship_weight: expected
      description: Coreference resolution bridges to meronymy detection — when a newly introduced entity is a meronym of a
        preceding entity this serves as a semantic discourse signal to predict elaboration relations per Advanced Computational
        Discourse Analysis research
