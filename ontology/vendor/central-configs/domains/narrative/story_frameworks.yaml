    - coe:concept/rhetorical_devices_taxonomy/power_level
    id: coe:concept/rhetorical_devices_taxonomy/power_level/very_high
    label: Very High
    description: 'Maximum persuasive impact — reserved for high-stakes moments only'
    home_domain: narrative
