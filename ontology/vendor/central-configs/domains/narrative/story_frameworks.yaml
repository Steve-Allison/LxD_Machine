- last_updated: '2026-09-01'
  id: coe:artifact/narrative/stance_markers_taxonomy
  label: Stance Markers Taxonomy
  description: Classification of epistemic stance markers by marker type, modality category, certainty direction, strength
    tier, and stance polarity.
  home_domain: narrative
  status: canonical
  concepts:
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    id: coe:concept/stance_markers_taxonomy/marker_type
    label: Marker Type
    description: The primary category of stance marker
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/marker_type
    id: coe:concept/stance_markers_taxonomy/marker_type/hedge
    label: Hedge
    description: 'A marker that reduces the certainty or force of a claim — modal verbs, epistemic adverbs, perception verbs, and approximators (might, possibly, seems to)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/marker_type
    id: coe:concept/stance_markers_taxonomy/marker_type/boost
    label: Boost
    description: 'A marker that increases the certainty or force of a claim — strong modals, certainty adverbs, emphatics, and universal quantifiers (must, definitely, always)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/marker_type
    id: coe:concept/stance_markers_taxonomy/marker_type/position
    label: Position
    description: 'A marker expressing the author''s evaluative attitude toward the proposition rather than shifting its certainty (fortunately, notably, so-called)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    id: coe:concept/stance_markers_taxonomy/modality_category
    label: Modality Category
    description: The type of modality the marker expresses
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/modality_category
    id: coe:concept/stance_markers_taxonomy/modality_category/epistemic
    label: Epistemic
    description: 'Modality of knowledge and belief — how certain the speaker is about the truth of the proposition (might, probably, certainly)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/modality_category
    id: coe:concept/stance_markers_taxonomy/modality_category/deontic
    label: Deontic
    description: 'Modality of obligation, permission, and necessity — what the speaker holds should happen (must, should, ought to)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/modality_category
    id: coe:concept/stance_markers_taxonomy/modality_category/dynamic
    label: Dynamic
    description: 'Modality of ability, willingness, and disposition — the subject''s capacity or inclination (can, able to, tends to)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/modality_category
    id: coe:concept/stance_markers_taxonomy/modality_category/evidential
    label: Evidential
    description: 'Modality of information source — the basis on which the claim rests, whether inference, hearsay, direct perception, or published record (reportedly, according to, research shows)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    id: coe:concept/stance_markers_taxonomy/certainty_direction
    label: Certainty Direction
    description: Whether the marker increases, decreases, or does not affect perceived certainty
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/certainty_direction
    id: coe:concept/stance_markers_taxonomy/certainty_direction/increases
    label: Increases
    description: 'The marker raises the perceived certainty of the proposition — the direction of boost markers'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/certainty_direction
    id: coe:concept/stance_markers_taxonomy/certainty_direction/decreases
    label: Decreases
    description: 'The marker lowers the perceived certainty of the proposition — the direction of hedge markers'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/certainty_direction
    id: coe:concept/stance_markers_taxonomy/certainty_direction/neutral
    label: Neutral
    description: 'The marker leaves perceived certainty unchanged, expressing attitude rather than confidence — the direction of position markers'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    id: coe:concept/stance_markers_taxonomy/strength_tier
    label: Strength Tier
    description: The degree of impact the marker has on perceived certainty
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/strength_tier
    id: coe:concept/stance_markers_taxonomy/strength_tier/weak
    label: Weak
    description: 'Minimal impact on perceived certainty — approximators such as somewhat and fairly as hedges, likely and probably as boosts'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/strength_tier
    id: coe:concept/stance_markers_taxonomy/strength_tier/moderate
    label: Moderate
    description: 'Noticeable impact on perceived certainty — possibly, perhaps, and suggests as hedges; clearly and obviously as boosts'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/strength_tier
    id: coe:concept/stance_markers_taxonomy/strength_tier/strong
    label: Strong
    description: 'Substantial impact on perceived certainty — might, could, and seems as hedges; definitely, must, always, and never as boosts'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    id: coe:concept/stance_markers_taxonomy/stance_polarity
    label: Stance Polarity
    description: Whether the author supports, contests, or remains neutral on the proposition
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/stance_polarity
    id: coe:concept/stance_markers_taxonomy/stance_polarity/support
    label: Support
    description: 'The author signals agreement with or endorsement of the proposition (agree, endorse, advocate), whether on evidential, preferential, or deferential grounds'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/stance_polarity
    id: coe:concept/stance_markers_taxonomy/stance_polarity/contest
    label: Contest
    description: 'The author signals disagreement with or opposition to the proposition (dispute, reject, challenge), whether evidence-grounded, corrective, or adversarial'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/stance_polarity
    id: coe:concept/stance_markers_taxonomy/stance_polarity/neutral
    label: Neutral
    description: 'The author takes no clear evaluative position, reporting or describing without claiming a stake in the outcome (observe, note, report)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    id: coe:concept/stance_markers_taxonomy/discourse_role
    label: Discourse Role
    description: The function the stance marker performs within the discourse structure
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/discourse_role
    id: coe:concept/stance_markers_taxonomy/discourse_role/hedging
    label: Hedging
    description: 'Protects the speaker from full commitment to a proposition — face-saving, academic caution, and diplomatic or risk communication'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/discourse_role
    id: coe:concept/stance_markers_taxonomy/discourse_role/boosting
    label: Boosting
    description: 'Strengthens the speaker''s commitment and persuasive force — assertiveness and confidence projection in pitches, leadership, and advocacy'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/discourse_role
    id: coe:concept/stance_markers_taxonomy/discourse_role/evaluation
    label: Evaluation
    description: 'Signals the speaker''s judgement about propositions or events — opinion formation, critique, and commentary'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/discourse_role
    id: coe:concept/stance_markers_taxonomy/discourse_role/attribution
    label: Attribution
    description: 'Identifies the source or basis of a claim for credibility and transparency (according to, as X states, studies show)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/stance_markers_taxonomy
    broader:
    - coe:concept/stance_markers_taxonomy/discourse_role
    id: coe:concept/stance_markers_taxonomy/discourse_role/discounting
    label: Discounting
    description: 'Acknowledges a counterpoint or concession before reasserting the main claim with greater force — the concession-then-assertion pattern that pre-empts objections while the post-marker assertion carries the speaker''s actual stance'
    home_domain: narrative
    status: canonical
  top_concepts:
  - coe:concept/stance_markers_taxonomy/marker_type
  - coe:concept/stance_markers_taxonomy/modality_category
  - coe:concept/stance_markers_taxonomy/certainty_direction
  - coe:concept/stance_markers_taxonomy/strength_tier
  - coe:concept/stance_markers_taxonomy/stance_polarity
  - coe:concept/stance_markers_taxonomy/discourse_role
