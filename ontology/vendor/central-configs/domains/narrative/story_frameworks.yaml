- last_updated: '2026-09-01'
  id: coe:artifact/narrative/opening_hooks_taxonomy
  label: Opening Hooks Taxonomy
  description: Classification of presentation opening hook types by hook category, psychological mechanism, audience impact
    level, context suitability, and narrative function
  home_domain: narrative
  status: canonical
  concepts:
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    id: coe:concept/opening_hooks_taxonomy/hook_category
    label: Hook Category
    description: The primary type of opening hook
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/hook_category
    id: coe:concept/opening_hooks_taxonomy/hook_category/question
    label: Question
    description: 'Opens with a question — rhetorical, direct, provocative, or hypothetical — to trigger curiosity and immediate mental engagement'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/hook_category
    id: coe:concept/opening_hooks_taxonomy/hook_category/statistic
    label: Statistic
    description: 'Opens with a surprising number or data point to establish credibility and urgency'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/hook_category
    id: coe:concept/opening_hooks_taxonomy/hook_category/story
    label: Story
    description: 'Opens with a narrative — personal, customer, historical, or hypothetical — that creates emotional connection and context'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/hook_category
    id: coe:concept/opening_hooks_taxonomy/hook_category/quotation
    label: Quotation
    description: 'Opens with a relevant quote from an authority figure, inheriting the credibility of its source'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/hook_category
    id: coe:concept/opening_hooks_taxonomy/hook_category/bold_claim
    label: Bold Claim
    description: 'Opens with a provocative, contrarian, or surprising assertion that contradicts expectations and demands resolution'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/hook_category
    id: coe:concept/opening_hooks_taxonomy/hook_category/demonstration
    label: Demonstration
    description: 'Opens with a live demo, visual reveal, or interactive audience moment — concrete experience rather than abstraction'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/hook_category
    id: coe:concept/opening_hooks_taxonomy/hook_category/silence
    label: Silence
    description: 'Opens with deliberate silence or an extended pause to create tension and heightened attention before the first words'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/hook_category
    id: coe:concept/opening_hooks_taxonomy/hook_category/entrance
    label: Entrance
    description: 'The hook that begins before a single word is spoken — the act of entering the space, walking to the stage, and taking position constitutes the opening communication'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism
    label: Psychological Mechanism
    description: The cognitive principle that makes the hook effective
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/curiosity_gap
    label: Curiosity Gap
    description: 'Unresolved questions trigger dopamine-driven attention until the open loop is closed (Loewenstein 1994) — the mechanism behind question hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/isolation_effect
    label: Isolation Effect
    description: 'A surprising item standing out from uniform surroundings is disproportionately noticed and remembered (Von Restorff 1933) — the mechanism behind statistic hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/neural_coupling
    label: Neural Coupling
    description: 'Stories synchronise speaker and listener brain activity, creating shared engagement — the mechanism behind story hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/authority_bias
    label: Authority Bias
    description: 'Attributed statements inherit the credibility of their source — the mechanism behind quotation hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/cognitive_dissonance
    label: Cognitive Dissonance
    description: 'A claim that contradicts expectations creates discomfort the audience is driven to resolve — the mechanism behind bold-claim hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/experiential_learning
    label: Experiential Learning
    description: 'Concrete experience is more memorable than abstraction — the mechanism behind demonstration hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/expectancy_violation
    label: Expectancy Violation
    description: 'Behaviour that breaks contextual norms — such as silence in a speaking context — sharply heightens attention; the mechanism behind silence hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/thin_slicing
    label: Thin Slicing
    description: 'Audiences form strong, durable impressions from milliseconds of expressive behaviour (Ambady & Rosenthal 1992) — the mechanism behind entrance and stillness hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/psychological_mechanism
    id: coe:concept/opening_hooks_taxonomy/psychological_mechanism/halo_effect
    label: Halo Effect
    description: 'A single positive first impression cascades into positive judgements of all other speaker attributes (Thorndike 1920; Nisbett & Wilson 1977)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    id: coe:concept/opening_hooks_taxonomy/audience_impact
    label: Audience Impact
    description: The strength of the hook's effect on audience engagement
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/audience_impact
    id: coe:concept/opening_hooks_taxonomy/audience_impact/very_high
    label: Very High
    description: 'The top impact tier — characteristic of story, demonstration, and entrance hooks that create maximum engagement and memorability'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/audience_impact
    id: coe:concept/opening_hooks_taxonomy/audience_impact/high
    label: High
    description: 'Strong engagement effect — characteristic of question, statistic, bold-claim, and silence hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/audience_impact
    id: coe:concept/opening_hooks_taxonomy/audience_impact/medium
    label: Medium
    description: 'Moderate engagement effect — characteristic of quotation hooks, which engage without commanding the room'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/audience_impact
    id: coe:concept/opening_hooks_taxonomy/audience_impact/low
    label: Low
    description: 'Minimal engagement effect — the hook barely lifts attention above an unhooked opening'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    id: coe:concept/opening_hooks_taxonomy/presentation_context
    label: Presentation Context
    description: The setting in which the presentation is delivered
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/presentation_context
    id: coe:concept/opening_hooks_taxonomy/presentation_context/executive_briefing
    label: Executive Briefing
    description: 'Time-constrained senior audience that values directness and data — favours statistic, bold-claim, and quotation hooks over exercises and extended stories'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/presentation_context
    id: coe:concept/opening_hooks_taxonomy/presentation_context/training_session
    label: Training Session
    description: 'Learning context that benefits from engagement and relatability — favours question, demonstration, and story hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/presentation_context
    id: coe:concept/opening_hooks_taxonomy/presentation_context/sales_presentation
    label: Sales Presentation
    description: 'Context in which relevance and urgency must be established quickly — favours story, statistic, and question hooks'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/presentation_context
    id: coe:concept/opening_hooks_taxonomy/presentation_context/keynote
    label: Keynote
    description: 'Large-audience conference setting needing emotional impact and memorability — favours entrance, story, bold-claim, demonstration, and silence hooks, since the first impression is set before a word is spoken'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/presentation_context
    id: coe:concept/opening_hooks_taxonomy/presentation_context/webinar
    label: Webinar
    description: 'Remote setting where immediate engagement is needed to prevent multitasking — favours question, statistic, and story hooks; silence and demonstration translate poorly'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    id: coe:concept/opening_hooks_taxonomy/narrative_function
    label: Narrative Function
    description: The role the hook plays in the presentation's narrative arc
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/narrative_function
    id: coe:concept/opening_hooks_taxonomy/narrative_function/attention_capture
    label: Attention Capture
    description: 'The hook seizes audience focus in the opening moments, before any content lands'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/narrative_function
    id: coe:concept/opening_hooks_taxonomy/narrative_function/context_setting
    label: Context Setting
    description: 'The hook establishes the situation and shared ground the presentation builds on'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/narrative_function
    id: coe:concept/opening_hooks_taxonomy/narrative_function/problem_framing
    label: Problem Framing
    description: 'The hook surfaces the problem the presentation will address'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/narrative_function
    id: coe:concept/opening_hooks_taxonomy/narrative_function/credibility_building
    label: Credibility Building
    description: 'The hook establishes the speaker''s authority and trustworthiness at the outset — the function of statistic and quotation openings'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/narrative_function
    id: coe:concept/opening_hooks_taxonomy/narrative_function/emotional_priming
    label: Emotional Priming
    description: 'The hook puts the audience in the affective state the narrative requires before the argument begins'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/opening_hooks_taxonomy
    broader:
    - coe:concept/opening_hooks_taxonomy/narrative_function
    id: coe:concept/opening_hooks_taxonomy/narrative_function/presence_establishment
    label: Presence Establishment
    description: 'The hook establishes the speaker''s physical command of the room before or without words — the function of entrance and silence openings'
    home_domain: narrative
    status: canonical
  top_concepts:
  - coe:concept/opening_hooks_taxonomy/hook_category
  - coe:concept/opening_hooks_taxonomy/psychological_mechanism
  - coe:concept/opening_hooks_taxonomy/audience_impact
  - coe:concept/opening_hooks_taxonomy/presentation_context
  - coe:concept/opening_hooks_taxonomy/narrative_function
- last_updated: '2026-09-01'
  id: coe:artifact/narrative/presentation_structures_taxonomy
  label: Presentation Structures Taxonomy
  description: Narrative frameworks for presentations including SCQA, Minto Pyramid, Duarte Sparkline, and SOAR.
  home_domain: narrative
  status: canonical
  concepts:
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    id: coe:concept/presentation_structures_taxonomy/structural_framework
    label: structural_framework
    description: Overarching presentation narrative framework applied to the whole deck
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/structural_framework
    id: coe:concept/presentation_structures_taxonomy/structural_framework/minto_pyramid
    label: Minto Pyramid
    description: 'Barbara Minto''s answer-first structure — a single governing thought at the top, supported by MECE key-line arguments and evidence beneath (BLUF principle)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/structural_framework
    id: coe:concept/presentation_structures_taxonomy/structural_framework/duarte_sparkline
    label: Duarte Sparkline
    description: 'Nancy Duarte''s structure alternating ''what is'' and ''what could be'' to build tension and longing, climaxing in the ''new bliss'' of the transformed future'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/structural_framework
    id: coe:concept/presentation_structures_taxonomy/structural_framework/soar_framework
    label: Soar Framework
    description: 'Four-beat Situation-Opportunity-Action-Result narrative structure for business presentations, with a matching visual and emotional arc per beat'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/structural_framework
    id: coe:concept/presentation_structures_taxonomy/structural_framework/vonnegut_shape
    label: Vonnegut Shape
    description: 'Framework applying Kurt Vonnegut''s story-shape archetypes — man in hole, rags to riches, Icarus, Cinderella — to govern the deck''s emotional arc'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/structural_framework
    id: coe:concept/presentation_structures_taxonomy/structural_framework/monroe_sequence
    label: Monroe Sequence
    description: 'Alan Monroe''s five-stage persuasive structure — Attention, Need, Satisfaction, Visualization, Action — mirroring the psychological journey from indifference to commitment'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    id: coe:concept/presentation_structures_taxonomy/title_strategy
    label: title_strategy
    description: Headline type applied to communicate the slide's key assertion
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/title_strategy
    id: coe:concept/presentation_structures_taxonomy/title_strategy/action_title
    label: Action Title
    description: 'A title that makes an assertion or claim (subject-verb-outcome), conveying the slide''s takeaway immediately and supporting skimmability'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/title_strategy
    id: coe:concept/presentation_structures_taxonomy/title_strategy/label_title
    label: Label Title
    description: 'A title that merely names the topic, leaving the audience to extract the point from the slide body — acceptable only for reference slides, exploratory workshops, and section dividers'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/title_strategy
    id: coe:concept/presentation_structures_taxonomy/title_strategy/question_title
    label: Question Title
    description: 'A title that poses a question the slide then answers, creating engagement and curiosity at the cost of directness'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    id: coe:concept/presentation_structures_taxonomy/narrative_shape
    label: narrative_shape
    description: Vonnegut story shape archetype governing emotional arc
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/narrative_shape
    id: coe:concept/presentation_structures_taxonomy/narrative_shape/man_in_hole
    label: Man In Hole
    description: 'Starts okay, falls into trouble, climbs out successfully — the Vonnegut shape of problem-solving presentations (''we faced a crisis, here is how we solved it'')'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/narrative_shape
    id: coe:concept/presentation_structures_taxonomy/narrative_shape/rags_to_riches
    label: Rags To Riches
    description: 'Starts low and rises steadily to success — the Vonnegut shape of growth stories and transformation narratives'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/narrative_shape
    id: coe:concept/presentation_structures_taxonomy/narrative_shape/icarus
    label: Icarus
    description: 'Rises to a height, then falls from grace — the Vonnegut shape of cautionary tales and risk presentations'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/narrative_shape
    id: coe:concept/presentation_structures_taxonomy/narrative_shape/cinderella
    label: Cinderella
    description: 'Rises, suffers a setback, then achieves ultimate triumph — the Vonnegut shape of resilience and turnaround narratives'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    id: coe:concept/presentation_structures_taxonomy/slide_density
    label: slide_density
    description: Information density category governing dwell time and design approach
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/slide_density
    id: coe:concept/presentation_structures_taxonomy/slide_density/lean
    label: Lean
    description: 'One concept and minimal text with the shortest dwell time — statement slides, transitions, and emotional beats built for maximum impact'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/slide_density
    id: coe:concept/presentation_structures_taxonomy/slide_density/moderate
    label: Moderate
    description: 'Two to three balanced points with a short dwell time — standard information delivery with clear hierarchy'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/slide_density
    id: coe:concept/presentation_structures_taxonomy/slide_density/dense
    label: Dense
    description: 'Multiple data points or complex visuals with an extended dwell time — analysis and detailed-evidence slides requiring careful organisation'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/presentation_structures_taxonomy
    broader:
    - coe:concept/presentation_structures_taxonomy/slide_density
    id: coe:concept/presentation_structures_taxonomy/slide_density/slidument
    label: Slidument
    description: 'A document disguised as a slide, demanding document-length dwell time — to be avoided in live presentations and acceptable only as leave-behind reference material'
    home_domain: narrative
    status: canonical
  top_concepts:
  - coe:concept/presentation_structures_taxonomy/structural_framework
  - coe:concept/presentation_structures_taxonomy/title_strategy
  - coe:concept/presentation_structures_taxonomy/narrative_shape
  - coe:concept/presentation_structures_taxonomy/slide_density
- last_updated: '2026-09-01'
  id: coe:artifact/narrative/rhetorical_devices_taxonomy
  label: Rhetorical Devices Taxonomy
  description: Classification of rhetorical and persuasive language devices by communicative function — repetition, balance,
    amplification, comparison, engagement, structural organisation, and Aristotelian appeals
  home_domain: narrative
  status: canonical
  concepts:
  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    id: coe:concept/rhetorical_devices_taxonomy/device_family
    label: device_family
    description: Rhetorical device family grouping by functional mechanism
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/device_family
    id: coe:concept/rhetorical_devices_taxonomy/device_family/repetition
    label: Repetition
    description: 'Devices that create rhythm, emphasis, and memorability through structural repetition — anaphora, epistrophe, symploce, tricolon, and anadiplosis'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/device_family
    id: coe:concept/rhetorical_devices_taxonomy/device_family/balance
    label: Balance
    description: 'Devices that create clarity and impact through parallel or opposing structures — antithesis, chiasmus, isocolon, and parallelism'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/device_family
    id: coe:concept/rhetorical_devices_taxonomy/device_family/amplification
    label: Amplification
    description: 'Devices that heighten intensity, urgency, or emotional weight — hyperbole, climax, and litotes'
    home_domain: narrative
