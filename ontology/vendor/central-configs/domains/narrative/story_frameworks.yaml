  id: coe:artifact/narrative/evidence_types_taxonomy
  label: Evidence Types Taxonomy
  description: Classification of evidence and argumentation types by evidence category, argument scheme, source authority,
    strength tier, and Toulmin component
  home_domain: narrative
  status: canonical
  concepts:
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    id: coe:concept/evidence_types_taxonomy/evidence_category
    label: Evidence Category
    description: The kind of support presented for a claim — one of the genuine evidence types, or the declared sentinel value
      rhetorical_device marking persuasive support that is not evidence proper
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_category
    id: coe:concept/evidence_types_taxonomy/evidence_category/statistical
    label: Statistical
    description: 'Numerical data, metrics, percentages, and research findings — hard statistics, cited studies, and benchmarks; high persuasive strength and easily verified'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_category
    id: coe:concept/evidence_types_taxonomy/evidence_category/testimonial
    label: Testimonial
    description: 'Firsthand accounts, endorsements, and customer stories — quotes, case studies, and public recommendations that persuade through social proof'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_category
    id: coe:concept/evidence_types_taxonomy/evidence_category/expert
    label: Expert
    description: 'Claims backed by recognised expertise — credentialled expert opinion, institutional authority, or grounded professional experience'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_category
    id: coe:concept/evidence_types_taxonomy/evidence_category/analogical
    label: Analogical
    description: 'Reasoning from parallel cases, metaphors, or comparisons that map a familiar concept onto an unfamiliar one — persuasive but hard to verify'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_category
    id: coe:concept/evidence_types_taxonomy/evidence_category/logical
    label: Logical
    description: 'Reasoning from premises to conclusion through deductive, inductive, or causal argument'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_category
    id: coe:concept/evidence_types_taxonomy/evidence_category/anecdotal
    label: Anecdotal
    description: 'Personal stories or singular examples used to illustrate a point — personal narratives, illustrative examples, hypotheticals, and problem-agitation sequences'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_category
    id: coe:concept/evidence_types_taxonomy/evidence_category/visual
    label: Visual
    description: 'Evidence conveyed through visual artefacts — data visualisations, live or recorded demonstrations, and photographic documentation'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_category
    id: coe:concept/evidence_types_taxonomy/evidence_category/rhetorical_device
    label: Rhetorical Device
    description: Sentinel support type for passages whose persuasive force comes from a rhetorical device rather than evidence
      proper; the device hierarchy itself lives in the rhetorical_devices taxonomy
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    id: coe:concept/evidence_types_taxonomy/toulmin_component
    label: Toulmin Component
    description: The role the element plays in an argument structure
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/toulmin_component
    id: coe:concept/evidence_types_taxonomy/toulmin_component/claim
    label: Claim
    description: 'The central assertion being argued for — what the speaker wants the audience to accept; typically co-located with its supporting data within a three-sentence window'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/toulmin_component
    id: coe:concept/evidence_types_taxonomy/toulmin_component/data
    label: Data
    description: 'The evidence or facts supporting the claim (Toulmin''s grounds) — the foundation on which the argument rests, which should be independently verifiable'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/toulmin_component
    id: coe:concept/evidence_types_taxonomy/toulmin_component/warrant
    label: Warrant
    description: 'The logical bridge connecting data to claim — the reasoning principle that makes the data relevant; when absent, the audience must infer it, a primary source of argument failure'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/toulmin_component
    id: coe:concept/evidence_types_taxonomy/toulmin_component/backing
    label: Backing
    description: 'Support for the warrant itself — the grounds for trusting the reasoning principle rather than the claim'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/toulmin_component
    id: coe:concept/evidence_types_taxonomy/toulmin_component/qualifier
    label: Qualifier
    description: 'The degree of certainty or the conditions attached to the claim — how strongly it is asserted (probably, usually, in most cases)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/toulmin_component
    id: coe:concept/evidence_types_taxonomy/toulmin_component/rebuttal
    label: Rebuttal
    description: 'Exceptions or counterarguments to the claim — the conditions under which it would not hold'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    id: coe:concept/evidence_types_taxonomy/evidence_strength
    label: Evidence Strength
    description: The reliability and persuasive weight of the evidence
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_strength
    id: coe:concept/evidence_types_taxonomy/evidence_strength/definitive
    label: Definitive
    description: 'Verifiable, replicable, peer-reviewed or independently auditable evidence — the highest strength tier'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_strength
    id: coe:concept/evidence_types_taxonomy/evidence_strength/strong
    label: Strong
    description: 'Well-sourced and credible but not independently verified — industry reports, expert testimony, and case studies with named clients'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_strength
    id: coe:concept/evidence_types_taxonomy/evidence_strength/moderate
    label: Moderate
    description: 'Reasonable but dependent on context or interpretation — analogies, historical precedent, and professional experience'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/evidence_strength
    id: coe:concept/evidence_types_taxonomy/evidence_strength/weak
    label: Weak
    description: 'Suggestive but not reliable for critical decisions — anecdotes, hypotheticals, single examples, and unattributed claims; accumulating weak items does not compound into greater strength'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    id: coe:concept/evidence_types_taxonomy/source_authority
    label: Source Authority
    description: The credibility of the evidence source
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/source_authority
    id: coe:concept/evidence_types_taxonomy/source_authority/peer_reviewed
    label: Peer Reviewed
    description: 'A source vetted through formal scholarly peer review — the most independently verifiable authority tier'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/source_authority
    id: coe:concept/evidence_types_taxonomy/source_authority/institutional
    label: Institutional
    description: 'A source deriving credibility from the position of a recognised institution or standards body rather than an individual (e.g. WHO recommendations, ISO requirements)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/source_authority
    id: coe:concept/evidence_types_taxonomy/source_authority/industry_expert
    label: Industry Expert
    description: 'A source deriving credibility from a recognised individual''s domain expertise and professional credentials'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/source_authority
    id: coe:concept/evidence_types_taxonomy/source_authority/practitioner
    label: Practitioner
    description: 'A source grounded in first-hand professional experience rather than formal research or institutional position'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/source_authority
    id: coe:concept/evidence_types_taxonomy/source_authority/unattributed
    label: Unattributed
    description: 'A source with no traceable attribution — the lowest credibility tier, which downgrades the strength of any claim it supports'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    id: coe:concept/evidence_types_taxonomy/argument_direction
    label: Argument Direction
    description: Whether the evidence supports or challenges the claim
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/argument_direction
    id: coe:concept/evidence_types_taxonomy/argument_direction/supporting
    label: Supporting
    description: 'The evidence strengthens the claim, increasing its acceptability'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/argument_direction
    id: coe:concept/evidence_types_taxonomy/argument_direction/opposing
    label: Opposing
    description: 'The evidence challenges or contradicts the claim'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/argument_direction
    id: coe:concept/evidence_types_taxonomy/argument_direction/qualifying
    label: Qualifying
    description: 'The evidence limits the claim''s scope or attaches conditions to it rather than supporting or opposing it outright'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/argument_direction
    id: coe:concept/evidence_types_taxonomy/argument_direction/contextualising
    label: Contextualising
    description: 'The evidence situates the claim in its background without directly strengthening or challenging it'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    id: coe:concept/evidence_types_taxonomy/rhetorical_appeal
    label: Rhetorical Appeal
    description: The Aristotelian appeal category that the evidence or device primarily activates
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/rhetorical_appeal
    id: coe:concept/evidence_types_taxonomy/rhetorical_appeal/logos
    label: Logos
    description: 'Persuasion through reason, evidence, and logical argument — strongest with analytical audiences and dependent on evidence quality'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/rhetorical_appeal
    id: coe:concept/evidence_types_taxonomy/rhetorical_appeal/pathos
    label: Pathos
    description: 'Persuasion through emotional connection, values, and empathy — strongest with executive and values-driven audiences, and requiring balance with logos to hold credibility'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/rhetorical_appeal
    id: coe:concept/evidence_types_taxonomy/rhetorical_appeal/ethos
    label: Ethos
    description: 'Persuasion through the speaker''s authority, expertise, or trustworthiness — the foundational appeal on which logos and pathos arguments depend to be accepted'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/rhetorical_appeal
    id: coe:concept/evidence_types_taxonomy/rhetorical_appeal/kairos
    label: Kairos
    description: 'Persuasion through the argument''s relevance to the current moment or urgency — compelling events, deadlines, and market windows that convert intent to action'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/rhetorical_appeal
    id: coe:concept/evidence_types_taxonomy/rhetorical_appeal/mixed
    label: Mixed
    description: 'The evidence or device activates more than one Aristotelian appeal with no single dominant mode (compositional value over the Aristotelian appeal framework)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    id: coe:concept/evidence_types_taxonomy/narrative_function
    label: Narrative Function
    description: The role the evidence plays in the story arc of the argument
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/narrative_function
    id: coe:concept/evidence_types_taxonomy/narrative_function/situation_setting
    label: Situation Setting
    description: 'The evidence establishes context and the current state before any problem is introduced — the opening beat of the argument''s story arc'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/narrative_function
    id: coe:concept/evidence_types_taxonomy/narrative_function/problem_framing
    label: Problem Framing
    description: 'The evidence defines and substantiates the problem the argument addresses'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/narrative_function
    id: coe:concept/evidence_types_taxonomy/narrative_function/stakes_amplification
    label: Stakes Amplification
    description: 'The evidence escalates the cost of inaction or the severity of consequences, building urgency before the solution appears'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/narrative_function
    id: coe:concept/evidence_types_taxonomy/narrative_function/solution_proof
    label: Solution Proof
    description: 'The evidence demonstrates that the proposed solution works'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/narrative_function
    id: coe:concept/evidence_types_taxonomy/narrative_function/outcome_illustration
    label: Outcome Illustration
    description: 'The evidence shows realised results and benefits after the solution is adopted — the closing beat of the argument''s story arc'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    id: coe:concept/evidence_types_taxonomy/argument_stance
    label: Argument Stance
    description: The relational stance of one argument component toward another in the argument graph
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/argument_stance
    id: coe:concept/evidence_types_taxonomy/argument_stance/support
    label: Support
    description: 'The component strengthens the acceptability of the component it targets (standard support relation in argumentation theory and argument mining)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/argument_stance
    id: coe:concept/evidence_types_taxonomy/argument_stance/attack
    label: Attack
    description: 'The component directly challenges the truth or acceptability of the target component (standard attack relation in argumentation theory)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/argument_stance
    id: coe:concept/evidence_types_taxonomy/argument_stance/partial_attack
    label: Partial Attack
    description: 'The component challenges only part of the target — a sub-claim or its scope — while leaving the remainder standing (argument-mining stance category)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/evidence_types_taxonomy
    broader:
    - coe:concept/evidence_types_taxonomy/argument_stance
    id: coe:concept/evidence_types_taxonomy/argument_stance/undercut
    label: Undercut
    description: 'The component attacks the inferential link between the target''s data and claim rather than the claim itself — Pollock''s undercutting defeater from argumentation theory'
    home_domain: narrative
    status: canonical
