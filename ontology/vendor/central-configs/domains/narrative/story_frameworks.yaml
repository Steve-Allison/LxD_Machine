  id: coe:artifact/narrative/discourse_taxonomy
  label: Discourse Taxonomy
  description: Classification of discourse structures by relation type, coherence level, connective function, complexity tier,
    and analysis granularity
  home_domain: narrative
  status: canonical
  concepts:
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    id: coe:concept/discourse_taxonomy/relation_type
    label: Discourse Relation Type
    description: The RST or discourse relation connecting two text spans
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/relation_type
    id: coe:concept/discourse_taxonomy/relation_type/presentational
    label: Presentational
    description: 'Relations that work on the reader''s inclination to accept a claim — motivation, antithesis, background, enablement, justification, and concession'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/relation_type
    id: coe:concept/discourse_taxonomy/relation_type/subject_matter
    label: Subject Matter
    description: 'Relations holding between the semantic content of the discourse units themselves — elaboration, cause, condition, contrast, sequence, restatement, evaluation, and solutionhood'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    id: coe:concept/discourse_taxonomy/coherence_level
    label: Coherence Level
    description: The scope of the coherence mechanism
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/coherence_level
    id: coe:concept/discourse_taxonomy/coherence_level/local
    label: Local
    description: 'Sentence-to-sentence coherence achieved through coreference, lexical repetition, conjunction, and ellipsis'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/coherence_level
    id: coe:concept/discourse_taxonomy/coherence_level/global
    label: Global
    description: 'Macro-level coherence achieved through topic progression and rhetorical organisation — topic sentences, section headers, thesis-support structure, and narrative arc'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/coherence_level
    id: coe:concept/discourse_taxonomy/coherence_level/relational
    label: Relational
    description: 'Coherence achieved by explicitly signalling how discourse units relate to each other — discourse connectives, RST relations, transition phrases, and metadiscourse markers'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    id: coe:concept/discourse_taxonomy/connective_function
    label: Connective Function
    description: The semantic role of the discourse connective
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/connective_function
    id: coe:concept/discourse_taxonomy/connective_function/additive
    label: Additive
    description: 'Adds information without contrast or causality (and, also, furthermore, moreover)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/connective_function
    id: coe:concept/discourse_taxonomy/connective_function/adversative
    label: Adversative
    description: 'Signals contrast, concession, or an unexpected outcome (but, however, although, nevertheless)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/connective_function
    id: coe:concept/discourse_taxonomy/connective_function/causal
    label: Causal
    description: 'Signals cause-effect, reason, or purpose (because, therefore, consequently, as a result)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/connective_function
    id: coe:concept/discourse_taxonomy/connective_function/temporal
    label: Temporal
    description: 'Signals time relationships or sequence (then, next, before, after, meanwhile)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/connective_function
    id: coe:concept/discourse_taxonomy/connective_function/conditional
    label: Conditional
    description: 'Signals contingency or hypothetical relationships (if, unless, provided that, assuming)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/connective_function
    id: coe:concept/discourse_taxonomy/connective_function/exemplifying
    label: Exemplifying
    description: 'Introduces examples or illustrations (for example, for instance, such as, namely)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/connective_function
    id: coe:concept/discourse_taxonomy/connective_function/reformulating
    label: Reformulating
    description: 'Restates or clarifies previous content (in other words, that is, put simply)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    id: coe:concept/discourse_taxonomy/complexity_tier
    label: Complexity Tier
    description: The structural complexity of the discourse unit
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/complexity_tier
    id: coe:concept/discourse_taxonomy/complexity_tier/simple
    label: Simple
    description: 'A single clause or sentence carrying one proposition, with no embedding'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/complexity_tier
    id: coe:concept/discourse_taxonomy/complexity_tier/compound
    label: Compound
    description: 'Two or more independent clauses joined by coordination, with at most one level of embedding'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/complexity_tier
    id: coe:concept/discourse_taxonomy/complexity_tier/complex
    label: Complex
    description: 'A main clause with one or more subordinate clauses, introducing hierarchical embedding'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/complexity_tier
    id: coe:concept/discourse_taxonomy/complexity_tier/compound_complex
    label: Compound Complex
    description: 'Multiple independent clauses combined with embedded subordination'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/complexity_tier
    id: coe:concept/discourse_taxonomy/complexity_tier/multi_level
    label: Multi Level
    description: 'Deeply nested discourse with four or more levels of embedding — the highest structural complexity tier'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    id: coe:concept/discourse_taxonomy/analysis_granularity
    label: Analysis Granularity
    description: The level at which discourse analysis is conducted
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/analysis_granularity
    id: coe:concept/discourse_taxonomy/analysis_granularity/clause_level
    label: Clause Level
    description: 'Analysis conducted over individual clauses — the finest granularity, corresponding to elementary discourse units (standard discourse-analysis unit)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/analysis_granularity
    id: coe:concept/discourse_taxonomy/analysis_granularity/sentence_level
    label: Sentence Level
    description: 'Analysis conducted over whole sentences rather than their constituent clauses (standard discourse-analysis unit)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/analysis_granularity
    id: coe:concept/discourse_taxonomy/analysis_granularity/paragraph_level
    label: Paragraph Level
    description: 'Analysis conducted over paragraphs, capturing relations between grouped sentences (standard discourse-analysis unit)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/analysis_granularity
    id: coe:concept/discourse_taxonomy/analysis_granularity/section_level
    label: Section Level
    description: 'Analysis conducted over document sections, capturing macro-structural relations between major divisions (standard discourse-analysis unit)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/discourse_taxonomy
    broader:
    - coe:concept/discourse_taxonomy/analysis_granularity
    id: coe:concept/discourse_taxonomy/analysis_granularity/document_level
    label: Document Level
    description: 'Analysis conducted over the document as a whole, addressing global structure and overall coherence (standard discourse-analysis unit)'
    home_domain: narrative
    status: canonical
  top_concepts:
  - coe:concept/discourse_taxonomy/relation_type
  - coe:concept/discourse_taxonomy/coherence_level
  - coe:concept/discourse_taxonomy/connective_function
  - coe:concept/discourse_taxonomy/complexity_tier
