_meta:
  file_id: coe:file/domain/narrative/story_frameworks
  title: Narrative — Story Frameworks
  last_updated: '2026-09-02'
  authority: Central_Configs
  scope: domain
  ontology_domain: narrative
  governing_class: coe:DomainModule
module_id: coe:module/narrative/story_frameworks
domain: narrative
taxonomies:
- last_updated: '2026-09-01'
  id: coe:artifact/narrative/character_archetypes_taxonomy
  label: Character Archetypes Taxonomy
  description: Classification of character archetypes by origin tradition, narrative role, archetype function, narrative valence,
    and corporate applicability.
  home_domain: narrative
  status: canonical
  concepts:
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    id: coe:concept/character_archetypes_taxonomy/origin_tradition
    label: Origin Tradition
    description: The theoretical tradition the archetype derives from
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/origin_tradition
    id: coe:concept/character_archetypes_taxonomy/origin_tradition/heros_journey
    label: Hero's Journey
    description: 'Campbell''s monomyth structure as adapted by Vogler into eight archetypal roles — hero, mentor, threshold guardian, herald, shapeshifter, villain, trickster, and ally'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/origin_tradition
    id: coe:concept/character_archetypes_taxonomy/origin_tradition/jungian
    label: Jungian
    description: 'Jung''s collective-unconscious archetypes expressing universal patterns of human experience — self, shadow, anima/animus, persona, wise old man, great mother, child, and trickster'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/origin_tradition
    id: coe:concept/character_archetypes_taxonomy/origin_tradition/proppian
    label: Proppian
    description: 'Propp''s seven dramatis personae character functions derived from Russian folktale analysis — villain, donor, helper, princess, dispatcher, hero, and false hero'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/origin_tradition
    id: coe:concept/character_archetypes_taxonomy/origin_tradition/business_narrative
    label: Business Narrative
    description: 'Corporate storytelling adaptations that cast the customer as hero and the vendor as mentor, with industry forces, market signals, and regulators filling the remaining roles'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/origin_tradition
    id: coe:concept/character_archetypes_taxonomy/origin_tradition/storybrand
    label: StoryBrand
    description: 'Miller''s SB7 framework positioning the customer as hero, the brand as guide, and three-layer obstacles (external, internal, philosophical) as the villain — the brand wins by empathy and authority, not force'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/origin_tradition
    id: coe:concept/character_archetypes_taxonomy/origin_tradition/b2b_stakeholder
    label: B2B Stakeholder
    description: 'Buying-committee roles in enterprise sales narratives, where each stakeholder requires a tailored narrative approach based on their motivations and decision authority'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/origin_tradition
    id: coe:concept/character_archetypes_taxonomy/origin_tradition/learning_narrative
    label: Learning Narrative
    description: 'Narrative roles adapted for instructional and training contexts, where learners are heroes navigating skill gaps and educators serve as mentors'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    id: coe:concept/character_archetypes_taxonomy/narrative_role
    label: Narrative Role
    description: The functional role the archetype plays in the story structure
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_role
    id: coe:concept/character_archetypes_taxonomy/narrative_role/protagonist
    label: Protagonist
    description: 'The central character who drives the story forward through action and transformation, providing the audience''s point of identification and emotional anchor'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_role
    id: coe:concept/character_archetypes_taxonomy/narrative_role/guide
    label: Guide
    description: 'The character who provides wisdom, tools, or support to the protagonist, transferring the knowledge or capability that enables the hero''s success'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_role
    id: coe:concept/character_archetypes_taxonomy/narrative_role/antagonist
    label: Antagonist
    description: 'The force creating conflict, obstacles, or tension — the resistance that makes the hero''s journey meaningful'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_role
    id: coe:concept/character_archetypes_taxonomy/narrative_role/catalyst
    label: Catalyst
    description: 'The character or event that initiates the story and calls the hero to action, disrupting the status quo to create the inciting incident'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_role
    id: coe:concept/character_archetypes_taxonomy/narrative_role/gatekeeper
    label: Gatekeeper
    description: 'A test or barrier that must be overcome before progress can continue, testing readiness and raising stakes before the hero enters the next phase'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_role
    id: coe:concept/character_archetypes_taxonomy/narrative_role/disruptor
    label: Disruptor
    description: 'A character who challenges assumptions and introduces unexpected change, preventing complacency and forcing creative problem-solving'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_role
    id: coe:concept/character_archetypes_taxonomy/narrative_role/transformer
    label: Transformer
    description: 'A character who undergoes visible change as a result of the protagonist''s journey, validating the narrative arc for the audience through observed transformation'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_role
    id: coe:concept/character_archetypes_taxonomy/narrative_role/evaluator
    label: Evaluator
    description: 'A stakeholder who assesses the protagonist''s solution or journey before committing — representing the rational and political dimensions of commitment in B2B purchase narratives'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    id: coe:concept/character_archetypes_taxonomy/archetype_function
    label: Archetype Function
    description: What the archetype does within the narrative
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/archetype_function
    id: coe:concept/character_archetypes_taxonomy/archetype_function/transformation
    label: Transformation
    description: 'Drives change from one state to another — the function of hero figures at climax and resolution'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/archetype_function
    id: coe:concept/character_archetypes_taxonomy/archetype_function/enablement
    label: Enablement
    description: 'Provides tools, knowledge, or support to make success possible — the function of mentors and guides during preparation and approach'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/archetype_function
    id: coe:concept/character_archetypes_taxonomy/archetype_function/opposition
    label: Opposition
    description: 'Creates conflict and raises stakes — the function of villain figures at complication and crisis'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/archetype_function
    id: coe:concept/character_archetypes_taxonomy/archetype_function/initiation
    label: Initiation
    description: 'Triggers the narrative by disrupting the status quo — the function of herald figures at the inciting incident'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/archetype_function
    id: coe:concept/character_archetypes_taxonomy/archetype_function/testing
    label: Testing
    description: 'Validates readiness and commitment — the function of threshold guardians and evaluators at threshold crossings'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/archetype_function
    id: coe:concept/character_archetypes_taxonomy/archetype_function/disruption
    label: Disruption
    description: 'Introduces chaos, humour, or unexpected perspectives — the trickster function that breaks expectations at any phase'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/archetype_function
    id: coe:concept/character_archetypes_taxonomy/archetype_function/validation
    label: Validation
    description: 'Confirms the protagonist''s solution or journey by demonstrating visible positive outcomes, building credibility through proof at resolution'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/archetype_function
    id: coe:concept/character_archetypes_taxonomy/archetype_function/advocacy
    label: Advocacy
    description: 'Actively champions the protagonist''s cause within an organisation or buying committee, converting internal resistance and building momentum before the decision'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    id: coe:concept/character_archetypes_taxonomy/narrative_valence
    label: Narrative Valence
    description: Whether the archetype is constructive, destructive, or ambiguous
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_valence
    id: coe:concept/character_archetypes_taxonomy/narrative_valence/positive
    label: Positive
    description: 'The archetype contributes constructively to the protagonist''s success'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_valence
    id: coe:concept/character_archetypes_taxonomy/narrative_valence/negative
    label: Negative
    description: 'The archetype creates obstacles or opposition to the protagonist'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_valence
    id: coe:concept/character_archetypes_taxonomy/narrative_valence/ambiguous
    label: Ambiguous
    description: 'The archetype''s role shifts or is contextually dependent — it may help or hinder depending on circumstance'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/narrative_valence
    id: coe:concept/character_archetypes_taxonomy/narrative_valence/neutral
    label: Neutral
    description: 'The archetype serves a structural function without inherent positive or negative charge'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    id: coe:concept/character_archetypes_taxonomy/corporate_applicability
    label: Corporate Applicability
    description: How readily the archetype maps to business storytelling contexts
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/corporate_applicability
    id: coe:concept/character_archetypes_taxonomy/corporate_applicability/high
    label: High
    description: 'The archetype maps directly to standard corporate narrative patterns — case studies, sales narratives, keynote stories, and B2B proposals'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/corporate_applicability
    id: coe:concept/character_archetypes_taxonomy/corporate_applicability/medium
    label: Medium
    description: 'The archetype is useful in specific corporate contexts such as change-management, compliance, and stakeholder narratives rather than everyday business storytelling'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/corporate_applicability
    id: coe:concept/character_archetypes_taxonomy/corporate_applicability/low
    label: Low
    description: 'The archetype is primarily relevant to creative or literary narrative analysis, surfacing in business use only for advanced critique or positioning work'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    id: coe:concept/character_archetypes_taxonomy/arc_types
    label: Narrative Arc Type
    description: The trajectory of change the archetype undergoes or catalyses across the story
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/arc_types
    id: coe:concept/character_archetypes_taxonomy/arc_types/positive_change
    label: Positive Change
    description: 'An arc in which the character grows toward a better state, ending the story stronger or better off than they began — the standard change arc of character-arc theory (McKee 1997)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/arc_types
    id: coe:concept/character_archetypes_taxonomy/arc_types/negative_change
    label: Negative Change
    description: 'An arc in which the character declines or is corrupted, ending worse off than they began — the tragic counterpart to the positive change arc (McKee 1997)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/arc_types
    id: coe:concept/character_archetypes_taxonomy/arc_types/flat
    label: Flat
    description: 'An arc in which the character remains essentially unchanged, instead catalysing change in others or the surrounding world — the steadfast arc of character-arc theory'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    id: coe:concept/character_archetypes_taxonomy/buying_role
    label: B2B Buying Role
    description: The purchasing-committee role the archetype occupies in enterprise sales narratives
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/buying_role
    id: coe:concept/character_archetypes_taxonomy/buying_role/approver
    label: Approver
    description: 'The committee member holding final sign-off and budget authority, who must be persuaded before the purchase concludes'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/buying_role
    id: coe:concept/character_archetypes_taxonomy/buying_role/champion
    label: Champion
    description: 'The internal advocate who actively promotes the solution inside the buying organisation, converting resistance and building momentum toward the decision'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/buying_role
    id: coe:concept/character_archetypes_taxonomy/buying_role/influencer
    label: Influencer
    description: 'A committee member who shapes the opinions of decision-makers without holding direct purchase authority'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/buying_role
    id: coe:concept/character_archetypes_taxonomy/buying_role/user
    label: User
    description: 'The stakeholder who will work with the solution day-to-day and judges it on practical usability rather than strategic or budgetary grounds'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/buying_role
    id: coe:concept/character_archetypes_taxonomy/buying_role/technical_evaluator
    label: Technical Evaluator
    description: 'The committee member who tests the solution''s technical fitness and compliance — a gatekeeper whose assessment must be passed before commitment'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/character_archetypes_taxonomy
    broader:
    - coe:concept/character_archetypes_taxonomy/buying_role
    id: coe:concept/character_archetypes_taxonomy/buying_role/skeptic
    label: Skeptic
    description: 'The committee member who doubts and challenges the vendor''s claims, forcing stronger proof — a disruptor whose objections must be answered rather than avoided'
    home_domain: narrative
    status: canonical
  top_concepts:
  - coe:concept/character_archetypes_taxonomy/origin_tradition
  - coe:concept/character_archetypes_taxonomy/narrative_role
  - coe:concept/character_archetypes_taxonomy/archetype_function
  - coe:concept/character_archetypes_taxonomy/narrative_valence
  - coe:concept/character_archetypes_taxonomy/corporate_applicability
  - coe:concept/character_archetypes_taxonomy/arc_types
  - coe:concept/character_archetypes_taxonomy/buying_role
- last_updated: '2026-09-01'
  id: coe:artifact/narrative/descriptive_rst_taxonomy
  label: Descriptive Rst Taxonomy
  description: Classification system for RST rhetorical relations, discourse signal typologies, parsing strategies, tree topologies,
    and comparative discourse frameworks.
  home_domain: narrative
  status: canonical
  concepts:
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    id: coe:concept/descriptive_rst_taxonomy/relation_class
    label: relation_class
    description: RST-DT rhetorical groups and structural conventions; a coarse group does not fix semantic direction or nuclearity.
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/attribution
    label: Attribution
    description: "RST-DT group for attribution and negative attribution; the satellite supplies the source of the nuclear content."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/background
    label: Background
    description: "RST-DT group for background and circumstance, supplying context for interpreting the nucleus."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/cause
    label: Cause
    description: "RST-DT group for cause, result and consequence; direction depends on the fine label and nuclearity."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/comparison
    label: Comparison
    description: "RST-DT group for comparison, analogy, preference and proportion; members may be mononuclear or multinuclear."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/condition
    label: Condition
    description: "RST-DT group for condition, hypothetical, contingency and otherwise, distinguishing unrealized conditions, hypothetical scenarios, recurrence and alternatives."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/contrast
    label: Contrast
    description: "RST-DT group containing multinuclear contrast and mononuclear concession and antithesis; group membership does not determine nuclearity."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/elaboration
    label: Elaboration
    description: "RST-DT group for additional detail, general-specific, part-whole, process-step, object-attribute and set-member elaboration, example and definition."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/enablement
    label: Enablement
    description: "RST-DT group containing enablement and purpose, distinguishing facilitation of an unrealized situation from an intended goal."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/evaluation
    label: Evaluation
    description: "RST-DT group for evaluation, interpretation, conclusion and comment; fine labels and nuclearity locate the assessment or concluding perspective."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/explanation
    label: Explanation
    description: "RST-DT group for evidence, explanation-argumentative and reason, distinguishing persuasion, factual explanation and an animate agent's reason for acting."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/joint
    label: Joint
    description: "RST-DT group containing list and disjunction, joining nuclei through enumeration or alternatives."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/manner_means
    label: Manner Means
    description: "RST-DT group containing manner and means, distinguishing the style of an action from the method used to accomplish a goal."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/same_unit
    label: Same Unit
    description: "RST-DT structural pseudo-relation rejoining interrupted portions of an EDU; multinuclear by annotation convention."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/summary
    label: Summary
    description: "RST-DT group containing summary and restatement. A summary may occupy nucleus or satellite; restatement reiterates nuclear content in a satellite."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/temporal
    label: Temporal
    description: "RST-DT group containing temporal-before, temporal-after, temporal-same-time, sequence and inverted-sequence; fine labels preserve chronology and nuclearity."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/textual_organization
    label: Textual Organization
    description: "RST-DT structural relation connecting schematically labelled text spans; multinuclear by annotation convention."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/topic_change
    label: Topic Change
    description: "RST-DT group containing smooth topic drift and sharp topic shift; members may be mononuclear or multinuclear."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/relation_class
    id: coe:concept/descriptive_rst_taxonomy/relation_class/topic_comment
    label: Topic Comment
    description: "RST-DT group containing problem-solution, question-answer, statement-response, topic-comment, comment-topic and rhetorical-question; fine labels distinguish roles and direction."
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    id: coe:concept/descriptive_rst_taxonomy/signal_typology
    label: signal_typology
    description: Five distinct categories of discourse signals that indicate rhetorical relations, ranging from explicit lexical
      markers, a minority of relations, to implicit semantic, syntactic, morphological, and graphical cues that carry the majority.
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/signal_typology
    id: coe:concept/descriptive_rst_taxonomy/signal_typology/semantic
    label: Semantic
    description: 'Signals derived from meaning-level relationships between lexical items across EDUs — lexical chains, synonymy, meronymy, and coreference; the largest signal category'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/signal_typology
    id: coe:concept/descriptive_rst_taxonomy/signal_typology/syntactic
    label: Syntactic
    description: 'Signals derived from grammatical constructions and clause-structure patterns such as parallelism, relative clauses, clause mood, and reported speech'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/signal_typology
    id: coe:concept/descriptive_rst_taxonomy/signal_typology/morphological
    label: Morphological
    description: 'Signals derived from word-form variation, chiefly verb-tense shifts and person-marker changes between adjacent EDUs'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/signal_typology
    id: coe:concept/descriptive_rst_taxonomy/signal_typology/graphical
    label: Graphical
    description: 'Signals derived from visual and typographic features of the text — punctuation boundaries, paragraph breaks, and section headings'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/signal_typology
    id: coe:concept/descriptive_rst_taxonomy/signal_typology/discourse_marker
    label: Discourse Marker
    description: 'Explicit lexical connectives that directly name a rhetorical relation — the most studied signal type, yet accounting for only a minority of discourse relations'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    id: coe:concept/descriptive_rst_taxonomy/nuclearity_configuration
    label: nuclearity_configuration
    description: Structural configuration indicating relative semantic weight between spans. Determines which span carries
      the core communicative intent.
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/nuclearity_configuration
    id: coe:concept/descriptive_rst_taxonomy/nuclearity_configuration/nucleus_satellite
    label: Nucleus Satellite
    description: 'Hypotactic configuration in which the nucleus precedes its supporting satellite, the nucleus carrying the core communicative intent (Mann & Thompson 1988)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/nuclearity_configuration
    id: coe:concept/descriptive_rst_taxonomy/nuclearity_configuration/satellite_nucleus
    label: Satellite Nucleus
    description: 'Hypotactic configuration in which the satellite precedes the nucleus it supports, delaying the span that carries the core communicative intent (Mann & Thompson 1988)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/nuclearity_configuration
    id: coe:concept/descriptive_rst_taxonomy/nuclearity_configuration/nucleus_nucleus
    label: Nucleus Nucleus
    description: 'Multinuclear configuration in which two or more spans carry equal semantic weight with no subordination (Mann & Thompson 1988)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    id: coe:concept/descriptive_rst_taxonomy/parsing_strategy
    label: parsing_strategy
    description: Algorithmic approach for automated discourse tree construction from raw text.
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/parsing_strategy
    id: coe:concept/descriptive_rst_taxonomy/parsing_strategy/bottom_up
    label: Bottom Up
    description: 'Shift-reduce approach that iteratively evaluates adjacent units in a working stack, building the tree from leaf EDUs upward — precise at intra-sentential boundaries but sequential, so early errors propagate'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/parsing_strategy
    id: coe:concept/descriptive_rst_taxonomy/parsing_strategy/top_down
    label: Top Down
    description: 'Sequential-bisection approach treating the whole document as one macro-span and recursively predicting optimal split points — captures global coherence efficiently but loses precision at fine-grained boundaries'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/parsing_strategy
    id: coe:concept/descriptive_rst_taxonomy/parsing_strategy/hybrid
    label: Hybrid
    description: 'Ensemble approach using an efficient lower-parameter model for segmentation and a highly parameterised reasoning model for relation assignment, optimising both cost and accuracy'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    id: coe:concept/descriptive_rst_taxonomy/discourse_framework
    label: discourse_framework
    description: Major computational discourse theories with distinct topological structures, scope, and recursion handling.
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/discourse_framework
    id: coe:concept/descriptive_rst_taxonomy/discourse_framework/rst
    label: RST
    description: 'Mann and Thompson''s Rhetorical Structure Theory — highly recursive projective trees capturing global document structure, whose strict tree constraints force concurrent relations to be discarded'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/discourse_framework
    id: coe:concept/descriptive_rst_taxonomy/discourse_framework/pdtb
    label: PDTB
    description: 'The Penn Discourse Treebank annotates argument pairs, relation types and senses for explicit and implicit discourse relations, without requiring a single document-wide discourse tree.'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/discourse_framework
    id: coe:concept/descriptive_rst_taxonomy/discourse_framework/sdrt
    label: SDRT
    description: 'Segmented Discourse Representation Theory represents discourse constituents and their semantic and pragmatic relations, including complex constituents and constraints on accessible attachment sites.'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/discourse_framework
    id: coe:concept/descriptive_rst_taxonomy/discourse_framework/erst
    label: eRST
    description: 'Enhanced RST augments a primary rhetorical tree with secondary relations and anchored discourse signals, allowing additional relations to be represented without replacing the primary tree.'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    id: coe:concept/descriptive_rst_taxonomy/tree_topology
    label: tree_topology
    description: The graph-theoretic structure used to represent discourse relations.
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/tree_topology
    id: coe:concept/descriptive_rst_taxonomy/tree_topology/projective_tree
    label: Projective Tree
    description: 'Strict single-parent tree with no crossing edges — the topology of classical RST'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/tree_topology
    id: coe:concept/descriptive_rst_taxonomy/tree_topology/augmented_graph
    label: Augmented Graph
    description: 'A primary tree augmented by secondary cross-branch edges that capture concurrent relations without abandoning the hierarchy — the topology of eRST'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/tree_topology
    id: coe:concept/descriptive_rst_taxonomy/tree_topology/flat_pairs
    label: Flat Pairs
    description: 'Relations represented as argument pairs without imposing a single global tree; argument spans need not be adjacent.'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/tree_topology
    id: coe:concept/descriptive_rst_taxonomy/tree_topology/directed_acyclic_graph
    label: Directed Acyclic Graph
    description: 'Graph structure permitting multi-parent dependencies and crossing edges while remaining acyclic — the topology of SDRT'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    id: coe:concept/descriptive_rst_taxonomy/schema_extraction_pattern
    label: schema_extraction_pattern
    description: Engineering pattern for representing and assembling discourse structures extracted from model outputs.
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/schema_extraction_pattern
    id: coe:concept/descriptive_rst_taxonomy/schema_extraction_pattern/flat_relational_adjacency
    label: Flat Relational Adjacency
    description: 'Represent nodes and rhetorical edges as separate lists with explicit endpoint references, then reconstruct and validate the hierarchy locally.'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/schema_extraction_pattern
    id: coe:concept/descriptive_rst_taxonomy/schema_extraction_pattern/progressive_chunking
    label: Progressive Chunking
    description: 'Parse local subtrees separately and link their roots in a later pass; cross-chunk relations and the assembled structure require validation.'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/schema_extraction_pattern
    id: coe:concept/descriptive_rst_taxonomy/schema_extraction_pattern/direct_recursive
    label: Direct Recursive
    description: 'Represent nested tree nodes directly through recursive schema references; support and depth constraints depend on the selected output system.'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    id: coe:concept/descriptive_rst_taxonomy/application_domain
    label: application_domain
    description: Downstream NLP task that consumes parsed discourse structures as input features.
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/application_domain
    id: coe:concept/descriptive_rst_taxonomy/application_domain/extractive_summarization
    label: Extractive Summarization
    description: 'Summarization by selecting spans verbatim from the source, exploiting nuclearity-based deterministic tree pruning to decide which units survive'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/application_domain
    id: coe:concept/descriptive_rst_taxonomy/application_domain/abstractive_summarization
    label: Abstractive Summarization
    description: 'Summarization that generates new phrasing rather than selecting source spans, using discourse structure to judge content salience (standard NLP task)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/application_domain
    id: coe:concept/descriptive_rst_taxonomy/application_domain/sentiment_analysis
    label: Sentiment Analysis
    description: 'Classification of evaluative polarity in text, with discourse structure enabling sentiment propagation through hierarchical weighting of spans'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/application_domain
    id: coe:concept/descriptive_rst_taxonomy/application_domain/coherence_evaluation
    label: Coherence Evaluation
    description: 'Scoring how well a text hangs together, using the parsed relation structure itself as the coherence signal (standard NLP task)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/application_domain
    id: coe:concept/descriptive_rst_taxonomy/application_domain/authorship_attribution
    label: Authorship Attribution
    description: 'Identifying a text''s author from stylistic patterns, with habitual discourse-structuring choices serving as discriminating features (standard NLP task)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/application_domain
    id: coe:concept/descriptive_rst_taxonomy/application_domain/deception_detection
    label: Deception Detection
    description: 'Detecting deceptive text from linguistic cues, including atypical discourse structuring relative to truthful writing (standard NLP task)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/application_domain
    id: coe:concept/descriptive_rst_taxonomy/application_domain/question_answering
    label: Question Answering
    description: 'Answering natural-language questions over text, using discourse relations to locate the spans that bear the answer (standard NLP task)'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/descriptive_rst_taxonomy
    broader:
    - coe:concept/descriptive_rst_taxonomy/application_domain
    id: coe:concept/descriptive_rst_taxonomy/application_domain/argument_mining
    label: Argument Mining
    description: 'Automatic extraction of claims, premises, and their support and attack relations, for which parsed discourse relations provide structural scaffolding (standard NLP task)'
    home_domain: narrative
    status: canonical
  top_concepts:
  - coe:concept/descriptive_rst_taxonomy/relation_class
  - coe:concept/descriptive_rst_taxonomy/signal_typology
  - coe:concept/descriptive_rst_taxonomy/nuclearity_configuration
  - coe:concept/descriptive_rst_taxonomy/parsing_strategy
  - coe:concept/descriptive_rst_taxonomy/discourse_framework
  - coe:concept/descriptive_rst_taxonomy/tree_topology
  - coe:concept/descriptive_rst_taxonomy/schema_extraction_pattern
