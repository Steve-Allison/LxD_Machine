  - coe:concept/evidence_types_taxonomy/source_authority
  - coe:concept/evidence_types_taxonomy/argument_direction
  - coe:concept/evidence_types_taxonomy/rhetorical_appeal
  - coe:concept/evidence_types_taxonomy/narrative_function
