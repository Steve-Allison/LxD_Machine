  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/aristotelian_appeal
    id: coe:concept/rhetorical_devices_taxonomy/aristotelian_appeal/logos
    label: Logos
    description: 'Appeal to reason — persuasion through evidence and logical argument'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/aristotelian_appeal
    id: coe:concept/rhetorical_devices_taxonomy/aristotelian_appeal/ethos
    label: Ethos
    description: 'Appeal to credibility — persuasion through demonstrated expertise, character, or trustworthiness'
    home_domain: narrative
    status: canonical
  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/aristotelian_appeal
    id: coe:concept/rhetorical_devices_taxonomy/aristotelian_appeal/pathos
    label: Pathos
    description: 'Appeal to emotion — persuasion through emotional resonance, storytelling, or connection to values'
    home_domain: narrative
