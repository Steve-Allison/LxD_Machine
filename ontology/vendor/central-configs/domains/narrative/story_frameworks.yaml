  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/aristotelian_appeal
    id: coe:concept/rhetorical_devices_taxonomy/aristotelian_appeal/kairos
    label: Kairos
    description: Appeal to the opportune moment — timing the message so its claim lands when the audience is most receptive;
      the post-Aristotelian fourth appeal alongside logos, ethos, and pathos
    home_domain: narrative
