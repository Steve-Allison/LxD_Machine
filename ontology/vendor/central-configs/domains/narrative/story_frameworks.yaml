  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/power_level
    id: coe:concept/rhetorical_devices_taxonomy/power_level/high
    label: High
    description: 'Strong impact — the foundation of effective rhetoric'
    home_domain: narrative
