  - in_scheme: coe:artifact/narrative/rhetorical_devices_taxonomy
    broader:
    - coe:concept/rhetorical_devices_taxonomy/power_level
    id: coe:concept/rhetorical_devices_taxonomy/power_level/medium
    label: Medium
    description: 'Useful support — effective in combination with other devices'
