    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/argument
    label: "Argument"
    description: "A reason supporting or opposing a position."
    in_scheme: coe:artifact/narrative/ibis_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/responds_to
    label: "Responds-to"
    description: "Connects a proposed position to its issue."
    in_scheme: coe:artifact/narrative/ibis_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/supports
    label: "Supports"
    description: "Connects a favourable argument to a position."
    in_scheme: coe:artifact/narrative/ibis_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/objects_to
    label: "Objects-to"
    description: "Connects an opposing argument to a position."
    in_scheme: coe:artifact/narrative/ibis_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/generalizes
    label: "Generalizes"
    description: "Connects an issue to a more specific issue it subsumes."
    in_scheme: coe:artifact/narrative/ibis_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/specializes
    label: "Specializes"
    description: "Connects an issue to a broader issue it narrows."
    in_scheme: coe:artifact/narrative/ibis_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/replaces
    label: "Replaces"
    description: "Connects an issue to the issue it supersedes."
    in_scheme: coe:artifact/narrative/ibis_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/questions
    label: "Questions"
    description: "Connects an issue to the deliberation node it challenges."
    in_scheme: coe:artifact/narrative/ibis_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/ibis_vocabulary/is_suggested_by
