- id: coe:artifact/narrative/sdrt_vocabulary
  label: "SDRT DISCOR Vocabulary"
  description: "Structural concepts and named relations in the DISCOR annotation manual. Other SDRT annotation profiles may differ; this vocabulary does not prescribe a universal relation-to-attachment classification."
  last_updated: '2026-09-05'
  home_domain: narrative
  status: canonical
  concepts:
  - id: coe:concept/sdrt_vocabulary/edu
    label: "Elementary Discourse Unit"
    description: "An elementary segment contributing a discourse representation."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/cdu
    label: "Complex Discourse Unit"
    description: "A group of discourse constituents interpreted together as a discourse unit."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/coordinating
    label: "Coordinating Relation"
    description: "Connects constituents at the same level of discourse structure."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/subordinating
    label: "Subordinating Relation"
    description: "Connects a constituent to one elaborating or explaining it at a subordinate level."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/right_frontier
    label: "Right Frontier Constraint"
    description: "Restricts incremental attachment to the latest constituent and its available structural superordinates."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/narration
    label: "Narration"
    description: "Relates successive events belonging to a coherent narrative sequence."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/elaboration
    label: "Elaboration"
    description: "Develops a constituent through more specific information about its content."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/explanation
    label: "Explanation"
    description: "Provides an explanatory cause for the preceding constituent's situation."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/result
    label: "Result"
    description: "Presents a consequence of the preceding constituent's situation."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
  - id: coe:concept/sdrt_vocabulary/background
    label: "Background"
    description: "Supplies contextual information about an event or object; event-state background overlaps temporally."
    in_scheme: coe:artifact/narrative/sdrt_vocabulary
    home_domain: narrative
    status: canonical
