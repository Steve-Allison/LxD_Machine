- id: coe:artifact/narrative/dung_semantics
  label: "Dung Abstract Argumentation Concepts"
  description: "Attack-based acceptability and extension semantics; support edges and internal premise structure are not part of this formalism."
  last_updated: '2026-09-05'
  home_domain: narrative
  status: canonical
  concepts:
  - id: coe:concept/dung_semantics/argument
    label: "Argument"
    description: "An abstract item whose internal reasoning is left unspecified."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/attack
    label: "Attack"
    description: "A directed challenge from one argument to another."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/conflict_free
    label: "Conflict-free Set"
    description: "An argument set containing no internal attack."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/acceptable
    label: "Acceptable Argument"
    description: "An argument whose every attacker is attacked by the evaluating set."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/admissible
    label: "Admissible Set"
    description: "A conflict-free set defending all its members."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/characteristic_function
    label: "Characteristic Function"
    description: "Maps an argument set to all arguments acceptable relative to it."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/complete
    label: "Complete Extension"
    description: "An admissible set containing every argument it defends."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/grounded
    label: "Grounded Extension"
    description: "The least fixed point of the characteristic function."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/preferred
    label: "Preferred Extension"
    description: "An admissible set maximal under set inclusion."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  - id: coe:concept/dung_semantics/stable
    label: "Stable Extension"
    description: "A conflict-free set attacking every argument outside itself."
    in_scheme: coe:artifact/narrative/dung_semantics
    home_domain: narrative
    status: canonical
  top_concepts:
  - coe:concept/dung_semantics/argument
  - coe:concept/dung_semantics/attack
  - coe:concept/dung_semantics/conflict_free
  - coe:concept/dung_semantics/acceptable
  - coe:concept/dung_semantics/admissible
  - coe:concept/dung_semantics/characteristic_function
  - coe:concept/dung_semantics/complete
  - coe:concept/dung_semantics/grounded
  - coe:concept/dung_semantics/preferred
  - coe:concept/dung_semantics/stable
- id: coe:artifact/narrative/ibis_vocabulary
  label: "IBIS Deliberation Vocabulary"
