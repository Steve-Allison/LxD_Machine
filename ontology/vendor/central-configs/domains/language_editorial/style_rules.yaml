    id: coe:entity/conversational_register
    label: Conversational Register
    description: Informal or conversational language patterns in corporate content
    home_domain: language_editorial
    status: canonical
    ner_label: CONVERSATIONAL_REGISTER
    examples:
    - okay, so let's dive in
    - here's the deal
    - check this out
    - you know what works?
