      predicate: coe:limits
      object_id: coe:entity/claim
      relationship_weight: expected
      description: The Phase 2 Gate requires Action Titles to use active verbs; passive voice limits claim effectiveness by
        weakening the declarative force of the insight statement (Canonical Presentation Methodology)
      statement_id: coe:edge/de7c89bb3775fe6c19dd3022
      home_domain: language_editorial
    - subject_id: coe:entity/passive_voice_marker
      predicate: coe:limits
      object_id: coe:entity/ethos_appeal
      relationship_weight: expected
      description: Passive voice limits ethos — it erases the agent and is negatively correlated with leadership perception
        and can signal passivity (elite_speaker_taxonomy)
      statement_id: coe:edge/7cc365b3688f9e5280e627ae
      home_domain: language_editorial
    - subject_id: coe:entity/passive_voice_marker
      predicate: coe:limits
      object_id: coe:entity/performance_tier
      relationship_weight: expected
      description: Passive auxiliary verbs are negatively correlated with leadership perception and novice speakers show low
        verb dynamism through passive voice per Elite Speaker Linguistic Analysis
      statement_id: coe:edge/19b5ccf9b3aac6ba0629fddb
      home_domain: language_editorial
    - subject_id: coe:entity/passive_voice_marker
      predicate: coe:triggers
      object_id: coe:entity/extraneous_load_marker
      relationship_weight: optional
      description: Vague passive constructions ('improvements were made') increase cognitive processing effort compared to
        active declarative titles per Slide Deck Design Playbook
      statement_id: coe:edge/1a1ac6d75f765394c3eae4bd
      home_domain: language_editorial
    - subject_id: coe:entity/passive_voice_marker
      predicate: coe:triggers
      object_id: coe:entity/readability_flag
      relationship_weight: expected
      description: Passive voice constructions trigger readability flags — passive phrasing increases sentence complexity
        and reduces directness per Best Practices for Writing
      statement_id: coe:edge/7738decd594335208b642bec
      home_domain: language_editorial
    - subject_id: coe:entity/passive_voice_marker
      predicate: coe:contrasts_with
      object_id: coe:entity/power_verb
      relationship_weight: expected
      description: Power verbs contrast with passive voice — elite speakers use high dynamic-to-stative verb ratios while
        passive auxiliary verbs correlate negatively with leadership perception (elite_speaker_taxonomy) | Passive voice contrasts
        with power verbs — passive auxiliary verbs (was/were) correlate negatively with leadership perception while dynamic
        verbs signal agency (elite_speaker_taxonomy)
      statement_id: coe:edge/a48b170784aa53e026d9ddd7
      home_domain: language_editorial
    id: coe:entity/passive_voice_marker
