    - subject_id: coe:entity/formal_register
      predicate: coe:limits
      object_id: coe:entity/mayer_generative_principle
      relationship_weight: optional
      description: Formal impersonal style reduces social engagement and deeper processing per personalization principle per
        Applying Mayer's Principles Practical Checklist
    - subject_id: coe:entity/formal_register
      predicate: coe:supports
      object_id: coe:entity/academic_bundle
