    - subject_id: coe:entity/conversational_register
      predicate: coe:enables
      object_id: coe:entity/mayer_generative_principle
      relationship_weight: expected
      description: Personalization principle shows conversational style activates social responses for deeper processing per
        Applying Mayer's Principles Practical Checklist
    - subject_id: coe:entity/conversational_register
      predicate: coe:enables
      object_id: coe:entity/narrative_hook
      relationship_weight: expected
      description: Conversational tone enables effective video hooks by making openings feel like natural speech (Best Video
        Script Prompts)
    - subject_id: coe:entity/conversational_register
      predicate: coe:bridges
      object_id: coe:entity/formal_register
      relationship_weight: expected
      description: The tone guide prescribes a voice that is 'formal but never stuffy' and 'reads like a conversation with
        an expert' — directly bridging formal and conversational registers per tone_of_voice_guide
    - subject_id: coe:entity/conversational_register
      predicate: coe:supports
      object_id: coe:entity/motivation_element
      relationship_weight: expected
      description: Mayer's personalization principle shows conversational tone increases learner motivation per Applying Mayer's
