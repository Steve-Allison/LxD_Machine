    - subject_id: coe:entity/jargon_marker
      predicate: coe:limits
      object_id: coe:entity/ethos_appeal
      relationship_weight: expected
      description: Excessive jargon undermines speaker credibility with non-specialist audiences by creating comprehension
        barriers that erode perceived trustworthiness per Ethos and Physicality research
    - subject_id: coe:entity/jargon_marker
      predicate: coe:limits
      object_id: coe:entity/performance_tier
      relationship_weight: expected
      description: Jargon limits performance tier — the Technocrat tier is characterized by high surprisal jargon that creates
        high cognitive load for the audience (elite_speaker_taxonomy)
    - subject_id: coe:entity/jargon_marker
      predicate: coe:limits
      object_id: coe:entity/readability_flag
      relationship_weight: required
      description: Orwell Rule 1 'Never use jargon when plain English will do' — jargon directly limits readability by replacing
        accessible terms with specialised ones per tone_of_voice_guide
    id: coe:entity/jargon_marker
    label: Jargon Marker
