entity_collections:
- entities:
  - id: coe:entity/inclusive_language_issue
    label: Inclusive Language Issue
    description: Exclusionary language bias gendered ableist racist stereotypical discriminatory inappropriate terminology
    home_domain: language_editorial
    status: canonical
    recognition_patterns:
    - (?i)\bInclusive\s+Language\s+Issue\b
    edges: []
    ner_label: INCLUSION_ISSUE
    examples:
    - Using 'guys' to address mixed groups
    - Using 'blind spot' as a metaphor
    - Using 'master/slave' in technical docs
    confidence_threshold: 0.7
  - id: coe:entity/cultural_sensitivity_issue
    label: Cultural Sensitivity Issue
    description: Cultural appropriation insensitivity stereotype regional assumption localisation problem global audience
    home_domain: language_editorial
    status: canonical
    recognition_patterns:
    - (?i)\bCultural\s+Sensitivity\s+Issue\b
    edges: []
    ner_label: CULTURAL_ISSUE
    examples:
    - USA-centric pop culture references
    - Assuming Western calendar/holidays
    - Sports metaphors (baseball, cricket)
    confidence_threshold: 0.65
  - id: coe:entity/accessibility_violation
    label: Accessibility Violation
    description: WCAG violation accessibility barrier screen reader keyboard caption alt text contrast colour blindness
    home_domain: language_editorial
    status: canonical
    recognition_patterns:
    - (?i)\bAccessibility\s+Violation\b
    edges: []
    ner_label: ACCESSIBILITY_ISSUE
    examples:
    - Image without alt text
    - Colour-only information
    - Insufficient contrast
    confidence_threshold: 0.8
