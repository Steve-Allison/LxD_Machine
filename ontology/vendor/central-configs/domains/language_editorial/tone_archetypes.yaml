entity_collections:
- id: coe:artifact/language_editorial/tone_archetypes
  label: Authoritative Tone Archetypes & Voice Registers
  description: The named voices, the dimensions on which a voice takes a stance, and the registers — kinds of authored words
    — a voice defines rules for; each voice's positions and rules are library records about these entities.
  last_updated: '2026-09-23'
  entities:
  - id: coe:entity/language_editorial/lxd_voice
    label: LxD Voice
    description: 'The Learning Experience Design house voice in which all learning content is authored — spines, visible copy, speaker notes, audio narration, video scripts and assessments — shaped to manage cognitive load and prompt active processing, so that the learner leaves understanding rather than merely informed.'
    home_domain: language_editorial
    status: canonical
    terms:
    - literal: LxD Pedagogical Voice
      term_type: full_form
      term_status: admitted
    - literal: Learning Experience Design Voice
      term_type: full_form
      term_status: admitted
  - id: coe:entity/language_editorial/stance_relationship_posture
    label: 'Voice Stance: Relationship Posture'
    description: 'The voice stance dimension that fixes where a voice stands relative to its audience — beside them as a guide or enabler, or in front of them as an authority — and who is credited with the result the piece describes.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/stance_address_identity
    label: 'Voice Stance: Address Identity'
    description: 'The voice stance dimension that fixes who speaks and to whom — a named person, a first-person we or an institution as the speaker — and how the audience is addressed.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/stance_worldview_lens
    label: 'Voice Stance: Worldview Lens'
    description: 'The voice stance dimension that fixes the lens every piece is framed through — the destination the voice treats as the point, such as understanding or creative possibility, against which coverage or efficiency count only as means.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/stance_opening_orientation
    label: 'Voice Stance: Opening Orientation'
    description: 'The voice stance dimension that fixes what a piece leads with and makes its emotional centre — a question to answer, a possibility to reach or a problem to escape — and so what moves the audience to read on.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/stance_brand_refusals
    label: 'Voice Stance: Brand Refusals'
    description: 'The voice stance dimension that lists the positions a voice will not take, as brand-level refusals distinct from the word-level terms it bans.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_spine_language
    label: 'Register: Spine Language'
    description: 'The register of a pieces narrative backbone — the sequence of moves assembled before any visible copy is written, which every other register then serves.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_assertion_lines
    label: 'Register: Assertion Lines'
    description: 'The register of a slides or sections governing claim — one full-sentence assertion the audience can agree or disagree with.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_visible_copy
    label: 'Register: Visible Copy'
    description: 'The register of the text an audience reads on screen or page, as distinct from what is spoken aloud.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_speaker_notes
    label: 'Register: Speaker Notes'
    description: 'The register of a presenters own notes — narrative and delivery guidance in the presenters spoken voice, read by the presenter and not by the room.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_learning_and_assessment
    label: 'Register: Learning And Assessment'
    description: 'The register of instructional copy addressed to a learner — objectives, instructions, assessment items and rubric descriptors.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_infographics
    label: 'Register: Infographics'
    description: 'The register of the words inside an infographic or data graphic — headlines, labels, captions and source notes that anchor the meaning of the visual.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_podcasts
    label: 'Register: Podcasts'
    description: 'The register of an audio programme — the spoken episode, its intro and outro, and the show notes that accompany it.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_website_and_marketing_copy
    label: 'Register: Website And Marketing Copy'
    description: 'The register of web pages and marketing copy written for a reader who scans rather than reads.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_long_form_written
    label: 'Register: Long Form Written'
    description: 'The register of books, chapters and articles — the spoken voice sustained over distance, with the reasoning shown.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_email_and_newsletter
    label: 'Register: Email And Newsletter'
    description: 'The register of email and newsletters, written by one person to one reader.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_education_audience
    label: 'Register: Education Audience'
    description: 'The register of content addressed to schoolteachers, and through them to their students, as distinct from corporate learning audiences.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_video_scripts
    label: 'Register: Video Scripts'
    description: 'The register of scripts performed to camera or narrated over video, written for the ear.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_quizzes_and_surveys
    label: 'Register: Quizzes And Surveys'
    description: 'The register of quiz items, survey questions and the feedback attached to them.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_hints_and_scaffolding
    label: 'Register: Hints And Scaffolding'
    description: 'The register of hints, prompts and scaffolds that guide a learner towards solving a problem themselves.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_accessibility_alt_text
    label: 'Register: Accessibility Alt Text'
    description: 'The register of text alternatives for images and graphics, read aloud by assistive technology in place of the visual.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_dramatic_dialogue
    label: 'Register: Dramatic Dialogue'
    description: 'The register of scripted dialogue between characters in learning drama and role-play scenes.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_worksheets_and_handouts
    label: 'Register: Worksheets And Handouts'
    description: 'The register of worksheets and handouts — the instructions and tasks a learner acts on, in print or on screen.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_branching_scenarios
    label: 'Register: Branching Scenarios'
    description: 'The register of branching scenarios — scene narration, character dialogue and the choices that route the learner.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_puzzles
    label: 'Register: Puzzles'
    description: 'The register of word puzzles and their instructions, used to reinforce curricular vocabulary.'
    home_domain: language_editorial
    status: canonical
  - id: coe:entity/language_editorial/register_multimedia_prompts
    label: 'Register: Multimedia Prompts'
    description: 'The register of prompts that direct generated or produced media — images, motion and video — including their pacing and tone.'
    home_domain: language_editorial
    status: canonical
  home_domain: language_editorial
  status: canonical
