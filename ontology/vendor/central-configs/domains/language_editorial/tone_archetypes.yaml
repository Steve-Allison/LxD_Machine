    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/pacing_mode
      label: pacing_mode
      description: 'The pacing configuration (business: `one_shot_decision_moment`; training: `iterative_practice_loop`).'
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/repetition_stance
      label: repetition_stance
      description: 'The repetition policy (business: `avoid`; training: `require`, spaced retrieval).'
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/skill_family
      label: skill_family
      description: The AI_Skills workflow family an instrument belongs to (`deck`, `video`, `content_map`, `learning_objectives`)
        — a classification axis orthogonal to corpus (audience) and ontology domain.
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/deck_type
      label: deck_type
      description: 'The binary kind of deck — `business` (persuade a `b_audience` to a decision) or `training` (build capability
        in an `l_audience`). **A closed enum: only these two values, in every file (SKILL.md, references, schemas, validators).**
        Deck _flavours_ (sales pitch, executive briefing, thought-leadership) are **not** deck_types — one field, one axis:
        a flavour decomposes into `b_audience` role + `commercial_ask` strength + opening intent. Setting `deck_type` to `sales`
        / `executive` / `thought_leadership` is forbidden (`TAXONOMY.md` §0.9 Anti-Pattern 2).'
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/staging_intent
      label: staging_intent
      description: 'The look-agnostic relational/emotional register a video beat wants — a **closed enum** of four bare values:
        `authority` (gravitas, certainty), `warmth` (closeness, trust), `proximity_close` (intimate, one-to-one), `proximity_open`
        (expansive, addressing the room). It is the cross-skill contract `video-script`''s wireframe emits and `video-genai`''s
        render spec consumes; it carries **no render detail** (camera height, proxemic cm, lectern, stage position — those
        are the render''s job). Grounded in Hall''s proxemic zones + camera-angle-as-power (`coesrc:3f1e5cb8c38b92666c95ae9715cd67f83f99956b67e891dcef17f8193b2f983d`,
        `virtual-presentation-delivery.md`). Note: the `authority` register-value is distinct from the Cialdini `authority`
        influence-principle (a `persuasion_video_lookup` key); no collision — neither is the other''s bare GLOSSARY term.'
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/vendor_reference
      label: vendor_reference
      description: 'A canonical project-side reference doc for a third-party platform''s API and prompt grammar, co-located
        with the integration tooling that consumes it at `the immutable vendor SourceRecord` (worked examples: `coesrc:43f765e87f5e91514985b7315c3845994c5017c87d7b8bcf068bb5820a802d02`,
        `coesrc:1e2d269ed191fc01eefb03b2f1748a2311988db26b4f45b0a80eabe3dd3259e0`; sibling vendors: `Code/Gamma/`, `Code/Wondercraft/`,
        `Code/ElevenLabs/`, `Code/PromptSmart/`). The **§16 Tier 3 home** for vendor / platform vocabulary — a vendor lookup
        in a skill''s `references/skill_tasks/lookups/` cites this file in `_meta.derives_from` and snapshots its operative
        terms. Distinct from `the immutable cross-vendor SourceRecords` (cross-vendor methodology + learning science), `ontology/data/domains/`
        (project-internal canon), and `corpus-snapshot/` (legacy un-gated form). Cited by `SKILL_AUTHORING_GUIDE` §15a (corpus
        homes) + §16 Tier 3 (Tier-3 vendor-vocab home).'
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/storyboard
      label: storyboard
      description: 'The structured 8-column blueprint produced by `video-genai` Phase 3 — the **primary deliverable** of the
        skill. Eight columns per scene: narration_slice / visual / audio / cinematography / performance / temporal / graphics
        / production_notes (Bandura modelling, Mayer, cognitive intent). Distinct from "storyboard" the casual concept (which
        informally names any visual plan); the canonical term refers ONLY to the schema-validated artefact at `Create_Skills/video-genai/assets/storyboard-schema.yaml`.
        Bare (non-colliding). Derived from `Prompt_Factory/_Prompts/Storyboard_Writer_Prompt.md`.'
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/scene
      label: scene
      description: The atomic visual unit of a `storyboard`. ONE narration slice + ONE cinematography decision + ONE frame
        image. **Distinct from `segment`**, which is the script-level narration unit in the upstream `video-script` wireframe
        — a `segment` may split into multiple `scenes` when visual flow demands a cut inside a narration block (but never
        inside the words; the script is inviolate). The cross-skill contract is `scene_index ≠ segment_index`; one or more
        scenes share an `upstream_segment_index` when split occurred. Bare.
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/frame_imagery
      label: frame_imagery
      description: The per-scene still image rendered by `video-genai` Phase 4 (Adobe MCP Firefly). Used as `image=` input
        to Veo's image-to-video flow in Phase 5 (image-to-video default; text-to-video fallback when frame absent). Live-mode-only
        — claude.ai interactive auth gates the Adobe MCP. Bare.
      home_domain: language_editorial
      status: canonical
    - in_scheme: coe:scheme/corpus_glossary
      id: coe:concept/corpus_glossary/craft_layer
      label: craft_layer
      description: 'The authorship layer a spoken-artefact knowledge entry (lookup entry / instrument) belongs to — a **closed
        enum** of three bare values: `script` (the words — rhetoric, phraseology, metaphor, sounds-human-when-read-aloud;
        performer- and render-agnostic), `performance` (delivery direction — pace, pause, volume, emphasis, intonation; performer-facing
        but render-agnostic, read identically by a human presenter or an avatar pipeline), `technical` (machine render — TTS
        engine, voice id, SSML/expression cues, avatar/lip-sync; render-target-specific). Discipline: one instrument carries
        one `craft_layer`; a script skill (`video-script`, `podcast-script`) consults `script` + `performance` only, never
        `technical`. Distinct from the 5-Layer Knowledge Architecture ("Layer 1–5") — no collision; neither is the other''s
        bare term. Grounded in `coesrc:bb4f8e3ab8025621a4c22954f5aeb96692dad85e6c5b62a9de4867e9a03231b7`.'
      home_domain: language_editorial
      status: canonical
    id: coe:scheme/corpus_glossary
    label: Corpus Glossary
    description: Canonical cross-corpus terminology.
    home_domain: language_editorial
    status: canonical
