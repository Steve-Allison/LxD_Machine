- last_updated: '2026-09-01'
  id: coe:artifact/language_editorial/corpus_glossary
  label: Corpus Glossary
  description: Canonical cross-corpus terminology.
  home_domain: language_editorial
  status: canonical
  concepts:
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/presenter
    label: presenter
    description: The persuader delivering a business deck — seller, executive, or subject expert.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/facilitator
    label: facilitator
    description: The instructor / coach delivering training.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/hook
    label: hook
    description: A business opening that builds rhetorical tension (SCQA Situation, provocative claim).
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/gain_attention
    label: gain_attention
    description: A training opening that activates prior knowledge and primes cognitive load (Gagné Event 1).
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/action_title
    label: action_title
    description: A declarative slide header asserting a claim of value (Minto).
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/instructional_event
    label: instructional_event
    description: A slide header naming a cognitive scaffold step (Gagné event, e.g. _Recall Prior Learning_).
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/proof_point
    label: proof_point
    description: Business body content that proves the action-title claim (data, charts, evidence).
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/scaffolding
    label: scaffolding
    description: Training body content that facilitates cognitive processing (worked examples, practice items).
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/imperative_verb
    label: imperative_verb
    description: A commitment-requesting verb for business CTAs — _approve_, _invest_, _commit_.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/bloom_verb
    label: bloom_verb
    description: An observable-capability verb for learning objectives — _apply_, _evaluate_, _create_.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/seller_notes
    label: seller_notes
    description: Speaker notes giving delivery tips and objection handling for a business deck.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/facilitator_guide
    label: facilitator_guide
    description: Speaker notes giving step-by-step instructions, activity debriefs, and timing for training.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/objections
    label: objections
    description: Financial, technical, or strategic barriers to buying.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/learner_resistance
    label: learner_resistance
    description: Cognitive barriers, prior misconceptions, or motivation gaps that impede learning.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/objection_handling
    label: objection_handling
    description: Live response that defuses purchase risk.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/check_for_understanding
    label: check_for_understanding
    description: Formative assessment that surfaces misconceptions and triggers correction.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/commercial_ask
    label: commercial_ask
    description: A close that requests a resource commitment (budget, sign-off, next meeting).
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/transfer_plan
    label: transfer_plan
    description: A close that prompts the learner to integrate the skill into daily workflow.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/red_team_critique
    label: red_team_critique
    description: A review simulating hostile or sceptical buyers checking for logical leaks.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/facilitator_critique
    label: facilitator_critique
    description: A review checking scaffolding clarity and cognitive load.
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/pacing_mode
    label: pacing_mode
    description: 'The pacing configuration (business: `one_shot_decision_moment`; training: `iterative_practice_loop`).'
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/repetition_stance
    label: repetition_stance
    description: 'The repetition policy (business: `avoid`; training: `require`, spaced retrieval).'
    home_domain: language_editorial
    status: canonical
  - in_scheme: coe:artifact/language_editorial/corpus_glossary
    id: coe:concept/corpus_glossary/scene
    label: scene
    description: The atomic visual unit of a `storyboard`. ONE narration slice + ONE cinematography decision + ONE frame image.
      **Distinct from `segment`**, which is the script-level narration unit in the upstream `video-script` wireframe — a `segment`
      may split into multiple `scenes` when visual flow demands a cut inside a narration block (but never inside the words;
      the script is inviolate). The cross-skill contract is `scene_index ≠ segment_index`; one or more scenes share an `upstream_segment_index`
      when split occurred. Bare.
    home_domain: language_editorial
    status: canonical
