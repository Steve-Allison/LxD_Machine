bundle_id: coe:domain/learning/assessment_rubrics
domain: learning
version: 4.0.0
scoring_models:
- dimensions:
  - id: coe:artifact/pedagogical/accessibility_rubric/dimension/wcag_level_compliance
    label: wcag_level_compliance
    description: Compliance with WCAG 2.2 conformance levels (A, AA, AAA) for presentation accessibility
    home_domain: learning
    status: canonical
    score_levels:
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/wcag_level_compliance/level/0
      label: 'Level 0: non_compliant'
      score: 0
      level_label: non_compliant
      criteria: Fails WCAG Level A requirements — fundamental accessibility barriers present
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/wcag_level_compliance/level/1
      label: 'Level 1: partial'
      score: 1
      level_label: partial
      criteria: Meets Level A but fails Level AA — minimum compliance only
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/wcag_level_compliance/level/2
      label: 'Level 2: compliant'
      score: 2
      level_label: compliant
      criteria: Meets Level AA — industry-standard accessibility for professional presentations
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/wcag_level_compliance/level/3
      label: 'Level 3: exemplary'
      score: 3
      level_label: exemplary
      criteria: Meets Level AAA — gold standard inclusive design
  - id: coe:artifact/pedagogical/accessibility_rubric/dimension/color_contrast
    label: color_contrast
    description: Color contrast ratios for text and non-text elements per WCAG 2.2 success criteria
    home_domain: learning
    status: canonical
    score_levels:
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/color_contrast/level/0
      label: 'Level 0: failing'
      score: 0
      level_label: failing
      criteria: Contrast ratios below 3:1 for large text or 4.5:1 for normal text
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/color_contrast/level/1
      label: 'Level 1: borderline'
      score: 1
      level_label: borderline
      criteria: Meets minimum ratios but inconsistently across slide elements
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/color_contrast/level/2
      label: 'Level 2: passing'
      score: 2
      level_label: passing
      criteria: All text and non-text elements meet WCAG AA contrast requirements
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/color_contrast/level/3
      label: 'Level 3: optimal'
      score: 3
      level_label: optimal
      criteria: Exceeds AA requirements; contrast supports low-vision and colour-blind users
  - id: coe:artifact/pedagogical/accessibility_rubric/dimension/violation_severity
    label: violation_severity
    description: Severity classification of detected accessibility violations
    home_domain: learning
    status: canonical
    score_levels:
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/violation_severity/level/0
      label: 'Level 0: critical'
      score: 0
      level_label: critical
      criteria: Critical violations that block access for users with disabilities
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/violation_severity/level/1
      label: 'Level 1: serious'
      score: 1
      level_label: serious
      criteria: Serious violations that significantly impair usability
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/violation_severity/level/2
      label: 'Level 2: moderate'
      score: 2
      level_label: moderate
      criteria: Moderate violations that create friction but do not block access
    - id: coe:artifact/pedagogical/accessibility_rubric/dimension/violation_severity/level/3
      label: 'Level 3: minor_or_none'
      score: 3
      level_label: minor_or_none
      criteria: Minor or no violations — best practice adherence throughout
