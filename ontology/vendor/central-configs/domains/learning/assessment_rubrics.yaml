    description: Application of gestalt principles and grid-based layout for perceptual organisation
    home_domain: learning
    status: canonical
    score_levels:
    - id: coe:artifact/pedagogical/visual_design_rubric/dimension/gestalt_and_layout/level/0
      label: 'Level 0: disorganised'
      score: 0
      level_label: disorganised
      criteria: No gestalt grouping; arbitrary element placement
    - id: coe:artifact/pedagogical/visual_design_rubric/dimension/gestalt_and_layout/level/1
      label: 'Level 1: partial'
      score: 1
      level_label: partial
      criteria: Some proximity and alignment applied inconsistently
    - id: coe:artifact/pedagogical/visual_design_rubric/dimension/gestalt_and_layout/level/2
      label: 'Level 2: organised'
      score: 2
      level_label: organised
      criteria: Consistent gestalt grouping with grid alignment
    - id: coe:artifact/pedagogical/visual_design_rubric/dimension/gestalt_and_layout/level/3
      label: 'Level 3: exemplary'
      score: 3
      level_label: exemplary
      criteria: Expert gestalt application with figure-ground and continuity perfectly balanced. 12-column grid applied to
        16:9 aspect ratio — all elements snap to grid lines. Supports 2-column (50/50), 3-column (33/33/33), 4-column (25/25/25/25),
        and asymmetric (1/3 vs 2/3) layouts. This invisible structure creates visual harmony, reducing subconscious anxiety
        caused by misalignment.
  - id: coe:artifact/pedagogical/visual_design_rubric/dimension/typography_quality
    label: typography_quality
    description: 'Font selection, hierarchy, line length, and readability adherence. Text readability scoring factors: font
      count (max 3), text colour (black on white preferred), text placement (never on patterned backgrounds), justification
      (left-justified body), case (no all-caps body), animation (no animated text), column width, block size, and spatial
      contiguity (Clark LxD).'
    home_domain: learning
    status: canonical
    score_levels:
    - id: coe:artifact/pedagogical/visual_design_rubric/dimension/typography_quality/level/0
      label: 'Level 0: poor'
      score: 0
      level_label: poor
      criteria: Typography violates readability standards; multiple font families (4+); no hierarchy; text on patterned backgrounds;
        all-caps body text; animated text present
    - id: coe:artifact/pedagogical/visual_design_rubric/dimension/typography_quality/level/1
      label: 'Level 1: basic'
      score: 1
      level_label: basic
      criteria: Single font family used; hierarchy partially defined; some text readability issues (centre-justified body,
        low-contrast text colour)
    - id: coe:artifact/pedagogical/visual_design_rubric/dimension/typography_quality/level/2
      label: 'Level 2: good'
      score: 2
      level_label: good
      criteria: Clear typographic hierarchy meeting size and weight standards; left-justified body text; max 3 fonts; black
        on white or high-contrast text
    - id: coe:artifact/pedagogical/visual_design_rubric/dimension/typography_quality/level/3
      label: 'Level 3: exemplary'
      score: 3
      level_label: exemplary
      criteria: Optimal typography with correct line length, leading, and heading hierarchy; all text readability criteria
        met; no animated text; spatial contiguity between labels and referents
