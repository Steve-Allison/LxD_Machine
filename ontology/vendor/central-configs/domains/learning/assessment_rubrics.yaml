  id: coe:artifact/pedagogical/cognitive_load_rubric
  label: Cognitive Load Rubric
  description: Cognitive load assessment rubric based on CLT (Sweller), Mayer's 15 Principles, reading physiology, typographic
    standards, and document design for corporate presentations and learning materials.
  home_domain: learning
  status: canonical
- dimensions:
  - id: coe:artifact/pedagogical/instructional_design_rubric/dimension/objective_alignment
    label: Objective Alignment
    description: Evaluates whether learning objectives are observable, measurable, and set at the correct Bloom's taxonomy
      level for the intended job performance. Applies Mager's ABCD framework (Audience, Behavior, Conditions, Degree) and
      distinguishes terminal from enabling objectives.
    home_domain: learning
    status: canonical
  - id: coe:artifact/pedagogical/instructional_design_rubric/dimension/activity_mapping
    label: Activity-Objective Mapping (Constructive Alignment)
    description: Evaluates whether activities engage the cognitive process demanded by the objective's Bloom's verb. A 'remember'
      objective maps to recall activities; an 'evaluate' objective demands critique and judgment tasks. Activities that fall
      below the objective's Bloom's level constitute the primary constructive misalignment failure.
    home_domain: learning
    status: canonical
  - id: coe:artifact/pedagogical/instructional_design_rubric/dimension/assessment_validity
    label: Assessment Validity
    description: Evaluates whether the assessment instruments can validly measure what the objective demands, whether formative
      and summative checkpoints are balanced, and whether the design creates a pathway to Kirkpatrick Level 3 (behaviour transfer)
      rather than stopping at Level 2 (learning).
    home_domain: learning
    status: canonical
  - id: coe:artifact/pedagogical/instructional_design_rubric/dimension/scaffold_progression
    label: Scaffold Progression
    description: Evaluates whether the instructional sequence builds competence incrementally from simple to complex whole
      tasks (Merrill's Pebble-in-the-Pond), explicitly manages prerequisite knowledge, and applies the FPI cycle. Integration
      (Principle 5) is the most commonly omitted principle in corporate L&D and is weighted heavily.
    home_domain: learning
    status: canonical
  - id: coe:artifact/pedagogical/instructional_design_rubric/dimension/learner_engagement
    label: Learner Engagement
    description: 'Evaluates the ratio of active to passive learning, the variety of interaction types, the presence of retrieval
      practice mechanisms, and the application of Self-Determination Theory (autonomy, competence, relatedness) as motivational
      scaffolding. Interaction frequency benchmark: every 3-5 minutes of content.'
    home_domain: learning
    status: canonical
  thresholds:
  - id: coe:artifact/pedagogical/instructional_design_rubric/threshold/min_active_learning_ratio
    label: Min Active Learning Ratio
    description: min_active_learning_ratio threshold.
    home_domain: learning
