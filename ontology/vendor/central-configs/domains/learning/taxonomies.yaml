  id: coe:artifact/learning/learning_objectives_taxonomy
  label: Learning Objectives Taxonomy
  description: Bloom's Revised Taxonomy 6-level classification hierarchy for learning objectives — with action verbs, measurability
    signals, aligned activity types, and assessment approaches
  home_domain: learning
  status: canonical
  concepts:
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    id: coe:concept/learning_objectives_taxonomy/bloom_level
    label: bloom_level
    description: Bloom's Revised Taxonomy cognitive level from Remember (1) to Create (6)
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/bloom_level
    id: coe:concept/learning_objectives_taxonomy/bloom_level/remember
    label: Remember
    description: 'Level 1 — retrieve, recognise, or recall relevant knowledge from long-term memory; strong verbs include define, list, and identify'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/bloom_level
    id: coe:concept/learning_objectives_taxonomy/bloom_level/understand
    label: Understand
    description: 'Level 2 — construct meaning by interpreting, classifying, comparing, or explaining in one''s own words; strong verbs include explain, summarise, and compare'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/bloom_level
    id: coe:concept/learning_objectives_taxonomy/bloom_level/apply
    label: Apply
    description: 'Level 3 — carry out or use a procedure in a given situation; strong verbs include demonstrate, implement, and solve'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/bloom_level
    id: coe:concept/learning_objectives_taxonomy/bloom_level/analyze
    label: Analyze
    description: 'Level 4 — break material into constituent parts and determine how they relate to structure and purpose; strong verbs include differentiate, diagnose, and deconstruct'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/bloom_level
    id: coe:concept/learning_objectives_taxonomy/bloom_level/evaluate
    label: Evaluate
    description: 'Level 5 — make judgements based on criteria and standards; strong verbs include critique, justify, and recommend'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/bloom_level
    id: coe:concept/learning_objectives_taxonomy/bloom_level/create
    label: Create
    description: 'Level 6 — put elements together to form a new, coherent, or functional whole; strong verbs include design, build, and formulate'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    id: coe:concept/learning_objectives_taxonomy/cognitive_category
    label: cognitive_category
    description: Higher-order vs lower-order thinking classification
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/cognitive_category
    id: coe:concept/learning_objectives_taxonomy/cognitive_category/lower_order_thinking
    label: Lower Order Thinking
    description: 'Remember, Understand, and Apply — foundation knowledge and skill, necessary but not sufficient for transfer'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/cognitive_category
    id: coe:concept/learning_objectives_taxonomy/cognitive_category/higher_order_thinking
    label: Higher Order Thinking
    description: 'Analyze, Evaluate, and Create — transfer, judgment, and creation, indicating deep learning'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    id: coe:concept/learning_objectives_taxonomy/objective_quality
    label: objective_quality
    description: ABCD formula compliance and measurability quality rating
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/objective_quality
    id: coe:concept/learning_objectives_taxonomy/objective_quality/strong
    label: Strong
    description: 'Objective satisfies the full ABCD formula — a measurable Bloom-aligned verb with explicit condition and degree of success'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/objective_quality
    id: coe:concept/learning_objectives_taxonomy/objective_quality/acceptable
    label: Acceptable
    description: 'Objective uses a measurable verb but leaves condition or degree implicit — usable, though short of best practice'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/learning_objectives_taxonomy
    broader:
    - coe:concept/learning_objectives_taxonomy/objective_quality
    id: coe:concept/learning_objectives_taxonomy/objective_quality/weak_or_invalid
    label: Weak Or Invalid
    description: 'Objective rests on an unmeasurable verb such as understand, know, or appreciate, or lacks an observable behaviour, so it cannot be assessed as written'
    home_domain: learning
    status: canonical
  top_concepts:
  - coe:concept/learning_objectives_taxonomy/bloom_level
  - coe:concept/learning_objectives_taxonomy/cognitive_category
  - coe:concept/learning_objectives_taxonomy/objective_quality
