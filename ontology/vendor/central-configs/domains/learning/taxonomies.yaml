  id: coe:artifact/learning/cognitive_load_taxonomy
  label: Cognitive Load Taxonomy
  description: Classification of cognitive load constructs by load type, Mayer principle category, design strategy, expertise
    sensitivity, and content modality.
  home_domain: learning
  status: canonical
  concepts:
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    id: coe:concept/cognitive_load_taxonomy/load_type
    label: Load Type
    description: The category of cognitive load according to Cognitive Load Theory
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/load_type
    id: coe:concept/cognitive_load_taxonomy/load_type/extraneous
    label: Extraneous
    description: 'Unnecessary cognitive effort imposed by poor instructional design — split attention, redundancy, chartjunk, or unclear hierarchy — which can and should be minimised'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/load_type
    id: coe:concept/cognitive_load_taxonomy/load_type/intrinsic
    label: Intrinsic
    description: 'Inherent difficulty of the material itself, determined by element interactivity and prerequisite knowledge — cannot be eliminated, only managed'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/load_type
    id: coe:concept/cognitive_load_taxonomy/load_type/germane
    label: Germane
    description: 'Productive effort spent on schema construction and deep processing — to be maximised once extraneous load is reduced'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    id: coe:concept/cognitive_load_taxonomy/mayer_category
    label: Mayer Principle Category
    description: The functional category of Mayer's multimedia learning principle
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/mayer_category
    id: coe:concept/cognitive_load_taxonomy/mayer_category/reduce_extraneous
    label: Reduce Extraneous
    description: 'Mayer principles that eliminate unnecessary cognitive processing — coherence, signalling, redundancy, and spatial and temporal contiguity'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/mayer_category
    id: coe:concept/cognitive_load_taxonomy/mayer_category/manage_essential
    label: Manage Essential
    description: 'Mayer principles that help learners manage inherent content complexity — segmenting, pre-training, and modality'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/mayer_category
    id: coe:concept/cognitive_load_taxonomy/mayer_category/foster_generative
    label: Foster Generative
    description: 'Mayer principles that encourage deep engagement and meaning-making — multimedia, personalisation, voice, and generative activity'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    id: coe:concept/cognitive_load_taxonomy/design_strategy
    label: Design Strategy
    description: The instructional design strategy for managing cognitive load
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/design_strategy
    id: coe:concept/cognitive_load_taxonomy/design_strategy/progressive_disclosure
    label: Progressive Disclosure
    description: 'Present only what is needed at each moment and reveal complexity gradually, via builds, layered diagrams, and drill-down — targets extraneous load'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/design_strategy
    id: coe:concept/cognitive_load_taxonomy/design_strategy/worked_examples
    label: Worked Examples
    description: 'Provide step-by-step solutions for learners to study before attempting problems, fading steps as competence grows — targets germane load'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/design_strategy
    id: coe:concept/cognitive_load_taxonomy/design_strategy/retrieval_practice
    label: Retrieval Practice
    description: 'Strengthen learning through active recall using low-stakes quizzing, spaced repetition, and interleaving — targets germane load'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/design_strategy
    id: coe:concept/cognitive_load_taxonomy/design_strategy/adaptive_scaffolding
    label: Adaptive Scaffolding
    description: 'Adjust instructional support to the learner''s expertise level, fading support as competence grows — targets intrinsic load'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    id: coe:concept/cognitive_load_taxonomy/expertise_sensitivity
    label: Expertise Sensitivity
    description: How the strategy's effectiveness varies with learner expertise
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/expertise_sensitivity
    id: coe:concept/cognitive_load_taxonomy/expertise_sensitivity/novice_beneficial
    label: Novice Beneficial
    description: 'Strategies that significantly help low-prior-knowledge learners — apply liberally for novice audiences'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/expertise_sensitivity
    id: coe:concept/cognitive_load_taxonomy/expertise_sensitivity/expertise_reversal
    label: Expertise Reversal
    description: 'Strategies that help novices but hinder expert learners — reduce or eliminate for expert audiences'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/expertise_sensitivity
    id: coe:concept/cognitive_load_taxonomy/expertise_sensitivity/universally_beneficial
    label: Universally Beneficial
    description: 'Strategies that help all learners regardless of expertise — always apply'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    id: coe:concept/cognitive_load_taxonomy/content_modality
    label: Content Modality
    description: The type of content the cognitive load construct applies to
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/content_modality
    id: coe:concept/cognitive_load_taxonomy/content_modality/slide_presentation
    label: Slide Presentation
    description: 'Slide-based content whose primary load risks are text overload, split attention, and redundancy; its word, bullet and data-series caps are library knowledge'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/content_modality
    id: coe:concept/cognitive_load_taxonomy/content_modality/video_content
    label: Video Content
    description: 'Video or animation content risking temporal misalignment and information dump; its segment length and on-screen text caps are library knowledge'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/content_modality
    id: coe:concept/cognitive_load_taxonomy/content_modality/written_document
    label: Written Document
    description: 'Written or eLearning document content risking walls of text and undefined jargon; its paragraph and section caps are library knowledge'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/cognitive_load_taxonomy
    broader:
    - coe:concept/cognitive_load_taxonomy/content_modality
    id: coe:concept/cognitive_load_taxonomy/content_modality/interactive_module
    label: Interactive Module
    description: 'Interactive eLearning content risking navigation confusion and interactivity overload; its interactions-per-screen cap is library knowledge'
    home_domain: learning
    status: canonical
  top_concepts:
  - coe:concept/cognitive_load_taxonomy/load_type
  - coe:concept/cognitive_load_taxonomy/mayer_category
  - coe:concept/cognitive_load_taxonomy/design_strategy
  - coe:concept/cognitive_load_taxonomy/expertise_sensitivity
  - coe:concept/cognitive_load_taxonomy/content_modality
