  id: coe:artifact/learning/pedagogical_frameworks_taxonomy
  label: Pedagogical Frameworks Taxonomy
  description: Classification of 16 research-validated instructional design frameworks by learning paradigm — behaviourist,
    cognitivist, constructivist, humanist, and experiential — with selection guidance and use case routing
  home_domain: learning
  status: canonical
  concepts:
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    id: coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm
    label: learning_paradigm
    description: Foundational theoretical orientation of the pedagogical framework
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm
    id: coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm/behaviourist
    label: Behaviourist
    description: 'Learning is a change in observable behaviour produced by stimulus-response relationships and reinforcement (Skinner, Pavlov, Watson)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm
    id: coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm/cognitivist
    label: Cognitivist
    description: 'Learning is internal information processing — attention, encoding, schema formation, and retrieval (Piaget, Ausubel, Bruner)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm
    id: coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm/constructivist
    label: Constructivist
    description: 'Learners actively construct knowledge through experience, reflection, and interaction with their environment (Piaget, Dewey, Vygotsky)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm
    id: coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm/social_learning
    label: Social Learning
    description: 'Learning occurs through observation of others, social interaction, and participation in communities of practice (Vygotsky, Bandura, Lave and Wenger)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm
    id: coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm/humanist_andragogical
    label: Humanist Andragogical
    description: 'Adult learners are self-directed, experience-rich, and motivated by relevance to their personal and professional goals (Knowles, Maslow, Rogers)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm
    id: coe:concept/pedagogical_frameworks_taxonomy/learning_paradigm/experiential
    label: Experiential
    description: 'Learning is a cyclical process of concrete experience, reflective observation, conceptual abstraction, and active experimentation (Dewey, Kolb, Schön)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    id: coe:concept/pedagogical_frameworks_taxonomy/bloom_level_alignment
    label: bloom_level_alignment
    description: Bloom's taxonomy level the framework is best suited to develop
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/bloom_level_alignment
    id: coe:concept/pedagogical_frameworks_taxonomy/bloom_level_alignment/remember
    label: Remember
    description: 'Framework is best suited to developing retrieval and recognition of facts and terminology, as in spaced repetition'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/bloom_level_alignment
    id: coe:concept/pedagogical_frameworks_taxonomy/bloom_level_alignment/understand
    label: Understand
    description: 'Framework is best suited to developing interpretation and explanation of concepts in the learner''s own words'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/bloom_level_alignment
    id: coe:concept/pedagogical_frameworks_taxonomy/bloom_level_alignment/apply
    label: Apply
    description: 'Framework is best suited to developing execution of procedures and skills in context, as in mastery learning or social modelling'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/pedagogical_frameworks_taxonomy
    broader:
    - coe:concept/pedagogical_frameworks_taxonomy/bloom_level_alignment
