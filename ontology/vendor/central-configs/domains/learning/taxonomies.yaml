- last_updated: '2026-09-01'
  id: coe:artifact/learning/activity_types_taxonomy
  label: Activity Types Taxonomy
  description: Classification of 34 synchronous and asynchronous learning activity types by delivery mode, cognitive level,
    group format, and primary learning outcome
  home_domain: learning
  status: canonical
  concepts:
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    id: coe:concept/activity_types_taxonomy/bloom_level
    label: Bloom Level
    description: 'The Bloom''s Revised Taxonomy (Anderson & Krathwohl 2001) cognitive level an activity targets, from Remember through Create; an activity may span several adjacent levels'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/bloom_level
    id: coe:concept/activity_types_taxonomy/bloom_level/remember
    label: Remember
    description: Recall of facts and concepts
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/bloom_level
    id: coe:concept/activity_types_taxonomy/bloom_level/understand
    label: Understand
    description: Interpretation and explanation
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/bloom_level
    id: coe:concept/activity_types_taxonomy/bloom_level/apply
    label: Apply
    description: Use of knowledge in new situations
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/bloom_level
    id: coe:concept/activity_types_taxonomy/bloom_level/analyze
    label: Analyze
    description: Breaking down and examining components
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/bloom_level
    id: coe:concept/activity_types_taxonomy/bloom_level/evaluate
    label: Evaluate
    description: Judging based on criteria
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/bloom_level
    id: coe:concept/activity_types_taxonomy/bloom_level/create
    label: Create
    description: Producing new or original work
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    id: coe:concept/activity_types_taxonomy/cognitive_complexity
    label: Cognitive Complexity
    description: 'The depth of mental processing an activity demands of the learner, banded from low (single-answer recall) through medium (interpretation, comparison, application) to high (multi-step reasoning, judgment, or creation)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/cognitive_complexity
    id: coe:concept/activity_types_taxonomy/cognitive_complexity/low
    label: Low
    description: Single-answer recall; minimal processing
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/cognitive_complexity
    id: coe:concept/activity_types_taxonomy/cognitive_complexity/medium
    label: Medium
    description: Requires interpretation, comparison, or application
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/cognitive_complexity
    id: coe:concept/activity_types_taxonomy/cognitive_complexity/high
    label: High
    description: Multi-step reasoning, judgment, or creation
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    id: coe:concept/activity_types_taxonomy/group_format
    label: Group Format
    description: The grouping arrangement an activity is designed for. Members enumerate the permissible arrangements, including
      the explicit no-constraint value Any.
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/group_format
    id: coe:concept/activity_types_taxonomy/group_format/individual
    label: Individual
    description: Learner works alone
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/group_format
    id: coe:concept/activity_types_taxonomy/group_format/pairs
    label: Pairs
    description: Two learners
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/group_format
    id: coe:concept/activity_types_taxonomy/group_format/small_group
    label: Small Group
    description: 3-6 learners
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/group_format
    id: coe:concept/activity_types_taxonomy/group_format/whole_group
    label: Whole Group
    description: Entire cohort
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/group_format
    id: coe:concept/activity_types_taxonomy/group_format/teams
    label: Teams
    description: Competing or collaborating teams
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/group_format
    id: coe:concept/activity_types_taxonomy/group_format/any
    label: Any
    description: No-constraint value asserting the activity works in any grouping arrangement; used where format genuinely
      does not affect the design
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    id: coe:concept/activity_types_taxonomy/outcome_type
    label: Outcome Type
    description: 'The primary learner capability an activity is designed to produce, expressed as an observable can-do result such as recall, procedural performance, or argumentation'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/outcome_type
    id: coe:concept/activity_types_taxonomy/outcome_type/recall
    label: Recall
    description: Can reproduce facts or steps
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/outcome_type
    id: coe:concept/activity_types_taxonomy/outcome_type/conceptual
    label: Conceptual
    description: Can explain and discuss ideas
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/outcome_type
    id: coe:concept/activity_types_taxonomy/outcome_type/procedural
    label: Procedural
    description: Can perform a process correctly
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/outcome_type
    id: coe:concept/activity_types_taxonomy/outcome_type/applied
    label: Applied
    description: Can use knowledge in context
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/outcome_type
    id: coe:concept/activity_types_taxonomy/outcome_type/generative
    label: Generative
    description: Can produce something new
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/outcome_type
    id: coe:concept/activity_types_taxonomy/outcome_type/argumentation
    label: Argumentation
    description: Can construct and defend a position
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/outcome_type
    id: coe:concept/activity_types_taxonomy/outcome_type/metacognitive
    label: Metacognitive
    description: Can assess and regulate own learning
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/activity_types_taxonomy
    broader:
    - coe:concept/activity_types_taxonomy/outcome_type
    id: coe:concept/activity_types_taxonomy/outcome_type/clarification
    label: Clarification
    description: Can resolve uncertainty through dialogue
    home_domain: learning
    status: canonical
  top_concepts:
  - coe:concept/activity_types_taxonomy/bloom_level
  - coe:concept/activity_types_taxonomy/cognitive_complexity
  - coe:concept/activity_types_taxonomy/group_format
  - coe:concept/activity_types_taxonomy/outcome_type
- last_updated: '2026-09-23'
  id: coe:artifact/learning/assessment_taxonomy
  label: Assessment Taxonomy
  description: Classification of learning assessment types by evaluation purpose, Kirkpatrick level, LTEM tier, item format,
    cognitive demand, and feedback mechanism
  home_domain: learning
  status: canonical
  concepts:
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    id: coe:concept/assessment_taxonomy/evaluation_purpose
    label: Evaluation Purpose
    description: When and why the assessment is administered
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/evaluation_purpose
    id: coe:concept/assessment_taxonomy/evaluation_purpose/diagnostic
    label: Diagnostic
    description: 'Pre-learning assessment administered before instruction to establish baseline knowledge and identify gaps'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/evaluation_purpose
    id: coe:concept/assessment_taxonomy/evaluation_purpose/formative
    label: Formative
    description: 'During-learning assessment that monitors progress and adjusts instruction while learning is underway (Kirkpatrick Level 2)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/evaluation_purpose
    id: coe:concept/assessment_taxonomy/evaluation_purpose/summative
    label: Summative
    description: 'End-of-learning assessment evaluating overall achievement against objectives after instruction (Kirkpatrick Level 2)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/evaluation_purpose
    id: coe:concept/assessment_taxonomy/evaluation_purpose/transfer
    label: Transfer
    description: 'Post-learning assessment measuring on-the-job application of skills (Kirkpatrick Level 3)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/evaluation_purpose
    id: coe:concept/assessment_taxonomy/evaluation_purpose/impact
    label: Impact
    description: 'Organisational-level assessment measuring business outcomes and ROI (Kirkpatrick Level 4)'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    id: coe:concept/assessment_taxonomy/kirkpatrick_level
    label: Kirkpatrick Level
    description: The level of Kirkpatrick's four-level training evaluation model — reaction, learning, behaviour or results
      — at which an assessment or evaluation operates. The four levels are ordered, each evidencing an outcome of training
      that arrives later and matters more to the organisation than the one before; this is the stakeholder-facing reporting
      language, which the LTEM tiers refine for design and audit.
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:contains
      object_id: coe:entity/formative_assessment
      relationship_weight: optional
      description: Kirkpatrick levels encompass both formative and summative evaluation approaches
      statement_id: coe:edge/a98b9183124b1d273833fc28
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:contains
      object_id: coe:entity/practice_activity
      relationship_weight: optional
      description: Kirkpatrick Level 3 behaviour assessment relies on on-the-job practice observation via manager checklists
        and follow-up interviews
      statement_id: coe:edge/26182b8717e07461ecff3485
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:bridges
      object_id: coe:entity/performance_tier
      relationship_weight: expected
      description: Performance tier evaluation aligns with Kirkpatrick Level 2 (learning/skill) and Level 3 (behaviour transfer)
        assessment of speaker competency development
      statement_id: coe:edge/0328be4ba2c39f4d69704283
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/alignment_marker
      relationship_weight: expected
      description: Kirkpatrick evaluation levels support alignment — the research recommends noting level 1-4 evaluations
        and on-the-job metrics in the blueprint to reinforce the focus on business outcomes and verify training effectiveness
        per High-Level Planning Tools research | Backward design integrates Kirkpatrick L1-L4 evaluation at the design stage,
        with evaluation levels directly supporting alignment verification between learning objectives and business outcomes
        per universal_learning_design_framework
      statement_id: coe:edge/a57e61da3d7f5015a1138c16
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/apply_verb
      relationship_weight: expected
      description: Apply-level learning objectives are assessed through Kirkpatrick Level 3 (behavior/transfer) — Intent to
        Use construct directly targets application of learned knowledge per recommended-training-effectiveness-questions
      statement_id: coe:edge/4bd57b2bdcd251ebe15ead8e
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/call_to_action
      relationship_weight: expected
      description: Kirkpatrick Level 3 (Behavior) measures whether the audience executed the call to action's 'Do' objective
        after the presentation (Canonical Presentation Methodology)
      statement_id: coe:edge/b54d9977fbdf32a73b4788cc
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/engagement_cue
      relationship_weight: expected
      description: Engagement cue effectiveness is evaluated through Kirkpatrick Level 1 (reaction/sentiment) and Level 2
        (learning/retention) measuring whether cues produced knowledge transfer
      statement_id: coe:edge/f034e9954dc38a6e11b6f4bc
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/learning_objective
      relationship_weight: required
      description: Kirkpatrick Levels 1-3 validate whether learning objectives were achieved — Level 2 measures knowledge
        gain, Level 1 measures relevance, Level 3 measures transfer intent per recommended-training-effectiveness-questions
      statement_id: coe:edge/59cb1d4dcdbc6a4274cd00f1
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/microlearning_format
      relationship_weight: expected
      description: Pre/post assessments following Kirkpatrick's model evaluate reaction, learning, behaviour, and results
        at 30/60/90-day intervals for microlearning effectiveness per AI Microlearning Guide
      statement_id: coe:edge/713580ed3c6b254325f326ec
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/motivation_element
      relationship_weight: expected
      description: Intent to Use and Barriers to Use constructs directly measure learner motivation and transfer intent at
        Kirkpatrick Level 3 per recommended-training-effectiveness-questions
      statement_id: coe:edge/54819a31930b5207b147f089
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/outcome_statement
      relationship_weight: expected
      description: Kirkpatrick Level 4 (Results) validates outcome statements by measuring business impact — ROI, revenue
        increase, risk reduction — as the strategic 'Why' (Canonical Presentation Methodology)
      statement_id: coe:edge/b50c02bd7efa58a03c549b12
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/roleplay_activity
      relationship_weight: expected
      description: Kirkpatrick levels evaluate roleplay effectiveness — L2 measures skill acquisition, L3 measures on-the-job
        behaviour transfer from roleplay practice per roleplay research
      statement_id: coe:edge/d7e1a9db66949d4e325c17b2
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/rubric_component
      relationship_weight: expected
      description: Evaluation constructs (Learning, Relevance, Characteristics of Training, Intent to Use, Barriers) function
        as rubric components structuring Kirkpatrick-level postcourse evaluation per recommended-training-effectiveness-questions
      statement_id: coe:edge/0758aff15871d20708dfd6ae
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/scenario_activity
      relationship_weight: required
      description: Kirkpatrick four-level framework (Reaction, Learning, Behavior, Results) is explicitly prescribed for evaluating
        scenario-based training effectiveness per SBT guide
      statement_id: coe:edge/6e8225830ff04107f63d250f
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level
      predicate: coe:supports
      object_id: coe:entity/summative_assessment
      relationship_weight: required
      description: Summative assessment maps to Kirkpatrick Level 2 for knowledge tests, Level 3 for behavioural observation,
        Level 4 for business metrics | Kirkpatrick Levels 2-4 map directly to summative assessment types — L2 knowledge tests,
        L3 behavioural observation, L4 business metrics
      statement_id: coe:edge/d9cff987053c411372eaf293
      home_domain: learning
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/kirkpatrick_level
    id: coe:concept/assessment_taxonomy/kirkpatrick_level/reaction
    label: Reaction
    description: 'Kirkpatrick Level 1 — measures learner satisfaction, engagement, and perceived relevance'
    home_domain: learning
    status: canonical
    terms:
    - literal: L1 Reaction
      term_type: full_form
      term_status: admitted
    edges:
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level/reaction
      predicate: coe:precedes
      object_id: coe:concept/assessment_taxonomy/kirkpatrick_level/learning
      relationship_weight: required
      description: Level 1 precedes Level 2 in Kirkpatrick's ordering of training evaluation.
      statement_id: coe:edge/kirkpatrick-reaction-precedes-learning
      home_domain: learning
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/kirkpatrick_level
    id: coe:concept/assessment_taxonomy/kirkpatrick_level/learning
    label: Learning
    description: 'Kirkpatrick Level 2 — measures knowledge acquisition, skill development, and attitude change'
    home_domain: learning
    status: canonical
    terms:
    - literal: L2 Learning
      term_type: full_form
      term_status: admitted
    edges:
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level/learning
      predicate: coe:precedes
      object_id: coe:concept/assessment_taxonomy/kirkpatrick_level/behaviour
      relationship_weight: required
      description: Level 2 precedes Level 3 in Kirkpatrick's ordering of training evaluation.
      statement_id: coe:edge/kirkpatrick-learning-precedes-behaviour
      home_domain: learning
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/kirkpatrick_level
    id: coe:concept/assessment_taxonomy/kirkpatrick_level/behaviour
    label: Behaviour
    description: 'Kirkpatrick Level 3 — measures on-the-job application and behavioural change'
    home_domain: learning
    status: canonical
    terms:
    - literal: L3 Behaviour
      term_type: full_form
      term_status: admitted
    edges:
    - subject_id: coe:concept/assessment_taxonomy/kirkpatrick_level/behaviour
      predicate: coe:precedes
      object_id: coe:concept/assessment_taxonomy/kirkpatrick_level/results
      relationship_weight: required
      description: Level 3 precedes Level 4 in Kirkpatrick's ordering of training evaluation.
      statement_id: coe:edge/kirkpatrick-behaviour-precedes-results
      home_domain: learning
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/kirkpatrick_level
    id: coe:concept/assessment_taxonomy/kirkpatrick_level/results
    label: Results
    description: 'Kirkpatrick Level 4 — measures organisational impact, productivity gains, and business ROI'
    home_domain: learning
    status: canonical
    terms:
    - literal: L4 Results
      term_type: full_form
      term_status: admitted
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    id: coe:concept/assessment_taxonomy/ltem_tier
    label: LTEM Tier
    description: The tier of Thalheimer's Learning-Transfer Evaluation Model at which an assessment gathers evidence, from
      attendance through the effects of transfer. The eight tiers are ordered by the strength of the evidence each gives
      that learning happened and was used; tiers three to eight refine Kirkpatrick's four levels for designing and auditing
      evaluation, and tiers one and two are not evidence of learning at all.
    home_domain: learning
    status: canonical
    terms:
    - literal: Learning-Transfer Evaluation Model tier
      term_type: full_form
      term_status: admitted
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/ltem_tier
    id: coe:concept/assessment_taxonomy/ltem_tier/attendance
    label: Attendance
    description: 'LTEM Tier 1 — learners enrol in, start, attend or complete a learning experience; evidence of participation
      only, never of learning.'
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:concept/assessment_taxonomy/ltem_tier/attendance
      predicate: coe:precedes
      object_id: coe:concept/assessment_taxonomy/ltem_tier/activity
      relationship_weight: required
      description: Tier 1 precedes Tier 2 in the LTEM ordering of evidence strength.
      statement_id: coe:edge/ltem-attendance-precedes-activity
      home_domain: learning
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/ltem_tier
    id: coe:concept/assessment_taxonomy/ltem_tier/activity
    label: Activity
    description: 'LTEM Tier 2 — learners engage in the learning activities, showing attention, interest or participation;
      evidence of engagement only, never of learning.'
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:concept/assessment_taxonomy/ltem_tier/activity
      predicate: coe:precedes
      object_id: coe:concept/assessment_taxonomy/ltem_tier/learner_perceptions
      relationship_weight: required
      description: Tier 2 precedes Tier 3 in the LTEM ordering of evidence strength.
      statement_id: coe:edge/ltem-activity-precedes-learner-perceptions
      home_domain: learning
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/ltem_tier
    id: coe:concept/assessment_taxonomy/ltem_tier/learner_perceptions
    label: Learner Perceptions
    description: 'LTEM Tier 3 — learners report their perceptions of the learning experience; the weakest evidence that
      bears on learning, and never on its own a claim of success.'
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:concept/assessment_taxonomy/ltem_tier/learner_perceptions
      predicate: coe:specialises
      object_id: coe:concept/assessment_taxonomy/kirkpatrick_level/reaction
      relationship_weight: required
      description: Tier 3 refines Kirkpatrick's reaction level into perception evidence.
      statement_id: coe:edge/ltem-learner-perceptions-specialises-kirkpatrick-reaction
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/ltem_tier/learner_perceptions
      predicate: coe:precedes
      object_id: coe:concept/assessment_taxonomy/ltem_tier/knowledge
      relationship_weight: required
      description: Tier 3 precedes Tier 4 in the LTEM ordering of evidence strength.
      statement_id: coe:edge/ltem-learner-perceptions-precedes-knowledge
      home_domain: learning
  - in_scheme: coe:artifact/learning/assessment_taxonomy
    broader:
    - coe:concept/assessment_taxonomy/ltem_tier
    id: coe:concept/assessment_taxonomy/ltem_tier/knowledge
    label: Knowledge
    description: 'LTEM Tier 4 — learners answer questions about facts and terminology; recitation soon after learning is
      distinguished from retention measured after a delay.'
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:concept/assessment_taxonomy/ltem_tier/knowledge
      predicate: coe:specialises
      object_id: coe:concept/assessment_taxonomy/kirkpatrick_level/learning
      relationship_weight: required
      description: Tier 4 refines Kirkpatrick's learning level into knowledge evidence.
      statement_id: coe:edge/ltem-knowledge-specialises-kirkpatrick-learning
      home_domain: learning
    - subject_id: coe:concept/assessment_taxonomy/ltem_tier/knowledge
      predicate: coe:precedes
      object_id: coe:concept/assessment_taxonomy/ltem_tier/decision_making_competence
      relationship_weight: required
