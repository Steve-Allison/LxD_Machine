  id: coe:artifact/learning/gagne_events_taxonomy
  label: Gagné's Nine Events of Instruction
  description: 'Gagné''s nine events of instruction, in the order a lesson presents them, from gaining attention to enhancing retention and transfer; each is one instructional event the Instructional Event entity classifies.'
  home_domain: learning
  status: canonical
  concepts:
  - in_scheme: coe:artifact/learning/gagne_events_taxonomy
    id: coe:concept/gagne_events_taxonomy/gain_attention
    label: Gain Attention
    description: 'Gagné''s first event of instruction: capturing the learner''s attention and interest so they are ready to receive the lesson.'
    home_domain: learning
    status: canonical
    edges:
    - subject_id: coe:concept/gagne_events_taxonomy/gain_attention
      predicate: coe:precedes
      object_id: coe:concept/gagne_events_taxonomy/inform_objectives
      relationship_weight: required
      description: 'Gain Attention precedes Inform Learners of Objectives in the Gagné''s Nine Events of Instruction ordering.'
      statement_id: coe:edge/gagne-gain-attention-precedes-gagne-inform-objectives
      home_domain: learning
  - in_scheme: coe:artifact/learning/gagne_events_taxonomy
    id: coe:concept/gagne_events_taxonomy/inform_objectives
    label: Inform Learners of Objectives
    description: 'Gagné''s second event: telling learners what they will be able to do by the end, so they can organise their attention around it.'
    home_domain: learning
    status: canonical
    terms:
    - literal: State Objectives
      term_type: short_form
      term_status: admitted
    edges:
    - subject_id: coe:concept/gagne_events_taxonomy/inform_objectives
      predicate: coe:precedes
