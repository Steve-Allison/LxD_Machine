  id: coe:artifact/learning/arcs_taxonomy
  label: ARCS Model of Motivational Design
  description: 'Keller''s ARCS model of motivational design — attention, relevance, confidence and satisfaction — the four components a learning experience must address to motivate; the members are unordered components, not stages.'
  home_domain: learning
  status: canonical
  concepts:
  - in_scheme: coe:artifact/learning/arcs_taxonomy
    id: coe:concept/arcs_taxonomy/attention
    label: Attention
    description: 'The ARCS component of capturing and sustaining the learner''s interest and curiosity.'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/arcs_taxonomy
    id: coe:concept/arcs_taxonomy/relevance
    label: Relevance
    description: 'The ARCS component of connecting the learning to the learner''s goals, needs and experience.'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/arcs_taxonomy
    id: coe:concept/arcs_taxonomy/confidence
    label: Confidence
    description: 'The ARCS component of building the learner''s expectation that they can succeed.'
    home_domain: learning
    status: canonical
  - in_scheme: coe:artifact/learning/arcs_taxonomy
    id: coe:concept/arcs_taxonomy/satisfaction
    label: Satisfaction
    description: 'The ARCS component of making the learner feel the learning was worthwhile and its success earned.'
    home_domain: learning
    status: canonical
  top_concepts:
  - coe:concept/arcs_taxonomy/attention
