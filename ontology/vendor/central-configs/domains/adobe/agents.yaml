_meta:
  file_id: coe:file/domain/adobe/agents
  title: Adobe — Agents
  last_updated: '2026-09-23'
  authority: Central_Configs
  scope: domain
  ontology_domain: adobe
  governing_class: coe:DomainModule
module_id: coe:module/adobe/agents
domain: adobe
agents:
- id: coe:entity/adobe/account_qualification_agent
  label: Account Qualification Agent
  description: Adobe's sales-qualification agent in Journey Optimizer B2B Edition that reads account signals to judge
    which accounts are ready for the next sales step and assists business-development representatives with account
    research, outreach drafting and CRM updates.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/journey_optimizer_b2b_edition
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/audience_agent
  label: Audience Agent
  description: Adobe's audience-management agent in Real-Time CDP and Journey Optimizer that lets practitioners explore,
    understand and manage audiences in natural language — surfacing inventory, detecting size changes and duplicates, and
    retrieving audience sizes.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/real_time_cdp_b2b_edition
  - coe:entity/adobe/journey_optimizer
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/content_production_agent
  label: Content Production Agent
  description: Adobe's on-brand content-generation agent in GenStudio for Performance Marketing that takes teams from brief
    to content to activation — tactics ideation, ad and email generation, brand-object creation and brand validation.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/genstudio_for_performance_marketing
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/data_insights_agent
  label: Data Insights Agent
  description: Adobe's analytics agent in Customer Journey Analytics that answers plain-language questions about the data
    and builds the matching visualisations and tables, grounded in the organisation's configured data views.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/customer_journey_analytics
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/data_engineering_agent
  label: Data Engineering Agent
  description: Adobe's data-management agent for Experience Platform that accelerates onboarding and ongoing management of
    data — schemas, mappings and ingestion — without manual data-engineering effort.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_platform
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/experimentation_agent
  label: Experimentation Agent
  description: Adobe's experimentation agent in Journey Optimizer Experimentation Accelerator that summarises tests,
    analyses results by audience, explains what worked and proposes the next test.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/journey_optimizer_experimentation_accelerator
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/journey_agent
  label: Journey Agent
  description: Adobe's journey-orchestration agent in Journey Optimizer that builds journeys from natural-language prompts,
    analyses fallout, detects scheduling and audience conflicts and proposes adjustments before publication.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/journey_optimizer
  - coe:entity/adobe/journey_optimizer_b2b_edition
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/workflow_optimization_agent
  label: Workflow Optimization Agent
  description: Adobe's marketing-operations agent in Workfront that generates Planning workspaces, manages multi-stage
    content reviews, turns unstructured briefs into Planning records and answers questions across the work ecosystem.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/workfront
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/product_advisor_agent
  label: Product Advisor Agent
  description: Adobe's product-recommendation agent in Brand Concierge that advises end customers in real time, using
    unified profiles, behavioural data and business rules to recommend products, plans or offers.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/brand_concierge
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/site_optimization_agent
  label: Site Optimization Agent
  description: Adobe's website-optimisation agent in Experience Manager Sites Optimizer that analyses site experiences for
    performance, accessibility, SEO and engagement, explains each defect and recommends fixes.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_manager_sites_optimizer
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/brand_experience_agent
  label: Brand Experience Agent
  description: Adobe's experience-design agent in Experience Manager that helps teams design and orchestrate
    brand-consistent customer experiences across channels, proposing campaign ideas, content and journeys.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_manager
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/content_advisor_agent
  label: Content Advisor Agent
  description: Adobe's content-recommendation agent in Experience Manager Assets that finds existing assets fitting a
    brief, campaign or audience from metadata, tags and performance data rather than generating new content.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_manager_assets
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/brand_governance_agent
  label: Brand Governance Agent
  description: Adobe's governance agent in Experience Manager Sites and Assets that checks content, assets and pages
    against brand rules and usage policies and flags violations with remediation guidance.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_manager_sites
  - coe:entity/adobe/experience_manager_assets
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/product_support_agent
  label: Product Support Agent
  description: Adobe's support agent in the AI Assistant panel of the Experience Platform applications that provides
    self-serve troubleshooting grounded in product knowledge and the customer's environment and can raise support tickets.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/experience_platform
  - coe:entity/adobe/real_time_cdp
  - coe:entity/adobe/journey_optimizer
  - coe:entity/adobe/customer_journey_analytics
  - coe:entity/adobe/experience_manager
  orchestrated_by: coe:entity/adobe/agent_orchestrator
- id: coe:entity/adobe/llm_optimization_agent
  label: LLM Optimization Agent
  description: Adobe's generative-AI quality agent in LLM Optimizer that evaluates and improves AI outputs and
    configurations, detecting regressions and suggesting better prompts or guardrails.
  home_domain: adobe
  status: canonical
  available_in:
  - coe:entity/adobe/llm_optimizer
  orchestrated_by: coe:entity/adobe/agent_orchestrator
