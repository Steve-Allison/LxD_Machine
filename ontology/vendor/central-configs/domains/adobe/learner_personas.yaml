_meta:
  file_id: coe:file/domain/adobe/learner_personas
  title: Adobe — Learner Personas and Roles
  last_updated: '2026-09-24'
  authority: Central_Configs
  scope: domain
  ontology_domain: adobe
  governing_class: coe:DomainModule
module_id: coe:module/adobe/learner_personas
domain: adobe
entity_collections:
- id: coe:artifact/adobe/seller_personas
  label: Adobe Seller Learner Personas
  description: 'The six need-by-depth learner personas Adobe''s field enablement designs toward, each aggregating field roles that share a learning need at the same required depth rather than a job title.'
  last_updated: '2026-09-24'
  home_domain: adobe
  status: canonical
  entities:
  - id: coe:entity/adobe/seller_persona/commercial_account_seller
    label: Commercial Account Seller
    description: 'An Adobe seller learner persona that owns the commercial outcome on an account or opportunity – account strategy, executive relationships, deal orchestration, and book-of-business growth. Its core learning needs are: customer discovery and qualification; business value articulation and business-case framing; negotiation and commercial progression; account planning and whitespace strategy; executive storytelling and multi-threading.'
    home_domain: adobe
    status: canonical
    examples:
    - 'Layla Raj, early-career Enterprise AE'
    - 'John Smith, senior Enterprise Account Director'
  - id: coe:entity/adobe/seller_persona/pipeline_generator
    label: Pipeline Generator
    description: 'An Adobe seller learner persona that creates and qualifies early-stage pipeline for aligned sellers. Its core learning needs are: prospecting and account-based outreach; early qualification and lead progression; product foundations and value hooks; messaging and objection basics.'
    home_domain: adobe
    status: canonical
  - id: coe:entity/adobe/seller_persona/solution_specialist
    label: Solution Specialist
    description: 'An Adobe seller learner persona for specialist sellers who bring deep single-solution value, use-case selling and competitive positioning. Its core learning needs are: deep single-solution value proposition; use-case and application selling; competitive differentiation; solution discovery and qualification; scope, pricing and business-case contribution.'
    home_domain: adobe
    status: canonical
  - id: coe:entity/adobe/seller_persona/technical_pre_sales
    label: Technical Pre-Sales
    description: 'An Adobe seller learner persona that wins the technical decision – technical discovery, demo mastery, validation, and architecture guidance. Its core learning needs are: technical discovery and requirements shaping; demo mastery and technical storytelling; technical validation and proof; architecture patterns and integration (architect tier); strong pre-sales to post-sales handoff.'
    home_domain: adobe
    status: canonical
    examples:
    - 'Emily Scott, early-career SC'
    - 'Mark Davis, experienced SC'
  - id: coe:entity/adobe/seller_persona/post_sale_growth_and_renewal
    label: Post-Sale Growth & Renewal
    description: 'An Adobe seller learner persona that drives adoption, value realisation, retention, renewal and expansion across the installed base. Its core learning needs are: onboarding and adoption strategy; value realisation and customer outcomes; health and risk signals and escalation; renewal motion and commercial hygiene; expansion and cross-sell identification.'
    home_domain: adobe
    status: canonical
  - id: coe:entity/adobe/seller_persona/partner_sales
    label: Partner Sales
    description: 'An Adobe seller learner persona that builds partner GTM, joint pipeline and partner enablement across the ecosystem. Its core learning needs are: partner strategy and joint GTM; partner pipeline creation and whitespace; partner accountability and practice development; enablement of partner sellers.'
    home_domain: adobe
    status: canonical
- id: coe:artifact/adobe/customer_personas
  label: Adobe Customer Learner Personas
  description: 'The four need-by-depth learner personas Adobe designs customer-facing education, adoption and value-realisation content toward — the customer sibling of the seller personas, designed for value realisation rather than field readiness.'
  last_updated: '2026-09-24'
  home_domain: adobe
  status: canonical
  entities:
  - id: coe:entity/adobe/customer_persona/executive_sponsor
    label: Executive Sponsor
    description: 'An Adobe customer learner persona for the senior customer leader accountable for the investment and its value case, who sponsors adoption across their organisation and owns the renewal and expansion decision context. Its core learning needs are: value narrative and business-case fluency for the Adobe investment; outcome and value measurement (what good looks like, how it is evidenced); organisational adoption sponsorship (what to mandate, fund and remove as blockers); roadmap and capability awareness at decision altitude.'
    home_domain: adobe
    status: canonical
    terms:
    - literal: 'Executive'
      term_type: full_form
      term_status: admitted
    - literal: 'Decision Maker'
      term_type: full_form
      term_status: admitted
    - literal: 'Leader'
      term_type: full_form
      term_status: admitted
  - id: coe:entity/adobe/customer_persona/platform_administrator
    label: Platform Administrator
    description: 'An Adobe customer learner persona that operates and governs the deployed Adobe product day to day – configuration, users and permissions, data hygiene, governance and release readiness. Its core learning needs are: configure and govern the platform to organisational policy; user, permission and licence administration; data governance, privacy and consent operations; release/feature-change management and internal support.'
    home_domain: adobe
    status: canonical
    terms:
    - literal: 'Admin'
      term_type: full_form
      term_status: admitted
      usage_note: 'Here a label in Adobe Standardized Customer Personas, for an IT or business user responsible for deployment and user access; also a label in Experience League ''CREATED FOR'' Role Labels. The same name also refers to Platform Admin.'
  - id: coe:entity/adobe/customer_persona/implementer
    label: Implementer / Integrator
    description: 'An Adobe customer learner persona that builds, integrates and extends the Adobe product within the customer''s architecture – customer-side developers, architects and data engineers (and equivalent partner delivery roles working in the customer''s environment). Its core learning needs are: implement and integrate the product within the existing architecture; APIs, SDKs and extensibility patterns; data architecture, ingestion and identity design; troubleshooting, performance and upgrade paths.'
    home_domain: adobe
    status: canonical
    terms:
    - literal: 'Developer'
      term_type: full_form
      term_status: admitted
    - literal: 'Architect'
      term_type: full_form
      term_status: admitted
    - literal: 'Data Architect'
      term_type: full_form
      term_status: admitted
      usage_note: 'Here a label in Experience League ''CREATED FOR'' Role Labels. The same name also refers to Customer Data Engineer.'
    - literal: 'Data Engineer'
      term_type: full_form
      term_status: admitted
  - id: coe:entity/adobe/customer_persona/business_practitioner
    label: Business Practitioner
    description: 'An Adobe customer learner persona that uses the Adobe product in their daily work to produce business output – marketers, analysts, campaign and journey managers, content authors. Its core learning needs are: apply the product effectively in the daily workflow; execute core use cases (campaigns, journeys, content, analysis) to a good standard; interpret results and optimise; absorb new features that change how the daily job is done.'
    home_domain: adobe
    status: canonical
    terms:
    - literal: 'Super User'
      term_type: full_form
      term_status: admitted
    - literal: 'User'
      term_type: full_form
      term_status: admitted
      usage_note: 'Here a label in Adobe Standardized Customer Personas, for a daily hands-on user of Adobe solutions; also a label in Experience League ''CREATED FOR'' Role Labels. The same name also refers to User.'
    - literal: 'Business User'
      term_type: full_form
      term_status: admitted
    - literal: 'Marketer'
      term_type: full_form
      term_status: admitted
      usage_note: 'Here a label in Experience League ''CREATED FOR'' Role Labels. The same name also refers to Marketing Practitioner.'
- id: coe:artifact/adobe/seller_roles
  label: Adobe Field Roles
  description: 'Adobe''s normalised field-role taxonomy, retained as a crosswalk: each role that is designed for resolves to one seller learner persona, and operations, marketing and change-impact roles are kept for communications and readiness only.'
