    description: 'An Adobe field role in the core sellers and account owners family responsible for overall account leadership, ecosystem orchestration, executive relationships, forecast discipline; it resolves to the Commercial Account Seller learner persona.'
    home_domain: adobe
    status: canonical
    terms:
    - literal: 'AD'
      term_type: initialism
      term_status: admitted
    edges:
    - subject_id: coe:entity/adobe/seller_role/account_director
      predicate: coe:specialises
      object_id: coe:entity/adobe/seller_persona/commercial_account_seller
      relationship_weight: required
      description: 'The Account Director role resolves to the Commercial Account Seller learner persona in Adobe''s role-to-persona crosswalk.'
