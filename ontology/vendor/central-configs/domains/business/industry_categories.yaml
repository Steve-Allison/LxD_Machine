_meta:
  file_id: coe:file/domain/business/industry_categories
  title: Business — Industry Categories
  last_updated: '2026-09-23'
  authority: Central_Configs
  scope: domain
  ontology_domain: business
  governing_class: coe:DomainModule
module_id: coe:module/business/industry_categories
domain: business
industry_categories:
- id: coe:entity/business/customer_data_platform
  label: Customer Data Platform
  description: A system that unifies customer data from many sources into persistent, addressable individual profiles
    available for segmentation and activation.
  home_domain: business
  status: canonical
  terms:
  - literal: CDP
    term_type: initialism
    term_status: admitted
- id: coe:entity/business/digital_experience_platform
  label: Digital Experience Platform
  description: An integrated platform for building, managing, personalising and optimising digital experiences across
    channels.
  home_domain: business
  status: canonical
  terms:
  - literal: DXP
    term_type: initialism
    term_status: admitted
- id: coe:entity/business/digital_asset_management
  label: Digital Asset Management
  description: A system for storing, tagging, governing and distributing digital assets at enterprise scale so approved
    assets are findable and reusable.
  home_domain: business
  status: canonical
  terms:
  - literal: DAM
    term_type: acronym
    term_status: admitted
- id: coe:entity/business/headless_cms
  label: Headless CMS
  description: A content-management system that stores and serves content through APIs without prescribing the
    presentation layer, leaving rendering to any front end.
  home_domain: business
  status: canonical
- id: coe:entity/business/marketing_automation
  label: Marketing Automation
  description: Software that automates repeatable marketing work — email sequences, lead nurturing, scoring and campaign
    triggers — across the funnel.
  home_domain: business
  status: canonical
- id: coe:entity/business/customer_engagement_platform
  label: Customer Engagement Platform
  description: A system for managing ongoing, two-way customer interactions across channels — messages, offers and
    journeys that respond to individual behaviour.
  home_domain: business
  status: canonical
  terms:
  - literal: CEP
    term_type: initialism
    term_status: admitted
- id: coe:entity/business/content_delivery_network
  label: Content Delivery Network
  description: A geographically distributed network of edge servers that caches and serves content close to users for
    speed and resilience.
  home_domain: business
  status: canonical
  terms:
  - literal: CDN
    term_type: initialism
    term_status: admitted
- id: coe:entity/business/personalization_engine
  label: Personalization Engine
  description: A decisioning system that selects the content, offer or experience each individual receives from profile
    and behavioural data.
  home_domain: business
  status: canonical
