module_id: coe:module/business/practices
domain: business
practices:
- id: coe:entity/business/a_b_testing
  label: A/B Testing
  description: The controlled-experiment method that splits traffic between two experience variants and measures which
    performs better against a defined goal metric before rolling the winner out.
  home_domain: business
  status: canonical
- id: coe:entity/business/multivariate_testing
  label: Multivariate Testing
  description: The experiment method that varies several elements of an experience at once to find the best-performing
    combination and each element's contribution.
  home_domain: business
  status: canonical
- id: coe:entity/business/journey_orchestration
  label: Journey Orchestration
  description: Coordinating each individual customer's next interaction across channels in response to their real-time
    behaviour and state, rather than broadcasting the same campaign to a whole segment.
  home_domain: business
  status: canonical
- id: coe:entity/business/campaign_management
  label: Campaign Management
  description: Planning, executing and measuring outbound marketing campaigns across segments and channels — audience
    selection, scheduling, delivery and response tracking.
  home_domain: business
  status: canonical
- id: coe:entity/business/lead_scoring
  label: Lead Scoring
  description: Ranking prospects by fit and engagement signals so sales effort concentrates on the leads most likely to
    convert.
  home_domain: business
  status: canonical
- id: coe:entity/business/attribution_modeling
  label: Attribution Modeling
  description: Assigning conversion credit across the marketing touchpoints that preceded an outcome — first-touch,
    last-touch or multi-touch — to reveal which activity drove results.
  home_domain: business
  status: canonical
- id: coe:entity/business/customer_journey_mapping
  label: Customer Journey Mapping
  description: Charting the end-to-end sequence of interactions a customer has with a brand across channels and time to
    expose gaps, friction and the moments that decide the relationship.
  home_domain: business
  status: canonical
- id: coe:entity/business/audience_segmentation
  label: Audience Segmentation
  description: Dividing a customer base into groups that share attributes or behaviours so each group can be targeted with
    relevant experiences.
  home_domain: business
  status: canonical
- id: coe:entity/business/predictive_analytics
  label: Predictive Analytics
  description: Using statistical and machine-learning models over historical data to forecast customer behaviour — churn
    risk, conversion propensity, lifetime value — so action can be taken before the outcome occurs.
  home_domain: business
  status: canonical
- id: coe:entity/business/omnichannel_marketing
  label: Omnichannel Marketing
  description: Coordinating consistent, connected customer messaging across every channel — email, web, mobile, paid media,
    in person — as one continuous experience rather than running channels in isolation.
  home_domain: business
  status: canonical
