bundle_id: coe:domain/business/buyer_personas
domain: business
version: 4.0.0
entity_collections:
- id: coe:artifact/business/buyer_personas
  label: B2B Enterprise Buyer Personas
  description: CXO decision-makers, buying center archetypes, commercial priorities.
  version: 4.0.0
  last_updated: '2026-08-15'
  entities:
  - id: coe:entity/competitor_mention
    label: Competitor Mention
    description: Competitor product company HubSpot Salesforce Google Analytics Sitecore Shopify Canva Figma alternative vendor
    home_domain: business
    status: canonical
    recognition_patterns:
    - (?i)\bCompetitor\s+Mention\b
    edges: []
    ner_label: COMPETITOR
    examples:
    - HubSpot
    - Salesforce Marketing Cloud
    - Google Analytics
    - Sitecore
    - Canva
    confidence_threshold: 0.8
  - id: coe:entity/competitive_claim
    label: Competitive Claim
    description: Competitor comparison differentiation advantage better than versus alternative claim positioning
    home_domain: business
    status: canonical
    recognition_patterns:
    - (?i)\bCompetitive\s+Claim\b
    edges: []
    ner_label: COMPETITIVE_CLAIM
    examples:
    - Unlike HubSpot, Adobe offers...
    - While competitors require multiple tools...
    - Adobe is the only platform that...
    confidence_threshold: 0.7
  - id: coe:entity/objection
    label: Objection
    description: Customer objection concern hesitation pushback too expensive too complex switch cost
    home_domain: business
    status: canonical
    recognition_patterns:
    - (?i)\bObjection\b
    edges: []
    ner_label: OBJECTION
    examples:
    - Adobe is too expensive
    - We can't afford
    - Too complex for our team
    - We're happy with our current solution
    confidence_threshold: 0.65
- id: coe:artifact/business/sales_plays_and_market_competitors
  label: Enterprise Sales Plays & Market Competitor Ontologies
  description: Governed sales plays, strategic solution plays, and market competitors.
  version: 4.0.0
  last_updated: '2026-08-15'
  entities:
