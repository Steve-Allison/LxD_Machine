scoring_models:
- dimensions:
  - id: coe:artifact/business/elevator_pitch_rubric/dimension/time_to_value
    label: Time to Value
    description: 'Measures how quickly the pitch communicates its core value proposition. The best pitches follow BLUF (Bottom
      Line Up Front): the listener should understand what the product does and why it matters within the first two sentences.
      Source: Best-Practice Elevator Pitches.md'
    home_domain: business
    status: canonical
  - id: coe:artifact/business/elevator_pitch_rubric/dimension/core_message_clarity
    label: Core Message Clarity
    description: 'Evaluates whether the pitch communicates a single, coherent message in plain language tailored to the audience.
      The pitch carries one governing thought; several competing thoughts all lose. Source: Best-Practice
      Elevator Pitches.md; Best-Practice Product Descriptions.md'
    home_domain: business
    status: canonical
  - id: coe:artifact/business/elevator_pitch_rubric/dimension/differentiation
    label: Differentiation
    description: 'Assesses whether the pitch clearly establishes what makes the offering distinct from alternatives. Generic
      pitches that apply equally to any competitor provide no reason to choose. Differentiation must be specific, benefit-tied,
      and credible. Source: Best-Practice Elevator Pitches.md; Best-Practice Product Descriptions.md'
    home_domain: business
    status: canonical
  - id: coe:artifact/business/elevator_pitch_rubric/dimension/cta_quality
    label: Call-to-Action Quality
    description: 'Evaluates whether the pitch closes with a clear, specific, low-friction next step appropriate to the pitch
      context. The CTA should feel logically implied by the pitch — earned, not bolted on. Nudge theory applies: present a
      choice architecture where the easy option is to agree to a follow-up. Source: Best-Practice Elevator Pitches.md; Research
      - Using SOAR Storytelling most effectively.md'
    home_domain: business
    status: canonical
  - id: coe:artifact/business/elevator_pitch_rubric/dimension/memorability
    label: Memorability
    description: 'Assesses whether the pitch uses language, structure, and story elements that make it stick after the conversation
      ends. Based on Heath & Heath (2007) SUCCESs framework: Simple, Unexpected, Concrete, Credible, Emotional, Stories. A
      pitch that is forgotten fails regardless of quality. Source: Best-Practice Elevator Pitches.md; Research - Using SOAR
      Storytelling most effectively.md'
    home_domain: business
    status: canonical
  last_updated: '2026-09-25'
  id: coe:artifact/business/elevator_pitch_rubric
