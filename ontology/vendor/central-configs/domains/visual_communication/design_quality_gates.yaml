_meta:
  file_id: coe:file/domain/visual_communication/design_quality_gates
  title: Visual Communication — Design Quality Gates
  last_updated: '2026-09-02'
  authority: Central_Configs
  scope: domain
  ontology_domain: visual_communication
  governing_class: coe:DomainModule
module_id: coe:module/visual_communication/design_quality_gates
domain: visual_communication
scoring_models:
- dimensions:
  - id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/chart_type_appropriateness
    label: Chart Type Appropriateness
    description: 'Degree to which the selected chart type matches the analytical task (lookup, comparison, trend, composition,
      correlation, distribution). Based on Vessey''s Cognitive Fit Theory: performance is maximised only when the visual representation
      aligns with the task the viewer must perform.'
    home_domain: visual_communication
    status: canonical
  - id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/data_ink_ratio
    label: Data-Ink Ratio
    description: 'Proportion of visual ink actually encoding data versus total ink in the graphic; its target ratio is library
      knowledge. Chartjunk (3D effects, decorative fills, heavy gridlines, moiré patterns, redundant tick marks, background
      fills) is extraneous cognitive load and must be eliminated. Formula: Data-Ink / Total Ink used to print the graphic.'
    home_domain: visual_communication
    status: canonical
  - id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/labelling_clarity
    label: Labelling Clarity
    description: Quality of axis labels, data labels, title informativeness, and absence of separate legends requiring lookup.
      Direct labelling eliminates the split-attention effect where the viewer must split gaze between a legend and the data
      series to decode colour mapping. Titles must state the analytical conclusion (action caption), not merely describe the
      subject.
    home_domain: visual_communication
    status: canonical
  - id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/colour_accessibility
    label: Colour Accessibility
    description: 'Use of colorblind-safe palettes, adequate contrast ratios for chart elements per WCAG 2.1 AA, and avoidance
      of colour as the sole encoding channel. A material share of viewers have colour vision deficiency, its prevalence
      library knowledge; red-green combinations are the most common failure mode. Redundant encoding (colour +
      shape/pattern/label) is required for accessible charts.'
    home_domain: visual_communication
    status: canonical
  - id: coe:artifact/visual_communication/data_visualisation_rubric/dimension/insight_communication
    label: Insight Communication
    description: Degree to which the chart's title and annotations communicate the key analytical conclusion rather than merely
      labelling the subject matter. A Topic Title ('Q4 Revenue') forces the viewer to analyse and conclude. An Action Caption
      ('Q4 Revenue Grew, Driven by the Premium Segment') transfers the conclusion instantly, reducing cognitive load and
      increasing decision-making speed. Annotation quality and key takeaway visibility are also assessed.
    home_domain: visual_communication
    status: canonical
  last_updated: '2026-09-02'
  id: coe:artifact/visual_communication/data_visualisation_rubric
  label: Data Visualisation Rubric
  description: Scoring rubric for data visualisation quality covering chart type appropriateness, data-ink ratio, labelling
    clarity, colour accessibility, and insight communication
  home_domain: visual_communication
  status: canonical
- dimensions:
  - id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/audio_clarity
    label: Audio Clarity
    description: Evaluates voice quality, background noise floor, volume consistency, articulation clarity, and compression/EQ
      treatment. Crisp audio is the single highest-leverage production variable for learner engagement.
    home_domain: visual_communication
    status: canonical
  - id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/visual_narration_sync
    label: Visual-Narration Synchronisation
    description: Evaluates temporal alignment of visuals with speech, spatial placement of on-screen text relative to corresponding
      graphics, verbal-visual channel balance, and signalling cues that direct learner attention. Directly maps to Mayer's
      temporal contiguity and spatial contiguity principles.
    home_domain: visual_communication
    status: canonical
  - id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/segment_pacing
    label: Segment Pacing
    description: Evaluates video segment lengths against engagement research, information density per minute, learner cognitive
      load management, and presence of reflection pause cues; the engagement median and the segment ceilings it implies
      are library knowledge.
    home_domain: visual_communication
    status: canonical
  - id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/transition_quality
    label: Transition Quality
    description: Evaluates scene-to-scene cut quality, topic transition signposting, visual continuity across angles and backgrounds,
      and use of B-roll or cutaways to maintain coherence. Research shows establishing shots before transitions reduce cognitive
      load; consistent transition style creates predictable mental checkpoints.
    home_domain: visual_communication
    status: canonical
  - id: coe:artifact/visual_communication/video_multimedia_rubric/dimension/production_value
    label: Production Value
    description: 'Evaluates technical output quality: video resolution, camera framing, lighting quality, graphics fidelity,
      and brand consistency. High production value signals credibility and maintains learner attention.'
    home_domain: visual_communication
    status: canonical
  last_updated: '2026-09-02'
  id: coe:artifact/visual_communication/video_multimedia_rubric
  label: Video and Multimedia Rubric
  description: Scoring rubric for video and multimedia production quality covering audio clarity, visual-narration synchronisation,
    segment pacing, transition quality, and production value
  home_domain: visual_communication
  status: canonical
