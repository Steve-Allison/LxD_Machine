    - (decorative|ornamental) (background|border|element) (on|in) (chart|graph)
    id: coe:entity/chartjunk
    label: Chartjunk
    description: Any visual element in a chart that does not represent data and therefore distracts from the message (Tufte).
      Includes 3D effects, moire patterns, heavy gridlines, decorative backgrounds, separate legends. Classification as pure
      source of extraneous cognitive load.
    home_domain: visual_communication
    status: canonical
    edges: []
