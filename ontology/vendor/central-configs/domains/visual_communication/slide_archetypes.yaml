    id: coe:entity/white_space
    label: White Space
    description: An active design tool, not empty space. Functions include isolating elements, providing breathing room, and
      strengthening focal points by eliminating nearby attention competitors. Recommended 40-60% of slide area. Margin whitespace
      15-20% each side.
    home_domain: visual_communication
    status: canonical
    edges: []
    ner_label: WHITE_SPACE
    examples:
