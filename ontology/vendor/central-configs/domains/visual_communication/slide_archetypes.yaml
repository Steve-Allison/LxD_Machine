    id: coe:entity/focal_point
    label: Focal Point
    description: The single dominant visual element on a slide that anchors audience attention. Created through contrast (color,
      size, boldness). Every slide must have exactly one focal point. Absence of a focal point causes audience scanning confusion
      and increased extraneous cognitive load.
    home_domain: visual_communication
    status: canonical
    edges: []
    ner_label: FOCAL_POINT
    examples:
    - the hero image is the focal point
    - make the chart the focal point of this slide
    - the title serves as the focal point
    anti_examples:
    - focus on the main topic
    - the focal area of the research
    confidence_threshold: 0.7
  - aliases:
