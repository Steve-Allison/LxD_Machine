bundle_id: coe:domain/visual_communication/mayer_principles
domain: visual_communication
version: 4.0.0
entity_collections:
- id: coe:artifact/visual_communication/mayer_principles
  label: Mayer's 12 Principles of Multimedia Learning
  description: Cognitive principles governing visual-verbal integration and cognitive load.
  version: 4.0.0
  last_updated: '2026-08-15'
  entities:
  - id: coe:entity/mayer_coherence_principle
    label: Coherence Principle
    description: People learn better when extraneous words, pictures, and sounds are excluded rather than included.
    home_domain: visual_communication
    recognition_patterns:
    - (?i)\bcoherence principle\b
    - (?i)\bexclude extraneous\b
    edges: []
  - id: coe:entity/mayer_signaling_principle
    label: Signaling Principle
    description: People learn better when cues that highlight the organization of the essential material are added.
    home_domain: visual_communication
    recognition_patterns:
    - (?i)\bsignaling principle\b
    - (?i)\bvisual cueing\b
    edges: []
  - id: coe:entity/mayer_redundancy_principle
    label: Redundancy Principle
    description: People learn better from graphics and narration than from graphics, narration, and on-screen text.
    home_domain: visual_communication
    recognition_patterns:
    - (?i)\bredundancy principle\b
    edges: []
  - id: coe:entity/mayer_spatial_contiguity_principle
    label: Spatial Contiguity Principle
    description: People learn better when corresponding words and pictures are presented near rather than far from each other
      on the page or screen.
    home_domain: visual_communication
    recognition_patterns:
    - (?i)\bspatial contiguity\b
    edges: []
