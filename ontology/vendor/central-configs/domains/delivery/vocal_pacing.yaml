  description: Speaking rate, strategic pause, acoustic pitch standards.
  last_updated: '2026-08-15'
  entities:
  - id: coe:entity/target_speaking_rate
    label: Target Speaking Rate
    description: Speech velocity a delivery context calls for, expressed as a band rather than a point; the band differs between live conversational, live persuasive and narrated instructional delivery and is bounded above by the rate at which listeners can no longer process what is said. Which band applies is a measured finding owned by the evidence and by the tool that measures speech, not by this definition.
    home_domain: delivery
    edges: []
    status: canonical
  - id: coe:entity/strategic_pause
    label: Strategic Pause
    description: Deliberate silence placed after a key assertion so the audience can consolidate it before the speaker moves on; its duration band is library knowledge.
    home_domain: delivery
    edges: []
    status: canonical
  home_domain: delivery
