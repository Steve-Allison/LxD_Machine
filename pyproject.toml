[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name    = "lxd-machine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "blake3>=1.0",
    "docling>=2.0",
    "docling-core>=2.0",
    "fastmcp>=3.0",
    "httpx>=0.28",
    "lancedb>=0.21",
    "networkx>=3.4",
    "ollama",
    "openai>=1.0",
    "pyahocorasick>=2.0",
    "pydantic>=2.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=14.0",
    "semchunk>=3.2",
    "structlog>=24.4",
    "tiktoken>=0.9",
    "transformers>=5.0,<6.0",
    "tree-sitter>=0.24",
    "tree-sitter-c>=0.24",
    "tree-sitter-java-orchard>=0.0.10",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lxd"]

[tool.ruff]
line-length    = 100
target-version = "py314"

[tool.ruff.lint]
select  = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF", "PL", "PERF"]
ignore  = [
    "E501",
    "TC001",  # pydantic resolves types at runtime — moving to TYPE_CHECKING breaks it
    "TC002",
    "TC003",
    "PLR0911", # too many returns — query/formatter code is legitimately branchy
    "PLR0912", # too many branches — same rationale as PLR0911
    "PLR0913", # too many arguments — ingest pipelines have many stores
    "PLR0915", # too many statements — split later, not in Wave 7
    "PLR2004", # magic values — pervasive in tests and tight inner loops
    "PLW0603", # global statement — used intentionally for client reuse
    "PLC0415", # inline imports — some entry points still need lazy imports
    "RUF001",  # ambiguous unicode — emdashes in user-facing strings are intentional
    "RUF003",  # same, but in comments
    "PERF401", # list-comprehension suggestion — not always clearer
]

[tool.pyright]
pythonVersion                = "3.14"
venvPath                     = ".pixi/envs"
venv                         = "default"
typeCheckingMode             = "strict"
include                      = ["src"]
reportMissingImports         = true
reportMissingTypeStubs       = false  # ahocorasick, networkx, blake3, lancedb have no stubs
reportUnknownVariableType    = false  # untyped C extensions (ahocorasick, networkx)
reportUnknownMemberType      = false  # untyped C extension method calls
reportUnknownArgumentType    = false  # passing untyped objects to typed functions
reportUnknownParameterType   = false  # parameters typed by untyped libraries
reportMissingTypeArgument    = false  # networkx DiGraph[NodeType, EdgeType] — not required here
reportUntypedFunctionDecorator = false  # FastMCP decorators are currently untyped
reportUnusedFunction           = false  # MCP tool functions are registered via @mcp.tool decorator

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers = [
    "unit: isolated tests that exercise pure functions and small classes without touching disk or network",
    "integration: tests that wire multiple components together using temp dirs, SQLite, LanceDB, or the local FastMCP runtime",
    "e2e: end-to-end tests that drive CLI entrypoints or MCP tool transcripts against a seeded corpus",
    "property: Hypothesis property-based tests — typically deterministic invariants, not randomised fuzzing in CI",
    "benchmark: pytest-benchmark performance regression gates; run explicitly via --benchmark-enable",
    "slow: long-running tests skipped from the default suite (use -m slow to enable)",
]
