[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name    = "lxd-machine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "blake3>=1.0",
    "docling>=2.0",
    "docling-core>=2.0",
    "fastmcp>=3.0",
    "httpx>=0.28",
    "lancedb>=0.21",
    "networkx>=3.4",
    "ollama",
    "openai>=1.0",
    "pyahocorasick>=2.0",
    "pydantic>=2.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=14.0",
    "semchunk>=3.2",
    "structlog>=24.4",
    "tiktoken>=0.9",
    "transformers>=5.0,<6.0",
    "tree-sitter>=0.24",
    "tree-sitter-c>=0.24",
    "tree-sitter-java-orchard>=0.0.10",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lxd"]

[tool.ruff]
line-length    = 100
target-version = "py314"

[tool.ruff.lint]
select  = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore  = [
    "E501",
    "TC001",  # pydantic resolves types at runtime — moving to TYPE_CHECKING breaks it
    "TC002",
    "TC003",
]

[tool.pyright]
pythonVersion                = "3.14"
venvPath                     = ".pixi/envs"
venv                         = "default"
typeCheckingMode             = "strict"
include                      = ["src"]
reportMissingImports         = true
reportMissingTypeStubs       = false  # ahocorasick, networkx, blake3, lancedb have no stubs
reportUnknownVariableType    = false  # untyped C extensions (ahocorasick, networkx)
reportUnknownMemberType      = false  # untyped C extension method calls
reportUnknownArgumentType    = false  # passing untyped objects to typed functions
reportUnknownParameterType   = false  # parameters typed by untyped libraries
reportMissingTypeArgument    = false  # networkx DiGraph[NodeType, EdgeType] — not required here
reportUntypedFunctionDecorator = false  # FastMCP decorators are currently untyped
reportUnusedFunction           = false  # MCP tool functions are registered via @mcp.tool decorator

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
